# xhaip Portal Service
apiVersion: v1
kind: Service
metadata:
  name: xhaip-portal
  namespace: xhaip
  labels:
    app: xhaip-portal
spec:
  type: ClusterIP
  ports:
  - port: 8769
    targetPort: 8769
    protocol: TCP
    name: http
  selector:
    app: xhaip-portal
---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xhaip-portal-hpa
  namespace: xhaip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xhaip-portal
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
