# xhaip Secret — sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: xhaip-secret
  namespace: xhaip
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-this-to-a-random-string-in-production"
  ENCRYPTION_KEY: "change-this-to-a-random-string-in-production"
  HAIP_ADMIN_PASSWORD: "Admin@123456"
  DEEPSEEK_API_KEY: "your-api-key-here"
  DATABASE_URL: "postgresql+asyncpg://xhaip:xhaip-pass@postgres:5432/xhaip"
