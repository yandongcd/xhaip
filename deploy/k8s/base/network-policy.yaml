# NetworkPolicy — restrict cross-service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xhaip-network-policy
  namespace: xhaip
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - port: 8769
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: xhaip-portal
    ports:
    - port: 8769
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - port: 6379
      protocol: TCP
