name: joint-surgery
cn_name: 关节与骨病外科智能体
version: 1.0.0
type: business
department: 关节与骨病外科
port: 8861
aliases:
- 关节外科
- 关节骨科
- 关节与骨病
- joint-surgery
- joint
prompt:
  system: 你是南方医院关节与骨病外科AI助手，负责关节与骨病外科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
  max_tokens: 4096
depends_on:
- agent: medical-record
  version: '>=1.0'
- agent: anesthesia
  version: '>=1.0'
- agent: cardio-risk
  version: '>=1.0'
tools:
- name: harris_hip_score
  description: Harris髋关节评分(疼痛/功能/畸形/活动度四域, 0-100分, 输出分级)
  handler: joint_surgery.harris_hip_score
  input:
    pain_level: str
    gait: str
    support: str
    walking_distance: str
    stairs: str
    sitting: str
    shoes_socks: str
    public_transport: str
    fixed_flexion: int
    fixed_abduction: int
    fixed_adduction: int
    fixed_internal_rotation: int
    leg_length_discrepancy_cm: float
    flexion_rom: int
    abduction_rom: int
    adduction_rom: int
    external_rotation_rom: int
    internal_rotation_rom: int
  inference_tier: T0
- name: kss_score
  description: KSS膝关节评分(临床0-100+功能0-100双表)
  handler: joint_surgery.kss_score
  input:
    pain: int
    rom_degrees: int
    mediolateral_stability_mm: int
    anteroposterior_stability_mm: int
    flexion_contracture_deg: int
    extensor_lag_deg: int
    alignment_degrees: int
    walk_blocks: int
    stairs_up_down: int
    walking_aid: str
  inference_tier: T0
- name: pji_diagnosis
  description: 假体周围感染MSIS/ICM 2018诊断(主要+次要标准计分, 判定感染/可疑/排除)
  handler: joint_surgery.pji_diagnosis
  input:
    sinus_tract: bool
    positive_cultures: int
    same_organism: bool
    crp: float
    esr: float
    synovial_wbc: float
    pmn_pct: float
    alpha_defensin_positive: bool
    frozen_section_positive: bool
    intraop_purulence: bool
    d_dimer: float
  inference_tier: T0
- name: tha_tka_planning
  description: THA/TKA置换术前规划(适应证核对+假体类型建议+骨水泥/生物固定)
  handler: joint_surgery.tha_tka_planning
  input:
    joint: str
    diagnosis: str
    age: int
    bmi: float
    infection_risk: str
    bone_quality: str
    deformity_degree: str
    prior_surgery: bool
  inference_tier: T0
- name: eras_pathway
  description: THA/TKA ERAS快速康复路径(术前宣教/氨甲环酸/早期下地/出院标准checklist)
  handler: joint_surgery.eras_pathway
  input:
    procedure: str
    patient_id: str
    age: int
    comorbidities: list
    current_phase: str
  inference_tier: T0
- name: revision_assessment
  description: 翻修评估(松动/磨损/不稳分型→翻修策略+骨缺损分级)
  handler: joint_surgery.revision_assessment
  input:
    joint: str
    issue_type: str
    lab_crp: float
    lab_esr: float
    symptoms: list
    xray_findings: list
    prior_revision_count: int
  inference_tier: T0
guard:
  triggers:
  - 手术
  - 感染
  - 翻修
  - 关节置换
  - 假体
  - 脱位
  high_risk_scenarios:
  - 假体周围感染急诊处理
  - 关节脱位急诊复位
  - 翻修术中大段骨缺损
  - 假体周围骨折
  citation:
    required: true
    min_sources: 1
    min_trust: T2
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: surgeon
    label: 手术医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: icu_doctor
    label: ICU医师
  - id: head_nurse
    label: 护士长
  - id: instrument_nurse
    label: 器械护士
  - id: rehab_therapist
    label: 康复师
stages:
- order: 1
  id: joint-eval
  label: 关节功能评估
  desc: Harris髋关节评分/KSS膝关节评分、MSIS/ICM 2018 PJI诊断标准、ASA分级、心肺功能
  role_ids:
  - attending
  - resident
  - anesthesiologist
- order: 2
  id: preop-plan
  label: 术前规划
  desc: 假体选择(Dorr骨质量→骨水泥/非骨水泥)、CR/PS/CCK决策、ERAS术前方案(TXA/塞来昔布)
  role_ids:
  - attending
  - surgeon
  - head_nurse
- order: 3
  id: surgery
  label: 手术执行
  desc: 入路选择(后外侧/直接前方/内侧髌旁)、软组织平衡、假体稳定性评估、TXA止血方案
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
- order: 4
  id: postop-early
  label: 术后早期
  desc: ERAS术后方案(多模式镇痛/VTE预防/感染监测)、24h内首次下床、引流管管理
  role_ids:
  - attending
  - resident
  - head_nurse
  - rehab_therapist
- order: 5
  id: rehab
  label: 康复训练
  desc: 关节活动度训练、肌力训练(股四头肌/臀中肌)、步态训练、日常生活能力恢复
  role_ids:
  - rehab_therapist
  - head_nurse
- order: 6
  id: followup
  label: 长期随访
  desc: Harris/KSS评分追踪、影像复查(假体松动/磨损/骨溶解)、翻修评估(松动/不稳/感染)、术后3/6/12月→年度
  role_ids:
  - attending
  - rehab_therapist
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
debate:
  enabled: true
  competitors:
  - anesthesia
  - cardio-risk
  mode: auto
trust_tier: deep
