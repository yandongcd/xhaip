name: joint-surgery
cn_name: 关节与骨病外科智能体
version: 1.0.0
type: business
department: 关节与骨病外科
port: 8843
aliases:
- 关节外科
- 关节骨科
- 关节与骨病
- joint-surgery
- joint
prompt:
  system: 你是南方医院关节与骨病外科AI助手，负责关节与骨病外科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
  max_tokens: 4096
depends_on:
- agent: medical-record
  version: '>=1.0'
- agent: anesthesia-risk
  version: '>=1.0'
- agent: cardio-risk
  version: '>=1.0'
tools:
- name: harris_hip_score
  description: Harris髋关节评分(疼痛/功能/畸形/活动度四域, 0-100分, 输出分级)
  handler: joint_surgery.harris_hip_score
  input:
    pain_level: str
    gait: str
    support: str
    walking_distance: str
    stairs: str
    sitting: str
    shoes_socks: str
    public_transport: str
    fixed_flexion: int
    fixed_abduction: int
    fixed_adduction: int
    fixed_internal_rotation: int
    leg_length_discrepancy_cm: float
    flexion_rom: int
    abduction_rom: int
    adduction_rom: int
    external_rotation_rom: int
    internal_rotation_rom: int
- name: kss_score
  description: KSS膝关节评分(临床0-100+功能0-100双表)
  handler: joint_surgery.kss_score
  input:
    pain: int
    rom_degrees: int
    mediolateral_stability_mm: int
    anteroposterior_stability_mm: int
    flexion_contracture_deg: int
    extensor_lag_deg: int
    alignment_degrees: int
    walk_blocks: int
    stairs_up_down: int
    walking_aid: str
- name: pji_diagnosis
  description: 假体周围感染MSIS/ICM 2018诊断(主要+次要标准计分, 判定感染/可疑/排除)
  handler: joint_surgery.pji_diagnosis
  input:
    sinus_tract: bool
    positive_cultures: int
    same_organism: bool
    crp: float
    esr: float
    synovial_wbc: float
    pmn_pct: float
    alpha_defensin_positive: bool
    frozen_section_positive: bool
    intraop_purulence: bool
    d_dimer: float
- name: tha_tka_planning
  description: THA/TKA置换术前规划(适应证核对+假体类型建议+骨水泥/生物固定)
  handler: joint_surgery.tha_tka_planning
  input:
    joint: str
    diagnosis: str
    age: int
    bmi: float
    infection_risk: str
    bone_quality: str
    deformity_degree: str
    prior_surgery: bool
- name: eras_pathway
  description: THA/TKA ERAS快速康复路径(术前宣教/氨甲环酸/早期下地/出院标准checklist)
  handler: joint_surgery.eras_pathway
  input:
    procedure: str
    patient_id: str
    age: int
    comorbidities: list
    current_phase: str
- name: revision_assessment
  description: 翻修评估(松动/磨损/不稳分型→翻修策略+骨缺损分级)
  handler: joint_surgery.revision_assessment
  input:
    joint: str
    issue_type: str
    lab_crp: float
    lab_esr: float
    symptoms: list
    xray_findings: list
    prior_revision_count: int
guard:
  triggers:
  - 手术
  - 感染
  - 翻修
  - 关节置换
  - 假体
  - 脱位
  high_risk_scenarios:
  - 假体周围感染急诊处理
  - 关节脱位急诊复位
  - 翻修术中大段骨缺损
  - 假体周围骨折
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: surgeon
    label: 手术医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: icu_doctor
    label: ICU医师
  - id: head_nurse
    label: 护士长
  - id: instrument_nurse
    label: 器械护士
  - id: rehab_therapist
    label: 康复师
stages:
- order: 1
  id: preop-eval
  label: 术前评估
  desc: GCS/ASA评分、影像学评估、凝血功能、心肺功能筛查、麻醉评估
  role_ids:
  - attending
  - resident
  - anesthesiologist
- order: 2
  id: preop-prep
  label: 术前准备
  desc: 备血交叉配血、预防性抗生素、深静脉穿刺、导尿、备皮
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 3
  id: surgery
  label: 手术执行
  desc: 术中监测、出血量评估、冰冻病理、器械清点
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
  - instrument_nurse
- order: 4
  id: postop-icu
  label: 术后监护
  desc: ICU监测、GCS追踪、ICP管理、引流管管理、电解质平衡
  role_ids:
  - attending
  - icu_doctor
  - head_nurse
- order: 5
  id: ward-care
  label: 病房管理
  desc: 切口护理、活动指导、营养支持、VTE预防、疼痛管理
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访康复
  desc: 神经功能评分、康复计划制定、术后1/3/6月随访、影像复查
  role_ids:
  - attending
  - rehab_therapist
  - head_nurse
