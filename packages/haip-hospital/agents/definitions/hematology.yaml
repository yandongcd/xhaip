name: hematology
cn_name: 血液内科智能体
version: 1.0.0
type: business
department: 血液内科
port: 8784
aliases:
- 血液内科
- hematology
prompt:
  system: 你是南方医院血液内科AI助手，负责血液内科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reception
  description: 接诊与初步评估
  handler: hematology.bp_reception
  input:
    patient_id: str
  inference_tier: T0
- name: bp_exam
  description: 辅助检查
  handler: hematology.bp_exam
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diagnosis
  description: 确诊与分型分期
  handler: hematology.bp_diagnosis
  input:
    patient_id: str
  inference_tier: T0
- name: bp_plan
  description: 治疗方案制定
  handler: hematology.bp_plan
  input:
    patient_id: str
  inference_tier: T0
- name: bp_treatment
  description: 治疗执行与监测
  handler: hematology.bp_treatment
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 随访与长期管理
  handler: hematology.bp_followup
  input:
    patient_id: str
  inference_tier: T0
- name: assess_anemia
  description: WHO贫血分级+类型判断(MCV)
  handler: hematology.assess_anemia
  input:
    patient_id: str
  inference_tier: T0
- name: assess_mds
  description: IPSS-R MDS预后评分
  handler: hematology.assess_mds
  input:
    patient_id: str
  inference_tier: T0
- name: assess_dic
  description: ISTH DIC诊断评分
  handler: hematology.assess_dic
  input:
    patient_id: str
  inference_tier: T0
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: head_nurse
    label: 护士长
  - id: head
    label: 科主任
stages:
- order: 1
  id: reception
  label: 接诊登记
  desc: 主诉采集、现病史、既往史、过敏史、体格检查
  role_ids:
  - attending
  - resident
  - head_nurse
  tool: bp_reception
- order: 2
  id: exam
  label: 辅助检查
  desc: 实验室检查、影像学检查、心电图、专科检查
  role_ids:
  - attending
  - resident
  tool: bp_exam
- order: 3
  id: diagnosis
  label: 诊断与分型
  desc: 明确诊断、疾病分型分期、鉴别诊断、合并症评估
  role_ids:
  - attending
  tool: bp_diagnosis
- order: 4
  id: treatment-plan
  label: 治疗方案
  desc: 制定个体化治疗方案、用药方案、非药物治疗、健康教育
  role_ids:
  - attending
  - head
  tool: bp_plan
- order: 5
  id: execution
  label: 治疗执行
  desc: 执行治疗方案、用药管理、病情监测、并发症预防
  role_ids:
  - attending
  - resident
  - head_nurse
  tool: bp_treatment
- order: 6
  id: followup
  label: 随访管理
  desc: 慢病随访、用药依从性、复查检验、生活方式指导
  role_ids:
  - attending
  - head_nurse
  tool: bp_followup
guard:
  triggers:
  - 诊断决策
  - 治疗方案
  high_risk_scenarios:
  - 诊断决策
  - 治疗方案
  citation:
    required: true
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: standard
