name: general-surgery
cn_name: 普通外科智能体
version: 1.0.0
type: business
department: 普通外科
port: 8791
aliases:
- 普通外科
- general-surgery
prompt:
  system: 你是南方医院普通外科AI助手，负责普通外科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reg
  description: 患者登记分诊
  handler: general_surgery.bp_reg
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diag
  description: 诊断评估
  handler: general_surgery.bp_diag
  input:
    patient_id: str
  inference_tier: T0
- name: bp_preop
  description: 术前准备
  handler: general_surgery.bp_preop
  input:
    patient_id: str
  inference_tier: T0
- name: bp_risk
  description: 风险评估
  handler: general_surgery.bp_risk
  input:
    patient_id: str
  inference_tier: T0
- name: bp_mdt
  description: MDT决策
  handler: general_surgery.bp_mdt
  input:
    patient_id: str
  inference_tier: T0
- name: bp_surgery
  description: 手术执行
  handler: general_surgery.bp_surgery
  input:
    patient_id: str
  inference_tier: T0
- name: bp_nursing
  description: 围术期护理
  handler: general_surgery.bp_nursing
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 术后随访
  handler: general_surgery.bp_followup
  input:
    patient_id: str
  inference_tier: T0
guard:
  triggers:
  - 手术决策
  high_risk_scenarios:
  - 手术并发症
  - 药物不良反应
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: surgeon
    label: 手术医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: icu_doctor
    label: ICU医师
  - id: head_nurse
    label: 护士长
  - id: instrument_nurse
    label: 器械护士
  - id: rehab_therapist
    label: 康复师
stages:
- order: 1
  id: preop-eval
  label: 术前评估
  desc: ASA分级、Alvarado/Tokyo指南评估、心肺功能筛查、麻醉评估、ERAS宣教
  role_ids:
  - attending
  - resident
  - anesthesiologist
- order: 2
  id: preop-prep
  label: 术前准备
  desc: 备血交叉配血、预防性抗生素、ERAS禁食禁饮方案、VTE预防(Caprini评分)
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 3
  id: surgery
  label: 手术执行
  desc: 术中监测、出血量评估、腹腔镜/开放入路决策、吻合口质量评估、器械清点
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
  - instrument_nurse
- order: 4
  id: postop-care
  label: 术后管理
  desc: 引流管管理、切口护理、肠功能恢复(肠鸣音/排气)、电解质平衡、ERAS早期进食
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 5
  id: ward-recovery
  label: 病房康复
  desc: 活动指导(术后24h下床)、营养支持、VTE预防、疼痛管理(多模式镇痛)、并发症筛查(吻合口漏/SSI)
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访康复
  desc: 肿瘤标志物(CEA/CA19-9)随访、疝复发监测、术后1/3/6月随访、影像复查
  role_ids:
  - attending
  - head_nurse
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
debate:
  enabled: true
  competitors:
  - cardio-risk
  - anesthesia
  - pharmacy
  mode: auto
trust_tier: deep
