name: acute-pain
cn_name: 急性疼痛评估与管理
version: "1.0.0"
type: specialist
port: 8841
aliases: [急性疼痛, acute-pain]
parent: pain-hub

prompt:
  system: |
    你是急性疼痛管理专家，负责术后疼痛、创伤疼痛的评估与镇痛方案制定。
    使用VAS/NRS评分标准，提供PCA镇痛方案。
  temperature: 0.3

tools:
  - name: assess_acute
    description: 急性疼痛综合评估 (NRS/VAS + 神经病理检测)
    handler: acute_pain.assess
    input: {patient_id: str, vas_score: int, description: str}

  - name: manage_pca
    description: PCA镇痛方案 (剂量/年龄/肾功能调整)
    handler: acute_pain.pca
    input: {patient_id: str, age: int, weight_kg: float, renal_ok: bool}

  - name: detect_crisis
    description: 疼痛危象检测 (骨筋膜室/动脉栓塞)
    handler: acute_pain.crisis
    input: {patient_id: str, symptoms: list}

guard:
  triggers: [药物交互]
  high_risk_scenarios:
    - 骨筋膜室综合征
    - 阿片类药物呼吸抑制
