name: vascular-surgery
cn_name: 血管外科智能体
version: 1.0.0
type: business
department: 血管外科
port: 8795
aliases:
- 血管外科
- vascular-surgery
prompt:
  system: 你是南方医院血管外科AI助手，负责血管外科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reg
  description: 患者登记分诊
  handler: vascular_surgery.bp_reg
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diag
  description: 诊断评估
  handler: vascular_surgery.bp_diag
  input:
    patient_id: str
  inference_tier: T0
- name: bp_preop
  description: 术前准备
  handler: vascular_surgery.bp_preop
  input:
    patient_id: str
  inference_tier: T0
- name: bp_risk
  description: 风险评估
  handler: vascular_surgery.bp_risk
  input:
    patient_id: str
  inference_tier: T0
- name: bp_mdt
  description: MDT决策
  handler: vascular_surgery.bp_mdt
  input:
    patient_id: str
  inference_tier: T0
- name: bp_surgery
  description: 手术执行
  handler: vascular_surgery.bp_surgery
  input:
    patient_id: str
  inference_tier: T0
- name: bp_nursing
  description: 围术期护理
  handler: vascular_surgery.bp_nursing
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 术后随访
  handler: vascular_surgery.bp_followup
  input:
    patient_id: str
  inference_tier: T0
guard:
  triggers:
  - 手术决策
  high_risk_scenarios:
  - 手术并发症
  - 药物不良反应
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: surgeon
    label: 手术医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: icu_doctor
    label: ICU医师
  - id: head_nurse
    label: 护士长
  - id: instrument_nurse
    label: 器械护士
  - id: rehab_therapist
    label: 康复师
  - id: cardiologist
    label: 心内科医师
    emoji: ❤️
stages:
- order: 1
  id: vascular-eval
  label: 血管评估
  desc: Rutherford PAD分级(0-6)、ABI测量、NASCET/ECST颈动脉狭窄度、Wells DVT评分、CEAP静脉分级
  role_ids:
  - attending
  - resident
  - cardiologist
- order: 2
  id: preop-plan
  label: 术前规划
  desc: 抗凝方案(ACT>250肝素化)、AAA直径监测(男>55/女>50mm)、EVAR vs OR决策、移植血管选择
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
- order: 3
  id: surgery
  label: 手术/介入执行
  desc: CEA纵切/外翻式、EVAR支架释放、血管吻合、远端灌注监测(踝部多普勒)
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
- order: 4
  id: postop-monitor
  label: 术后监测
  desc: 外周动脉搏动监测(q15min→q1h)、缺血再灌注疼痛管理、移植物血栓筛查、抗凝管理
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 5
  id: recovery
  label: 康复期
  desc: 抗血小板/抗凝长期方案、血压控制(目标<130/80)、血脂管理、戒烟辅导
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访监测
  desc: DUS超声(1/6/12月→年度)、PSV比值>2.5提示>50%再狭窄、移植物通畅率、AAA瘤囊回缩
  role_ids:
  - attending
  - resident
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
debate:
  enabled: true
  competitors:
  - cardio-risk
  - anesthesia
  mode: auto
trust_tier: deep
