name: cardiology
cn_name: 心血管内科智能体
version: "1.0.0"
type: business
department: 心血管内科
port: 8900
aliases: [心血管内科, cardiology]

prompt:
  system: |
    你是南方医院心血管内科AI助手，负责心血管内科常见疾病的诊疗评估和管理。
    请基于相关临床指南给出专业建议。
  temperature: 0.3

tools:
  - name: diagnose
    description: 诊断评估
    handler: cardiology.diagnose
    input: {patient_id: str}

  - name: treatment_plan
    description: 治疗方案
    handler: cardiology.plan
    input: {patient_id: str}

  - name: followup_mgmt
    description: 慢病随访
    handler: cardiology.followup
    input: {patient_id: str}


ui:
  template: chat-with-role-switcher
  roles:
    - {id: attending, label: 主治医师, default: true}
    - {id: resident, label: 住院医师}
    - {id: head_nurse, label: 护士长}
    - {id: head, label: 科主任}

stages:
  - order: 1
    id: bp-reception
    label: 接诊与初步评估
    desc: "接诊与初步评估流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 2
    id: bp-exam
    label: 辅助检查
    desc: "辅助检查流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 3
    id: bp-diagnosis
    label: 确诊与分型分期
    desc: "确诊与分型分期流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 4
    id: bp-plan
    label: 治疗方案制定
    desc: "治疗方案制定流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 5
    id: bp-treatment
    label: 治疗执行与监测
    desc: "治疗执行与监测流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 6
    id: bp-followup
    label: 随访与长期管理
    desc: "随访与长期管理流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
