name: neonatology
cn_name: 新生儿科智能体
version: 1.0.0
type: business
department: 新生儿科
port: 8804
aliases:
- 新生儿科
- neonatology
prompt:
  system: 你是南方医院新生儿科AI助手，负责新生儿科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reception
  description: 接诊评估
  handler: neonatology.bp_reception
  input:
    patient_id: str
  inference_tier: T0
- name: bp_exam
  description: 专项检查
  handler: neonatology.bp_exam
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diagnosis
  description: 诊断分级
  handler: neonatology.bp_diagnosis
  input:
    patient_id: str
  inference_tier: T0
- name: bp_treatment
  description: 分娩/治疗执行
  handler: neonatology.bp_treatment
  input:
    patient_id: str
  inference_tier: T0
- name: bp_nursing
  description: 产后/儿科护理
  handler: neonatology.bp_nursing
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 随访与保健
  handler: neonatology.bp_followup
  input:
    patient_id: str
  inference_tier: T0
guard:
  triggers:
  - 药物交互
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: midwife
    label: 助产士
  - id: anesthesiologist
    label: 麻醉医师
  - id: neonatologist
    label: 新生儿医师
  - id: head_nurse
    label: 护士长
stages:
- order: 1
  id: antenatal
  label: 产前检查
  desc: 孕周评估、胎心监测、B超检查、宫高腹围、合并症筛查
  role_ids:
  - attending
  - midwife
- order: 2
  id: labor
  label: 产程管理
  desc: 产程图记录、胎心监护、宫缩监测、镇痛管理
  role_ids:
  - attending
  - midwife
  - anesthesiologist
- order: 3
  id: delivery
  label: 分娩接生
  desc: 会阴保护、新生儿处理、Apgar评分、胎盘娩出
  role_ids:
  - attending
  - midwife
  - neonatologist
  tool: bp_treatment
- order: 4
  id: postpartum
  label: 产后监护
  desc: 产后出血监测、子宫复旧、泌乳指导、新生儿护理
  role_ids:
  - attending
  - midwife
  - head_nurse
  tool: bp_nursing
- order: 5
  id: neonatal
  label: 新生儿管理
  desc: 新生儿筛查、喂养指导、黄疸监测、预防接种
  role_ids:
  - neonatologist
  - head_nurse
- order: 6
  id: followup
  label: 产后随访
  desc: 42天产后复查、盆底康复、计划生育指导
  role_ids:
  - attending
  - midwife
  tool: bp_followup
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: deep
