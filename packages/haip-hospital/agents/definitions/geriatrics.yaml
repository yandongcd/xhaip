name: geriatrics
cn_name: 老年病科智能体
version: "1.0.0"
type: business
department: 老年病科
port: 8790
aliases: [老年病科, geriatrics]

prompt:
  system: |
    你是南方医院老年病科AI助手，负责老年病科常见疾病的诊疗评估和管理。
    请基于相关临床指南给出专业建议。
  temperature: 0.3

tools:
  - name: bp_reception
    description: 接诊与初步评估
    handler: geriatrics.bp_reception
    input: {patient_id: str}

  - name: bp_exam
    description: 辅助检查
    handler: geriatrics.bp_exam
    input: {patient_id: str}

  - name: bp_diagnosis
    description: 确诊与分型分期
    handler: geriatrics.bp_diagnosis
    input: {patient_id: str}

  - name: bp_plan
    description: 治疗方案制定
    handler: geriatrics.bp_plan
    input: {patient_id: str}

  - name: bp_treatment
    description: 治疗执行与监测
    handler: geriatrics.bp_treatment
    input: {patient_id: str}

  - name: bp_followup
    description: 随访与长期管理
    handler: geriatrics.bp_followup
    input: {patient_id: str}


ui:
  template: chat-with-role-switcher
  roles:
    - {id: attending, label: 主治医师, default: true}
    - {id: resident, label: 住院医师}
    - {id: head_nurse, label: 护士长}
    - {id: head, label: 科主任}

stages:
  - order: 1
    id: bp-reception
    label: 接诊与初步评估
    desc: "接诊与初步评估流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 2
    id: bp-exam
    label: 辅助检查
    desc: "辅助检查流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 3
    id: bp-diagnosis
    label: 确诊与分型分期
    desc: "确诊与分型分期流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 4
    id: bp-plan
    label: 治疗方案制定
    desc: "治疗方案制定流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 5
    id: bp-treatment
    label: 治疗执行与监测
    desc: "治疗执行与监测流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
  - order: 6
    id: bp-followup
    label: 随访与长期管理
    desc: "随访与长期管理流程"
    role: "主治医师 / 住院医师 / 护士长"
    role_ids: ['attending', 'resident', 'head_nurse']
