name: interventional-therapy
cn_name: 介入治疗科智能体
version: 1.0.0
type: business
department: 介入治疗科
port: 8802
aliases:
- 介入治疗科
- interventional-therapy
prompt:
  system: 你是南方医院介入治疗科AI助手，负责介入治疗科常见疾病的诊疗评估和管理。请基于最新临床指南给出专业建议。
  temperature: 0.3
tools:
- name: bp_reg
  description: 患者登记分诊
  handler: interventional_therapy.bp_reg
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diag
  description: 诊断评估
  handler: interventional_therapy.bp_diag
  input:
    patient_id: str
  inference_tier: T0
- name: bp_preop
  description: 术前准备
  handler: interventional_therapy.bp_preop
  input:
    patient_id: str
  inference_tier: T0
- name: bp_risk
  description: 风险评估
  handler: interventional_therapy.bp_risk
  input:
    patient_id: str
  inference_tier: T0
- name: bp_mdt
  description: MDT决策
  handler: interventional_therapy.bp_mdt
  input:
    patient_id: str
  inference_tier: T0
- name: bp_surgery
  description: 手术执行
  handler: interventional_therapy.bp_surgery
  input:
    patient_id: str
  inference_tier: T0
- name: bp_nursing
  description: 围术期护理
  handler: interventional_therapy.bp_nursing
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 术后随访
  handler: interventional_therapy.bp_followup
  input:
    patient_id: str
  inference_tier: T0
guard:
  triggers:
  - 手术决策
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 介入医师
    default: true
  - id: resident
    label: 住院医师
  - id: technician
    label: 导管技师
  - id: anesthesiologist
    label: 麻醉医师
  - id: head_nurse
    label: 护士长
stages:
- order: 1
  id: pre-procedure
  label: 术前评估
  desc: 适应证评估、凝血功能、过敏史筛查、知情同意
  role_ids:
  - attending
  - resident
- order: 2
  id: procedure
  label: 介入操作
  desc: 导管操作、造影、栓塞/支架置入、术中监测
  role_ids:
  - attending
  - technician
  - anesthesiologist
- order: 3
  id: post-procedure
  label: 术后观察
  desc: 穿刺点管理、并发症监测、生命体征
  role_ids:
  - attending
  - head_nurse
- order: 4
  id: followup
  label: 随访评估
  desc: 影像复查、疗效评估、再狭窄监测
  role_ids:
  - attending
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
debate:
  enabled: true
  competitors:
  - cardio-risk
  - anesthesia
  - cardiology
  mode: auto
trust_tier: standard
