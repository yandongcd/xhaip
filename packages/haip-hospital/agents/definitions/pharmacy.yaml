name: pharmacy
cn_name: 药剂科智能体
version: "1.0.0"
type: business
department: 药剂科
port: 8770
aliases: [药剂科, 药房, pharmacy agent]

prompt:
  system: |
    你是南方医院药剂科AI助手，负责围术期止吐药管理、营养风险评估、
    TPN全肠外营养配比计算、处方审核和药品信息查询。
    请基于2025版中国《术后恶心呕吐诊疗指南》、SAMBA第四版共识、
    ESPEN、CSPEN、ADA等临床指南给出专业建议。使用中文回答。
  temperature: 0.3
  max_tokens: 4096

depends_on:
  - agent: medical-record
    version: ">=1.0"

tools:
  - name: assess_nutrition
    description: 评估患者营养风险（NRS2002 + 再喂养综合征 + 电解质监测 + 肝功能）
    handler: pharmacy.assessment.assess_nutrition_risk
    input:
      patient_id: str
      weight_kg: float
      height_cm: float
      lab_results: dict

  - name: calculate_tpn
    description: 计算TPN全肠外营养配比（氨基酸/脂肪乳/葡萄糖/电解质/维生素/微量元素）
    handler: pharmacy.tpn_calculator.compute
    input:
      patient_id: str
      weight_kg: float
      energy_kcal: float

  - name: review_prescription
    description: 审核处方合理性（17条风险规则：配伍禁忌/剂量/溶媒/抗菌药物/抗凝）
    handler: pharmacy.prescription_review.check
    input:
      patient_id: str
      prescription_items: list

  - name: recommend_nutrition_route
    description: 推荐肠内营养（EN）vs 肠外营养（PN）途径
    handler: pharmacy.nutrition_consultation.route
    input:
      patient_id: str
      gi_function: str

  - name: list_medications
    description: 查询药品数据库 (通用名/商品名/规格/医保类别)
    handler: pharmacy.drug_db.search
    input:
      keyword: str

  - name: full_prescription_review
    description: 完整处方审核 (17条药物交互规则)
    handler: pharmacy.drug_rules.full_review
    input:
      patient_id: str
      prescription_items: list

  # ── 围术期止吐药工具组 ★新增 ──
  - name: ponv_risk_score
    description: >
      PONV风险评分 — 成人Apfel简化评分(4因子) / 儿童POVOC评分(4因子) /
      出院PDNV评分(5因子)。自动返回风险等级和预测概率。
    handler: pharmacy.antiemetic.scoring_engine.calculate_apfel_score
    input:
      gender: str
      smoking: str
      ponv_history: str
      motion_sickness: str
      opioid_planned: str
      age: int

  - name: antiemetic_regimen
    description: >
      止吐用药方案推荐 — 基于风险等级(低/中/高) × 人群(成人/儿童) 生成
      首选和备选方案，含药品/剂量/途径/给药时机/证据等级。
    handler: pharmacy.antiemetic.drug_recommend.recommend_regimen_adult
    input:
      risk_level: str
      risk_score: int
      patient_id: str

  - name: antiemetic_validate
    description: >
      止吐用药管控审核 — 7类禁忌证筛查(过敏/肝肾/基础病/特殊人群/重复用药/
      给药时机/药物相互作用)，输出违规详情和替代方案。
    handler: pharmacy.antiemetic.drug_controls.validate_contraindications
    input:
      regimen: dict
      patient_id: str

  - name: anesthesia_ponv_guide
    description: >
      麻醉管理止吐优化 — TIVA推荐/外周神经阻滞匹配/硬膜外评估/
      右美托咪定/阿片节律(纳洛酮+布洛芬)/液体治疗(晶体vs胶体)/
      肌松拮抗剂选择(舒更葡糖钠优先)。
    handler: pharmacy.antiemetic.anesthesia_guide.recommend_tiva
    input:
      risk_level: str
      surgery_type: str

  - name: nondrug_ponv_guide
    description: >
      非药物止吐干预 — 穴位刺激(TEAS/电针)/耳穴刺激/术前碳水化合物/
      咀嚼口香糖/音乐疗法/头高位体位/正向心理引导/生姜/芳香疗法。
    handler: pharmacy.antiemetic.nondrug_guide.recommend_acupoint
    input:
      risk_level: str
      drug_contraindications: bool

  - name: antiemetic_knowledge
    description: >
      围术期止吐指南知识检索 — 搜索2025版中国PONV诊疗指南中的35条推荐意见、
      用药方案、管控规则、麻醉规则、非药物干预规则。
    handler: pharmacy.antiemetic.knowledge_loader.search_knowledge
    input:
      query: str
      domain: str

guard:
  triggers: [药物交互, 处方审核, 止吐药, PONV, 术后恶心呕吐]
  high_risk_scenarios:
    - 抗凝药物相互作用
    - TPN渗透压超过1200mOsm/L
    - 再喂养综合征高风险
    - 氨基糖苷类与利尿剂联用
    - 5-HT3受体拮抗剂24h内重复使用
    - 氟哌利多+延长QT间期药物联用
    - 三联止吐疗法6h内重复使用

ui:
  template: chat-with-role-switcher
  roles:
    - {id: pharmacist, label: 药师, default: true}
    - {id: clinical_pharmacist, label: 临床药师}
    - {id: review_pharmacist, label: 审方药师}
    - {id: iv_compounding_pharmacist, label: 静配药师}
    - {id: anesthesiologist, label: 麻醉医师}
    - {id: attending, label: 主治医师}
    - {id: dietitian, label: 营养师}
  sidebar:
    - {category: 围术期止吐, tools: [ponv_risk_score, antiemetic_regimen, antiemetic_validate, anesthesia_ponv_guide, nondrug_ponv_guide, antiemetic_knowledge]}
    - {category: 营养评估, tools: [assess_nutrition, recommend_nutrition_route]}
    - {category: TPN配比, tools: [calculate_tpn]}
    - {category: 处方审核, tools: [review_prescription]}
    - {category: 药品查询, tools: [list_medications]}

stages:
  - order: 1
    id: reception
    label: 接诊登记
    desc: 患者基本信息采集、病史录入、过敏史筛查
    role: 药师 / 主治医师
    role_ids: [pharmacist, attending]
  - order: 2
    id: medication-review
    label: 用药评估
    desc: 处方审核、药物交互检查、PONV风险评分、营养风险筛查
    role: 临床药师 / 审方药师 / 药师 / 主治医师 / 麻醉医师
    role_ids: [clinical_pharmacist, review_pharmacist, pharmacist, attending, anesthesiologist]
  - order: 3
    id: comprehensive-assessment
    label: 综合评估
    desc: NRS2002营养评估、TPN配比计算、止吐方案制定、抗凝桥接评估
    role: 临床药师 / 药师 / 主治医师 / 营养师 / 麻醉医师
    role_ids: [clinical_pharmacist, pharmacist, attending, dietitian, anesthesiologist]
  - order: 4
    id: plan-formulation
    label: 方案制定
    desc: 个体化用药方案、营养支持方案、止吐预防方案、围术期用药管理
    role: 审方药师 / 药师 / 主治医师 / 营养师 / 麻醉医师
    role_ids: [review_pharmacist, pharmacist, attending, dietitian, anesthesiologist]
  - order: 5
    id: treatment-execution
    label: 执行配药
    desc: TPN配制执行、处方调配、静配操作、用药监测
    role: 静配药师 / 药师 / 主治医师
    role_ids: [iv_compounding_pharmacist, pharmacist, attending]
  - order: 6
    id: followup-monitoring
    label: 随访监测
    desc: 用药依从性随访、不良反应监测、营养状态复查、疗效评估
    role: 审方药师 / 主治医师 / 营养师
    role_ids: [review_pharmacist, attending, dietitian]
