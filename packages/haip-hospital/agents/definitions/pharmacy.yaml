name: pharmacy
cn_name: 药学部智能体
version: 1.0.0
type: business
trust_tier: deep
department: 药学部
port: 8819
aliases:
- 药学部
- 药剂科
- 临床药学
- pharmacy
prompt:
  system: '你是南方医院药学部AI助手，负责临床药学服务，包括处方审核、TPN营养处方设计、止吐方案推荐和药物信息查询。基于ESPEN/ASPEN/CSPEN指南和中国药典。所有建议须经药师复核确认。 '
  temperature: 0.3
  max_tokens: 4096
depends_on:
- agent: medical-record
  version: '>=1.0'
tools:
- name: nutrition_assess
  description: 营养风险评估 — NRS-2002评分 + MNA-SF(老年) + 再喂养综合征风险
  handler: pharmacy.assess_nutrition_risk
  input:
    patient_id: str
    weight_kg: float
    height_cm: float
  inference_tier: T0
- name: calculate_tpn
  description: TPN处方计算 — Harris-Benedict BEE + 糖脂比 + 氨基酸 + 渗透压 + 钙磷沉淀检查
  handler: pharmacy.compute_tpn
  input:
    patient_id: str
    weight_kg: float
    height_cm: float
    age: int
    gender: str
  inference_tier: T0
- name: review_rx
  description: 处方审核 — 17条风险规则(配伍禁忌/剂量/溶媒/抗菌药物/抗凝）
  handler: pharmacy.review_rx
  input:
    patient_id: str
    prescription_items: list
  inference_tier: T0
- name: nutrition_route
  description: 营养途径推荐 — EN vs PN vs SPN
  handler: pharmacy.nutrition_route
  input:
    patient_id: str
    gi_function: str
  inference_tier: T0
- name: drug_search
  description: 药品信息查询
  handler: pharmacy.drug_search
  input:
    keyword: str
  inference_tier: T0
guard:
  triggers:
  - 药物相互作用
  - TPN安全
  - 配伍禁忌
  high_risk_scenarios:
  - 钙磷沉淀
  - 渗透压>1200
  - 再喂养综合征
  citation:
    required: true
    min_sources: 2
    min_trust: T1
stages:
- order: 1
  id: review
  label: 处方审查
  desc: 17条审查规则(配伍禁忌/剂量/溶媒/抗生素/抗凝)、AI审核意见生成
  role_ids:
  - pharmacist
- order: 2
  id: tpn
  label: TPN设计
  desc: 营养素计算→糖脂比→氨基酸→电解质→渗透压→Ca/P沉淀检查→ISO5级无菌配制
  role_ids:
  - pharmacist
- order: 3
  id: monitor
  label: 疗效监测
  desc: TDM治疗药物监测、ADR不良反应上报、抗菌药物管理(AMS)
  role_ids:
  - pharmacist
- order: 4
  id: counsel
  label: 用药教育
  desc: 出院用药指导、特殊剂型使用培训(吸入剂/胰岛素/抗凝)、依从性随访
  role_ids:
  - pharmacist
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: false
ui:
  template: chat-with-role-switcher
  roles:
  - id: pharmacist
    label: 临床药师
    emoji: 💊
  - id: clinical_pharmacist
    label: 临床药师(专科)
    emoji: 💊
  - id: review_pharmacist
    label: 审方药师
    emoji: 📋
  - id: attending
    label: 主治医师
    emoji: 🩺
