name: cardio-surgery
cn_name: 心血管外科智能体
version: "1.0.0"
type: business
department: 心血管外科
port: 8768
aliases: [心外科, 心血管外科, 心脏外科, cardio]

prompt:
  system: |
    你是南方医院心血管外科AI助手，负责心脏手术评估、术后管理、
    抗凝方案设计和随访管理。请基于AHA/ACC/ESC等指南给出专业建议。
  temperature: 0.3

depends_on:
  - agent: medical-record
    version: ">=1.0"
  - agent: cardio-risk
    version: ">=1.0"

tools:
  - name: surgical_assess
    description: 心脏手术术前评估 (EuroSCORE/CABG/瓣膜)
    handler: cardio_surgery.evaluate
    input: {patient_id: str}

  - name: anticoagulation_plan
    description: 抗凝方案 (华法林/NOAC/桥接)
    handler: cardio_surgery.plan
    input: {patient_id: str, surgery_type: str}

  - name: postop_management
    description: 术后管理方案 (监护/引流/抗心律失常)
    handler: cardio_surgery.manage
    input: {patient_id: str, procedure: str}

guard:
  triggers: [药物交互, 心梗评估, 手术决策]
  high_risk_scenarios:
    - 华法林过量出血
    - 术后心包填塞
    - 瓣膜置换术后抗凝失败

ui:
  template: chat-with-role-switcher
  roles:
    - {id: attending, label: 主治医师, default: true}
    - {id: anesthesiologist, label: 麻醉医师}
    - {id: head_nurse, label: 护士长}
    - {id: dept_head, label: 科主任}

stages:
  - order: 1
    id: preop
    label: 术前评估
    desc: "EuroSCORE II 评分 + 心脏超声 + 冠脉造影评估"
    role: "主治医师 / 科主任"
    role_ids: [attending, dept_head]
  - order: 2
    id: risk
    label: 风险评估
    desc: "围术期心梗风险 + 抗凝桥接方案"
    role: "主治医师 / 麻醉医师"
    role_ids: [attending, anesthesiologist]
  - order: 3
    id: plan
    label: 手术方案
    desc: "CABG/瓣膜置换/瓣膜修复 术式选择"
    role: "主治医师 / 科主任"
    role_ids: [attending, dept_head]
  - order: 4
    id: anticoag
    label: 抗凝方案
    desc: "华法林/NOAC/桥接方案制定"
    role: "主治医师"
    role_ids: [attending]
  - order: 5
    id: postop
    label: 术后监护
    desc: "心包引流/血流动力学监测/心律失常管理"
    role: "主治医师 / 护士长"
    role_ids: [attending, head_nurse]
  - order: 6
    id: followup
    label: 康复随访
    desc: "1/3/6/12月随访 + 超声复查 + 抗凝管理"
    role: "主治医师 / 护士长"
    role_ids: [attending, head_nurse]
