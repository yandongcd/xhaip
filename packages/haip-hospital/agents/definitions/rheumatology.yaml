name: rheumatology
cn_name: 风湿免疫科智能体
version: 1.0.0
type: business
department: 风湿免疫科
port: 8786
aliases:
- 风湿免疫科
- rheumatology
prompt:
  system: 你是南方医院风湿免疫科AI助手，负责风湿免疫科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reception
  description: 接诊与初步评估
  handler: rheumatology.bp_reception
  input:
    patient_id: str
- name: bp_exam
  description: 辅助检查
  handler: rheumatology.bp_exam
  input:
    patient_id: str
- name: bp_diagnosis
  description: 确诊与分型分期
  handler: rheumatology.bp_diagnosis
  input:
    patient_id: str
- name: bp_plan
  description: 治疗方案制定
  handler: rheumatology.bp_plan
  input:
    patient_id: str
- name: bp_treatment
  description: 治疗执行与监测
  handler: rheumatology.bp_treatment
  input:
    patient_id: str
- name: bp_followup
  description: 随访与长期管理
  handler: rheumatology.bp_followup
  input:
    patient_id: str
- name: assess_ra_activity
  description: DAS28-CRP类风湿关节炎活动度
  handler: rheumatology.assess_ra_activity
  input:
    patient_id: str
- name: assess_sle_activity
  description: SLEDAI-2K SLE活动度评估
  handler: rheumatology.assess_sle_activity
  input:
    patient_id: str
- name: assess_spa_activity
  description: BASDAI强直性脊柱炎活动度
  handler: rheumatology.assess_spa_activity
  input:
    patient_id: str
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: head_nurse
    label: 护士长
  - id: head
    label: 科主任
stages:
- order: 1
  id: reception
  label: 接诊登记
  desc: 主诉采集、现病史、既往史、过敏史、体格检查
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 2
  id: exam
  label: 辅助检查
  desc: 实验室检查、影像学检查、心电图、专科检查
  role_ids:
  - attending
  - resident
- order: 3
  id: diagnosis
  label: 诊断与分型
  desc: 明确诊断、疾病分型分期、鉴别诊断、合并症评估
  role_ids:
  - attending
- order: 4
  id: treatment-plan
  label: 治疗方案
  desc: 制定个体化治疗方案、用药方案、非药物治疗、健康教育
  role_ids:
  - attending
  - head
- order: 5
  id: execution
  label: 治疗执行
  desc: 执行治疗方案、用药管理、病情监测、并发症预防
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访管理
  desc: 慢病随访、用药依从性、复查检验、生活方式指导
  role_ids:
  - attending
  - head_nurse
guard:
  triggers:
  - 诊断决策
  - 治疗方案
  high_risk_scenarios:
  - 诊断决策
  - 治疗方案
  citation:
    required: true
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: standard
