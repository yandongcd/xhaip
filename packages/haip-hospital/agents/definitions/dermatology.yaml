name: dermatology
cn_name: 皮肤科智能体
version: 1.0.0
type: business
department: 皮肤科
port: 8810
aliases:
- 皮肤科
- dermatology
prompt:
  system: 你是南方医院皮肤科AI助手，负责皮肤科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reception
  description: 接诊评估
  handler: dermatology.bp_reception
  input:
    patient_id: str
- name: bp_exam
  description: 检查检验
  handler: dermatology.bp_exam
  input:
    patient_id: str
- name: bp_diagnosis
  description: 诊断确认
  handler: dermatology.bp_diagnosis
  input:
    patient_id: str
- name: bp_treatment
  description: 治疗执行
  handler: dermatology.bp_treatment
  input:
    patient_id: str
- name: bp_followup
  description: 随访管理
  handler: dermatology.bp_followup
  input:
    patient_id: str
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: head_nurse
    label: 护士长
  - id: head
    label: 科主任
stages:
- order: 1
  id: reception
  label: 接诊登记
  desc: 主诉采集、现病史、既往史、过敏史、体格检查
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 2
  id: exam
  label: 辅助检查
  desc: 实验室检查、影像学检查、心电图、专科检查
  role_ids:
  - attending
  - resident
- order: 3
  id: diagnosis
  label: 诊断与分型
  desc: 明确诊断、疾病分型分期、鉴别诊断、合并症评估
  role_ids:
  - attending
- order: 4
  id: treatment-plan
  label: 治疗方案
  desc: 制定个体化治疗方案、用药方案、非药物治疗、健康教育
  role_ids:
  - attending
  - head
- order: 5
  id: execution
  label: 治疗执行
  desc: 执行治疗方案、用药管理、病情监测、并发症预防
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访管理
  desc: 慢病随访、用药依从性、复查检验、生活方式指导
  role_ids:
  - attending
  - head_nurse
guard:
  triggers:
  - ABCDE 阳性 → 皮肤活检
  - 皮疹 > 30% 体表面积 → 系统治疗
  - 瘙痒伴黄疸 → 肝病排查
  - 大疱性皮肤病 → 危重
  - 诊断决策
  - 治疗方案
  high_risk_scenarios:
  - 皮疹 > 30% 体表面积 → 系统治疗
  - ABCDE 阳性 → 皮肤活检
  citation:
    required: true
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: light
