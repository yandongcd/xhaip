name: huigiao
cn_name: 惠侨医疗中心智能体
version: 1.0.0
type: business
department: 惠侨医疗中心
port: 8814
aliases:
- 惠侨医疗中心
- huigiao
prompt:
  system: '你是南方医院惠侨医疗中心AI助手，负责惠侨医疗中心常见疾病的诊疗评估和管理。

    请基于相关临床指南给出专业建议。

    '
  temperature: 0.3
tools:
- name: bp_reception
  description: 接诊评估
  handler: huigiao.bp_reception
  input:
    patient_id: str
- name: bp_exam
  description: 检查检验
  handler: huigiao.bp_exam
  input:
    patient_id: str
- name: bp_diagnosis
  description: 诊断确认
  handler: huigiao.bp_diagnosis
  input:
    patient_id: str
- name: bp_treatment
  description: 治疗执行
  handler: huigiao.bp_treatment
  input:
    patient_id: str
- name: bp_followup
  description: 随访管理
  handler: huigiao.bp_followup
  input:
    patient_id: str
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: head_nurse
    label: 护士长
  - id: head
    label: 科主任
stages:
- order: 1
  id: bp-reception
  label: 接诊评估
  desc: 接诊评估流程
  role: 主治医师 / 住院医师 / 护士长
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 2
  id: bp-exam
  label: 检查检验
  desc: 检查检验流程
  role: 主治医师 / 住院医师 / 护士长
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 3
  id: bp-diagnosis
  label: 诊断确认
  desc: 诊断确认流程
  role: 主治医师 / 住院医师 / 护士长
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 4
  id: bp-treatment
  label: 治疗执行
  desc: 治疗执行流程
  role: 主治医师 / 住院医师 / 护士长
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 5
  id: bp-followup
  label: 随访管理
  desc: 随访管理流程
  role: 主治医师 / 住院医师 / 护士长
  role_ids:
  - attending
  - resident
  - head_nurse
guard:
  triggers:
  - 诊断决策
  - 治疗方案
  high_risk_scenarios:
  - 诊断决策
  - 治疗方案
  citation:
    required: true
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: light
