name: ophthalmology
cn_name: 眼科智能体
version: 1.0.0
type: business
department: 眼科
port: 8805
aliases:
- 眼科
- ophthalmology
prompt:
  system: 你是南方医院眼科AI助手，负责眼科常见疾病的诊疗评估和管理。请基于最新临床指南给出专业建议。
  temperature: 0.3
tools:
- name: bp_screening
  description: 筛查与初诊
  handler: ophthalmology.bp_screening
  input:
    patient_id: str
  inference_tier: T0
- name: bp_exam
  description: 专科检查
  handler: ophthalmology.bp_exam
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diagnosis
  description: 确诊定级
  handler: ophthalmology.bp_diagnosis
  input:
    patient_id: str
  inference_tier: T0
- name: bp_treatment
  description: 治疗操作
  handler: ophthalmology.bp_treatment
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 定期复查
  handler: ophthalmology.bp_followup
  input:
    patient_id: str
  inference_tier: T0
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: technician
    label: 技师
  - id: head
    label: 科主任
stages:
- order: 1
  id: reception
  label: 接诊登记
  desc: 主诉采集、现病史、既往史、专科体格检查
  role_ids:
  - attending
  - resident
- order: 2
  id: exam
  label: 专科检查
  desc: 专科仪器检查、功能评估、影像学检查
  role_ids:
  - attending
  - technician
  tool: bp_exam
- order: 3
  id: diagnosis
  label: 诊断与分级
  desc: 明确诊断、疾病分型分级、鉴别诊断
  role_ids:
  - attending
  tool: bp_diagnosis
- order: 4
  id: treatment
  label: 治疗方案
  desc: 药物治疗/手术方案/物理治疗、健康教育
  role_ids:
  - attending
  - head
  tool: bp_treatment
- order: 5
  id: followup
  label: 复查随访
  desc: 定期复查、疗效评估、长期管理
  role_ids:
  - attending
  - resident
  tool: bp_followup
guard:
  triggers:
  - 诊断决策
  - 治疗方案
  high_risk_scenarios:
  - 诊断决策
  - 治疗方案
  citation:
    required: true
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: light
