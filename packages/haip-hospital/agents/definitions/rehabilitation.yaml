name: rehabilitation
cn_name: 康复医学科智能体
version: 1.0.0
type: business
department: 康复医学科
port: 8812
aliases:
- 康复医学科
- rehabilitation
prompt:
  system: 你是南方医院康复医学科AI助手，负责康复医学科常见疾病的诊疗评估和管理。请基于最新临床指南给出专业建议。
  temperature: 0.3
tools:
- name: bp_reception
  description: 接诊评估
  handler: rehabilitation.bp_reception
  input:
    patient_id: str
  inference_tier: T0
- name: bp_exam
  description: 检查检验
  handler: rehabilitation.bp_exam
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diagnosis
  description: 诊断确认
  handler: rehabilitation.bp_diagnosis
  input:
    patient_id: str
  inference_tier: T0
- name: bp_treatment
  description: 治疗执行
  handler: rehabilitation.bp_treatment
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 随访管理
  handler: rehabilitation.bp_followup
  input:
    patient_id: str
  inference_tier: T0
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 康复医师
    default: true
  - id: therapist
    label: 治疗师
  - id: nurse
    label: 康复护士
  - id: head_nurse
    label: 护士长
    emoji: 👩‍⚕️
stages:
- order: 1
  id: initial-eval
  label: 初次评估
  desc: 功能评估、ADL评估、康复目标设定、康复方案制定
  role_ids:
  - attending
  - therapist
- order: 2
  id: exam
  label: 辅助检查
  desc: 肌力MMT/ROM评估/平衡步态/专项量表
  role_ids:
  - attending
  - therapist
  tool: bp_exam
- order: 3
  id: diagnosis
  label: 诊断分级
  desc: ICF功能分级、康复潜力评估、预后分组
  role_ids:
  - attending
  - head_nurse
  tool: bp_diagnosis
- order: 4
  id: treatment
  label: 康复治疗
  desc: 物理治疗/作业治疗/言语治疗/心理康复
  role_ids:
  - therapist
  - nurse
  tool: bp_treatment
- order: 5
  id: progress
  label: 进展评估
  desc: 功能改善评分、方案调整、并发症预防
  role_ids:
  - attending
  - therapist
- order: 6
  id: discharge
  label: 出院计划
  desc: 家庭康复指导、辅助器具配置、社区康复衔接
  role_ids:
  - attending
  - therapist
  - nurse
guard:
  triggers:
  - 诊断决策
  - 治疗方案
  citation:
    required: true
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
trust_tier: standard
