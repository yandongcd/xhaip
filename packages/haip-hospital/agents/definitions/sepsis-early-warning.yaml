name: sepsis-early-warning
cn_name: 重症感染早期预警智能体
version: 1.0.0
type: business
trust_tier: deep
department: 检验医学科
port: 8846
aliases:
- 脓毒症预警
- 重症感染
- sepsis
- 感染预警
prompt:
  system: 你是南方医院检验医学科AI助手，负责重症感染早期预警与脓毒症风险评估。基于淋巴细胞亚群时序轨迹和炎症生化指标，输出28天死亡风险预测。所有预警结果须经ICU/感染科医师复核确认。
  temperature: 0.2
tools:
- name: immune_status
  description: 免疫状态评估 — CD3+/CD4+/CD8+/CD19+/NK细胞计数+百分比 + NLR计算
  handler: sepsis_early_warning.immune_status
  input:
    patient_id: str
  inference_tier: T0
- name: sepsis_score
  description: 脓毒症风险评分 — qSOFA+SOFA+PCT/CRP阶梯 + 时序轨迹评估
  handler: sepsis_early_warning.sepsis_score
  input:
    patient_id: str
  inference_tier: T0
- name: mortality_risk
  description: 28天死亡风险预测 — 多因素模型（年龄/淋巴细胞轨迹/NLR/SOFA/合并症）
  handler: sepsis_early_warning.mortality_risk
  input:
    patient_id: str
    immune_data: dict
    sofa_score: int
  inference_tier: T0
- name: early_warning
  description: 分级预警推送 — 低/中/高危 + 逐级升级(24h→48h→72h电话通知)
  handler: sepsis_early_warning.early_warning
  input:
    patient_id: str
    risk_level: str
    mortality_prob: float
  inference_tier: T0
guard:
  triggers:
  - 脓毒症
  - 感染性休克
  - 免疫麻痹
  high_risk_scenarios:
  - 淋巴细胞持续低下>7天
  - SOFA增加≥2+感染
  - PCT>10+低血压
  citation:
    required: true
    min_sources: 2
    min_trust: T1
stages:
- order: 1
  id: immune-eval
  label: 免疫状态评估
  desc: CD3+/CD4+/CD8+/CD19+/NK 淋巴细胞亚群计数 + NLR 计算
  role_ids:
  - technician
  - resident
- order: 2
  id: sepsis-score
  label: 脓毒症评分
  desc: qSOFA + SOFA + PCT/CRP 阶梯 + 淋巴细胞时序轨迹
  role_ids:
  - resident
  - icu_doctor
- order: 3
  id: mortality-risk
  label: 死亡风险预测
  desc: 28天死亡风险多因素模型 (年龄/淋巴细胞轨迹/NLR/SOFA/合并症)
  role_ids:
  - icu_doctor
- order: 4
  id: warning-escalate
  label: 分级预警推送
  desc: 低/中/高危分级 + 逐级升级 (24h→48h→72h 电话通知)
  role_ids:
  - icu_doctor
  - resident
  - head_nurse
depends_on:
- agent: lab-critical-value
  version: '>=1.0'
  note: 检验危急值(PCT/乳酸/血培养)
- agent: icu
  version: '>=1.0'
  note: SOFA/APACHE II评分数据
ui:
  roles:
  - id: attending
    label: 主治医师
    emoji: 🩺
  - id: nurse
    label: 责任护士
    emoji: 👩‍⚕️
  - id: technician
    label: 技师
    emoji: 🔬
  - id: resident
    label: 住院医师
    emoji: 🩺
  - id: icu_doctor
    label: ICU医师
    emoji: 💚
  - id: head_nurse
    label: 护士长
    emoji: 👩‍⚕️
