name: renal-transplant
cn_name: 肾移植科智能体
version: 1.0.0
type: business
department: 肾移植科
port: 8796
aliases:
- 肾移植科
- renal-transplant
prompt:
  system: 你是南方医院肾移植科AI助手，负责肾移植科常见疾病的诊疗评估和管理。请基于最新临床指南给出专业建议。
  temperature: 0.3
tools:
- name: bp_reg
  description: 患者登记分诊
  handler: renal_transplant.bp_reg
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diag
  description: 诊断评估
  handler: renal_transplant.bp_diag
  input:
    patient_id: str
  inference_tier: T0
- name: bp_preop
  description: 术前准备
  handler: renal_transplant.bp_preop
  input:
    patient_id: str
  inference_tier: T0
- name: bp_risk
  description: 风险评估
  handler: renal_transplant.bp_risk
  input:
    patient_id: str
  inference_tier: T0
- name: bp_mdt
  description: MDT决策
  handler: renal_transplant.bp_mdt
  input:
    patient_id: str
  inference_tier: T0
- name: bp_surgery
  description: 手术执行
  handler: renal_transplant.bp_surgery
  input:
    patient_id: str
  inference_tier: T0
- name: bp_nursing
  description: 围术期护理
  handler: renal_transplant.bp_nursing
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 术后随访
  handler: renal_transplant.bp_followup
  input:
    patient_id: str
  inference_tier: T0
guard:
  triggers:
  - 手术决策
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 移植医师
    default: true
  - id: surgeon
    label: 手术医师
  - id: immunologist
    label: 免疫医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: coordinator
    label: 移植协调员
  - id: head_nurse
    label: 护士长
stages:
- order: 1
  id: donor-match
  label: 供体匹配
  desc: HLA配型、交叉配型、供体评估、伦理审批
  role_ids:
  - attending
  - coordinator
- order: 2
  id: pre-transplant
  label: 移植前准备
  desc: 受体评估、感染筛查、免疫抑制方案制定
  role_ids:
  - attending
  - immunologist
- order: 3
  id: transplant
  label: 移植手术
  desc: 器官获取、植入、血管吻合、术中免疫抑制
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
- order: 4
  id: post-transplant
  label: 术后管理
  desc: 排斥监测、免疫抑制剂调整、感染防控、肾功能监测
  role_ids:
  - attending
  - immunologist
  - head_nurse
- order: 5
  id: long-term
  label: 长期随访
  desc: 定期复查、药物浓度监测、慢性排斥筛查
  role_ids:
  - attending
  - coordinator
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
debate:
  enabled: true
  competitors:
  - cardio-risk
  - anesthesia
  - nephrology
  mode: auto
trust_tier: deep
