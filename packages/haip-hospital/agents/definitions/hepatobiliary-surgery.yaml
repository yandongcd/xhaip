name: hepatobiliary-surgery
cn_name: 肝胆外科智能体
version: 1.0.0
type: business
department: 肝胆外科
port: 8792
aliases:
- 肝胆外科
- hepatobiliary-surgery
prompt:
  system: 你是南方医院肝胆外科AI助手，负责肝胆外科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
tools:
- name: bp_reg
  description: 患者登记分诊
  handler: hepatobiliary_surgery.bp_reg
  input:
    patient_id: str
  inference_tier: T0
- name: bp_diag
  description: 诊断评估
  handler: hepatobiliary_surgery.bp_diag
  input:
    patient_id: str
  inference_tier: T0
- name: bp_preop
  description: 术前准备
  handler: hepatobiliary_surgery.bp_preop
  input:
    patient_id: str
  inference_tier: T0
- name: bp_risk
  description: 风险评估
  handler: hepatobiliary_surgery.bp_risk
  input:
    patient_id: str
  inference_tier: T0
- name: bp_mdt
  description: MDT决策
  handler: hepatobiliary_surgery.bp_mdt
  input:
    patient_id: str
  inference_tier: T0
- name: bp_surgery
  description: 手术执行
  handler: hepatobiliary_surgery.bp_surgery
  input:
    patient_id: str
  inference_tier: T0
- name: bp_nursing
  description: 围术期护理
  handler: hepatobiliary_surgery.bp_nursing
  input:
    patient_id: str
  inference_tier: T0
- name: bp_followup
  description: 术后随访
  handler: hepatobiliary_surgery.bp_followup
  input:
    patient_id: str
  inference_tier: T0
guard:
  triggers:
  - 手术决策
  high_risk_scenarios:
  - 手术并发症
  - 药物不良反应
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: surgeon
    label: 手术医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: icu_doctor
    label: ICU医师
  - id: head_nurse
    label: 护士长
  - id: instrument_nurse
    label: 器械护士
  - id: rehab_therapist
    label: 康复师
  - id: hepatologist
    label: 肝病科医师
    emoji: 🩺
stages:
- order: 1
  id: liver-eval
  label: 肝功能评估
  desc: Child-Pugh分级(胆红素/白蛋白/PT/腹水/脑病)、MELD评分、ICG-R15清除试验、BCLC分期
  role_ids:
  - attending
  - resident
  - anesthesiologist
- order: 2
  id: preop-plan
  label: 术前规划
  desc: 肝储备功能评估(正常≥20%/硬化≥40%残余肝)、PVE门静脉栓塞促进增生、PTCD减黄(Bil<100)
  role_ids:
  - attending
  - surgeon
  - hepatologist
  tool: bp_preop
- order: 3
  id: surgery
  label: 手术执行
  desc: Glissonean入路/Pringle法(15/5min阻断)、低中心静脉压(<5mmHg)、术中超声
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
  tool: bp_surgery
- order: 4
  id: postop-monitor
  label: 术后监测
  desc: ISGLS胆汁漏分级、50-50标准肝衰监测、腹腔引流(淀粉酶/Bil)、凝血功能、感染监测
  role_ids:
  - attending
  - icu_doctor
  - head_nurse
  tool: bp_followup
- order: 5
  id: recovery
  label: 恢复期管理
  desc: 营养支持(肝病专用EN)、腹水管理、切口护理、VTE预防(Caprini)、ERAS早期活动
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访监测
  desc: 肿瘤标志物(AFP/CA19-9/CEA)、影像复查(CT/MRI q3-6m)、肝功能、术后1/3/6/12月
  role_ids:
  - attending
  - hepatologist
  tool: bp_followup
rag:
  enabled: true
  top_k: 5
learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: true
debate:
  enabled: true
  competitors:
  - cardio-risk
  - anesthesia
  - gastroenterology
  mode: auto
trust_tier: deep
