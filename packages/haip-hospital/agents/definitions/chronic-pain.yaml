name: chronic-pain
cn_name: 慢性疼痛综合评估
version: "1.0.0"
type: specialist
department: 疼痛科
aliases: [慢性疼痛, chronic-pain]
parent: pain-hub

prompt:
  system: |
    你是慢性疼痛管理专家，负责慢性疼痛的生物-心理-社会模型综合评估、
    疼痛量表评分和阶梯治疗方案推荐。
  temperature: 0.3

tools:
  - name: assess_chronic
    description: 慢性疼痛综合评估 (生物-心理-社会模型)
    handler: chronic_pain.assess
    input: {patient_id: str}

  - name: assess_scales
    description: 疼痛量表评分 (ODI/NDI/DN4/PHQ9/GAD7)
    handler: chronic_pain.assess_scales
    input: {patient_id: str}

  - name: stepped_care
    description: 阶梯治疗推荐 (阶梯 1-3)
    handler: chronic_pain.care
    input: {patient_id: str}
