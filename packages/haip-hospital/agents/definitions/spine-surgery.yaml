name: spine-surgery
cn_name: 脊柱骨科智能体
version: 1.0.0
type: business
department: 脊柱骨科
port: 8842
aliases:
- 脊柱骨科
- 脊柱外科
- spine-surgery
- spine
prompt:
  system: 你是南方医院脊柱骨科AI助手，负责脊柱骨科常见疾病的诊疗评估和管理。请基于最新临床指南（2025-2026）给出专业建议，包括诊断标准、治疗方案、风险评估和随访计划。
  temperature: 0.3
  max_tokens: 4096
depends_on:
- agent: medical-record
  version: '>=1.0'
- agent: anesthesia-risk
  version: '>=1.0'
tools:
- name: asia_classification
  description: ASIA脊髓损伤分级(A-E, 输入运动/感觉平面与骶段保留, 参考ISNCSCI 2019)
  handler: spine_surgery.asia_classification
  input:
    motor_level: str
    sensory_level: str
    motor_scores: dict
    sacral_sparing: bool
    anal_contraction: bool
- name: cobb_severity
  description: 脊柱侧弯Cobb角分级(<10正常/10-25观察/25-45支具/>45手术)+Risser骨龄修正
  handler: spine_surgery.cobb_severity
  input:
    cobb_angle: float
    risser_grade: int
    age: int
    curve_type: str
    progression_risk: str
- name: stenosis_assessment
  description: 腰椎管狭窄评估(症状+步行距离+Schizas MRI影像分级→保守/减压建议, 参考NASS 2019)
  handler: spine_surgery.stenosis_assessment
  input:
    symptoms: list
    walking_distance_m: float
    schizas_grade: str
    segment_level: str
    central_stenosis: bool
    foraminal_stenosis: bool
    age: int
- name: odi_score
  description: Oswestry功能障碍指数(10项0-5分, 输出百分比与功能障碍分级)
  handler: spine_surgery.odi_score
  input:
    scores: dict
- name: surgical_pathway
  description: 脊柱术式路径建议(PELD椎间孔镜/UBE/OLIF/TLIF/开放, 按病种+节段+骨密度)
  handler: spine_surgery.surgical_pathway
  input:
    diagnosis: str
    segment: str
    t_score: float
    age: int
    multi_level: bool
    instability: bool
    prior_surgery: bool
- name: red_flags
  description: 脊柱红旗征筛查(马尾综合征/肿瘤/感染/骨折, 命中→急诊升级绿色通道)
  handler: spine_surgery.red_flags
  input:
    patient_id: str
    symptoms: list
    history: list
    age: int
    lab_crp: float
    lab_esr: float
guard:
  triggers:
  - 手术
  - 感染
  - 急诊
  - 马尾
  - 瘫痪
  - 肿瘤
  - 骨折
  high_risk_scenarios:
  - 马尾综合征紧急减压
  - 脊柱感染急诊处理
  - 脊柱肿瘤病理骨折
  - 高位颈髓损伤呼吸管理
  - Cobb角>45°手术评估
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
    default: true
  - id: resident
    label: 住院医师
  - id: surgeon
    label: 手术医师
  - id: anesthesiologist
    label: 麻醉医师
  - id: icu_doctor
    label: ICU医师
  - id: head_nurse
    label: 护士长
  - id: instrument_nurse
    label: 器械护士
  - id: rehab_therapist
    label: 康复师
stages:
- order: 1
  id: preop-eval
  label: 术前评估
  desc: GCS/ASA评分、影像学评估、凝血功能、心肺功能筛查、麻醉评估
  role_ids:
  - attending
  - resident
  - anesthesiologist
- order: 2
  id: preop-prep
  label: 术前准备
  desc: 备血交叉配血、预防性抗生素、深静脉穿刺、导尿、备皮
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 3
  id: surgery
  label: 手术执行
  desc: 术中监测、出血量评估、冰冻病理、器械清点
  role_ids:
  - attending
  - surgeon
  - anesthesiologist
  - instrument_nurse
- order: 4
  id: postop-icu
  label: 术后监护
  desc: ICU监测、GCS追踪、ICP管理、引流管管理、电解质平衡
  role_ids:
  - attending
  - icu_doctor
  - head_nurse
- order: 5
  id: ward-care
  label: 病房管理
  desc: 切口护理、活动指导、营养支持、VTE预防、疼痛管理
  role_ids:
  - attending
  - resident
  - head_nurse
- order: 6
  id: followup
  label: 随访康复
  desc: 神经功能评分、康复计划制定、术后1/3/6月随访、影像复查
  role_ids:
  - attending
  - rehab_therapist
  - head_nurse
