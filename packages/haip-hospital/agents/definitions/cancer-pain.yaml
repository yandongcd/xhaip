name: cancer-pain
cn_name: 癌性疼痛管理
version: 1.0.0
type: specialist
port: 8817
department: 疼痛科
aliases:
- 癌性疼痛
- cancer-pain
parent: pain-hub
prompt:
  system: '你是癌性疼痛管理专家，基于WHO三阶梯止痛原则，提供癌痛评估、

    阿片类药物安全管理、爆发痛处理和姑息治疗转介建议。

    '
  temperature: 0.3
tools:
- name: assess_cancer
  description: 癌痛评估 (WHO 阶梯 + 爆发痛 + 神经病理)
  handler: cancer_pain.assess
  input:
    patient_id: str
- name: opioid_safety
  description: 阿片类药物安全评估 (过量/DDI/器官功能)
  handler: cancer_pain.safety
  input:
    patient_id: str
- name: palliative_refer
  description: 姑息治疗转介评估
  handler: cancer_pain.palliative
  input:
    patient_id: str
guard:
  triggers:
  - 药物交互
  high_risk_scenarios:
  - 阿片类药物过量
  - 苯二氮卓类联用风险
stages:
- order: 1
  id: assess
  label: 癌痛评估
  desc: 疼痛强度、部位、类型、爆发痛评估
  role_ids:
  - attending
- order: 2
  id: titration
  label: 阿片滴定
  desc: 起始剂量、滴定速度、不良反应管理
  role_ids:
  - attending
- order: 3
  id: maintenance
  label: 维持治疗
  desc: 长效制剂转换、辅助镇痛药、非药物治疗
  role_ids:
  - attending
- order: 4
  id: palliative
  label: 姑息支持
  desc: 终末期疼痛管理、心理支持、家庭照护指导
  role_ids:
  - attending
  - nurse
ui:
  template: chat-with-role-switcher
  roles:
  - id: attending
    label: 主治医师
  - id: nurse
    label: 责任护士
