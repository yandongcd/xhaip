name: antiemetic
cn_name: 围术期止吐管理智能体
version: 1.0.0
type: specialist
trust_tier: standard
department: 跨科室
port: 8831
aliases:
- 止吐药
- PONV
- 术后恶心呕吐
- antiemetic agent
prompt:
  system: '你是围术期止吐管理AI助手，基于2025版中国PONV诊疗指南和SAMBA第四版共识，提供PONV风险评估、用药方案推荐、用药管控审核。 '
  temperature: 0.3
  max_tokens: 4096
tools:
- name: assess_ponv
  description: PONV风险评估 — Apfel成人简化评分(4因子)/POVOC儿童评分/PDNV出院评分
  handler: antiemetic.assess
  input:
    patient_id: str
    gender: str
    smoking: str
    ponv_history: str
    opioid_planned: str
- name: prophylaxis_plan
  description: 分级预防方案 — 低危单药/中危两药/高危三药+TIVA
  handler: antiemetic.prophylaxis
  input:
    patient_id: str
    risk_level: str
    risk_score: int
- name: rescue_mgmt
  description: 突破性PONV补救治疗 — 选择与预防不同机制的药物
  handler: antiemetic.rescue
  input:
    patient_id: str
    prior_antiemetics: list
    time_since_last_dose: float
- name: postop_monitor
  description: 术后24h/48h分层监测 — 基于T0评估恶心/呕吐/补救用药
  handler: antiemetic.postop_monitor
  input:
    patient_id: str
    hours_postop: float
    nausea_severity: str
    vomiting_episodes: int
    rescue_given: bool
- name: discharge_followup
  description: 出院随访 D3/D7 — 自动推送随访问卷+症状追踪
  handler: antiemetic.discharge_followup
  input:
    patient_id: str
    day_postop: int
    has_nausea: bool
    has_vomiting: bool
    has_dizziness: bool
    has_constipation: bool
guard:
  triggers:
  - 止吐药
  - PONV
  - 术后恶心呕吐
  high_risk_scenarios:
  - 5-HT3受体拮抗剂24h内重复使用
  - 氟哌利多+延长QT间期药物联用
  - 孕期使用多巴胺受体拮抗剂
  citation:
    required: true
ui:
  template: chat-with-role-switcher
  roles:
  - id: anesthesiologist
    label: 麻醉医师
    default: true
  - id: clinical_pharmacist
    label: 临床药师
rag:
  enabled: true
  top_k: 5
stages:
- order: 1
  id: risk-assess
  label: 风险评估
  desc: Apfel 4因素评分(女性/不吸烟/PONV史/计划阿片类)、POVOC儿科评分、PDNV出院评分
  role_ids:
  - attending
  - anesthesiologist
- order: 2
  id: prophylaxis
  label: 预防方案
  desc: 低危单药/中危双药/高危三联+TIVA、药物选择(5-HT3/DEX/NK1/D2)、给药时机
  role_ids:
  - attending
  - anesthesiologist
- order: 3
  id: rescue
  label: 补救治疗
  desc: 突破性PONV不同机制药物补救、PACU管理与出院标准
  role_ids:
  - anesthesiologist
  - nurse
- order: 4
  id: followup
  label: 随访
  desc: 24h/48h症状评分、D3/D7问卷推送、PDNV风险评估与干预
  role_ids:
  - nurse

learning:
  enabled: true
  auto_apply:
  - citation_new
  - route_adj
  prompt_a_b: false
