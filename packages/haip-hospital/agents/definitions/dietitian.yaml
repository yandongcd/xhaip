name: dietitian
cn_name: 临床营养智能体
version: "1.0.0"
type: business
department: 营养科
port: 8905
aliases: [营养, 营养评估, 营养筛查, NRS2002, GLIM, 再喂养, 肠内营养, 肠外营养, 营养师, dietitian]

prompt:
  system: |
    你是南方医院临床营养智能体，提供住院患者营养管理全流程支持：
    - NRS2002 营养风险筛查 (入院24h内)
    - GLIM 营养不良两步诊断 (表型+病因标准)
    - EN vs PN vs SPN 途径决策 (含禁忌判断)
    - Harris-Benedict 能量目标 + 分层蛋白目标计算
    - 再喂养综合征风险评估 + 电解质监测计划
    - 综合营养评估报告生成
    基于 ESPEN 2023、CSPEN 2023、ADA 2023 等指南给出专业建议。
    使用中文回答。
  temperature: 0.3
  max_tokens: 4096

depends_on:
  - agent: medical-record
    version: ">=1.0"

tools:
  - name: nrs2002_screen
    description: >
      NRS2002 营养风险筛查 — 疾病严重程度(0-3分) + 营养状况(0-3分) + 年龄(≥70+1分)，
      总分0-7分，≥3有营养风险需启动营养支持，含具体推荐措施。
    handler: dietitian.nrs2002_screen
    input:
      weight_kg: float
      height_cm: float
      age: int
      disease_severity: int
      food_intake_pct: int
      weight_loss_3mo_pct: float

  - name: glim_diagnosis
    description: >
      GLIM营养不良两步诊断 — 步骤1: NRS2002风险筛查(≥3阳性)；步骤2: 表型标准(体重下降/BMI/肌肉量)
      + 病因标准(食物摄入减少/疾病负担/炎症)，确诊营养不良及严重程度分级。
    handler: dietitian.glim_diagnosis
    input:
      weight_loss_6mo_pct: float
      bmi: float
      food_intake_week_pct: int
      disease_burden: str
      crp: float

  - name: route_decision
    description: >
      营养途径决策 — EN vs PN vs SPN，基于肠道功能/经口摄入/GRV/禁忌证做决策树推演。
    handler: dietitian.route_decision
    input:
      gi_function: str
      oral_intake_pct: int
      fasting_days: int
      bowel_obstruction: bool
      hemodynamic_unstable: bool

  - name: energy_protein_target
    description: >
      Harris-Benedict 基础能量消耗 + 活动/应激系数 → 总能量目标；
      创伤/手术/感染等病情分层 → 蛋白质目标 (g/kg/d)。
    handler: dietitian.energy_protein_target
    input:
      weight_kg: float
      height_cm: float
      age: int
      gender: str
      activity_factor: float
      stress_factor: float
      condition: str

  - name: refeeding_risk
    description: >
      再喂养综合征风险评估 — 基于NICE 2006标准(BMI/体重下降/摄入时间/电解质)，
      高危/中危/低危分级 + 启动方案(从目标量1/4开始) + 电解质监测计划。
    handler: dietitian.refeeding_risk
    input:
      bmi: float
      weight_loss_3mo_pct: float
      fasting_days: int
      potassium: float
      phosphorus: float
      magnesium: float

  - name: nutrition_report
    description: >
      综合营养评估报告生成 — 汇总 NRS2002/GLIM/途径/能量蛋白/再喂养风险五维结果，
      输出结构化Markdown报告。
    handler: dietitian.nutrition_report
    input:
      patient_id: str
      nrs2002: dict
      glim: dict
      route: dict
      energy_protein: dict
      refeeding: dict

guard:
  triggers: [再喂养, 营养, 营养筛查, NRS2002, GLIM, 肠内营养, 肠外营养]
  high_risk_scenarios:
    - 再喂养综合征高危 (BMI<14 或 禁食>10天)
    - 严重低磷血症 (<0.3 mmol/L)
    - 肠梗阻+肠内营养
    - 血流动力学不稳定+肠内营养

ui:
  template: chat-with-role-switcher
  roles:
    - {id: dietitian, label: 营养师, default: true}
    - {id: clinical_nutritionist, label: 临床营养师}
    - {id: attending, label: 主治医师}
    - {id: pharmacist, label: 药师}
  sidebar:
    - {category: 营养筛查, tools: [nrs2002_screen, glim_diagnosis]}
    - {category: 途径与目标, tools: [route_decision, energy_protein_target]}
    - {category: 风险评估, tools: [refeeding_risk]}
    - {category: 综合报告, tools: [nutrition_report]}
