# ============================================================
# Business Process: 术前 PONV 风险评分
# TOGAF Class: BusinessProcess + ProcessStep (Core ABB)
# Trust Level: T1
# ============================================================
name: bp-ponv-risk-scoring
version: "1.0"
description: 术前 PONV 风险评分流程 — 从患者基本信息采集到风险等级判定
owner: 麻醉医师
value_stages:
  - 术前评估
guideline_refs:
  - guideline-ponv-2025

steps:
  - id: bp-ponv01-1
    name: 采集患者信息
    actor: 麻醉医师
    description: |
      从 HIS 系统获取患者基本信息：
      1. 年龄、性别、吸烟史
      2. PONV 病史、晕动病史
      3. 计划手术类型、预计时长
      4. 计划麻醉方式、预计阿片类药物使用
    data_used: [de-patient, de-surgery]
    decision: "信息是否完整？→ 完整 | 不完整(补充采集)"
    implementation:
      module: pharmacy.antiemetic.scoring_engine
      tool: calculate_apfel_score
      decision_coverage: {total: 2, covered: 2}

  - id: bp-ponv01-2
    name: 执行 Apfel 评分（成人）
    actor: 麻醉医师
    description: |
      计算简化 Apfel 评分：
      1. 女性 (+1)
      2. 非吸烟 (+1)
      3. PONV/晕动病史 (+1)
      4. 术后阿片类药物使用 (+1)
      总分 0-4 分
    data_used: [de-patient, de-surgery]
    decision: "评分 0-1→低危 | 2→中危 | 3-4→高危"
    implementation:
      module: pharmacy.antiemetic.scoring_engine
      tool: calculate_apfel_score
      decision_coverage: {total: 3, covered: 3}

  - id: bp-ponv01-3
    name: 执行 POVOC 评分（儿童）
    actor: 麻醉医师
    description: |
      计算儿童术后呕吐预测评分（POVOC-score）：
      1. 年龄 ≥ 3 岁 (+1)
      2. 手术时间 ≥ 30min (+1)
      3. 术中阿片类药物使用 (+1)
      4. PONV/晕动病史 (+1)
      总分 0-4 分
    data_used: [de-patient, de-surgery]
    decision: "0→低危 | 1-2→中危 | 3-4→高危"
    implementation:
      module: pharmacy.antiemetic.scoring_engine
      tool: calculate_povoc_score
      decision_coverage: {total: 3, covered: 3}

  - id: bp-ponv01-4
    name: 记录风险评估结果
    actor: 麻醉医师
    description: |
      综合评分结果输出：
      1. 风险等级（低/中/高）
      2. 对应 PONV 发生率
      3. 各危险因素明细
      4. 触发后续 BP（药物预防/麻醉优化/非药物干预）
    data_used: [de-risk-score]
    decision: null
    implementation:
      module: pharmacy.antiemetic.scoring_engine
      tool: classify_risk_level
