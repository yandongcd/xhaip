# ============================================================
# Data Asset: 围术期止吐药数据库
# TOGAF Class: DataEntity (Core ABB)
# Trust Level: T1 (基于2025版中国PONV诊疗指南 + 药品说明书)
# ============================================================
name: drug-db-antiemetic
version: "1.0"
description: >
  围术期止吐药数据库 — 覆盖6大类10+种药品的元数据。
  每个药品标注类别/半衰期/剂量/给药时机/禁忌证/指南引用。
owner: clinical_pharmacist
guideline_ref:
  - "guideline-ponv-2025 §3"
last_updated: 2026-07-11

drugs:

  # ── 5-HT3 受体拮抗剂 (第一代) ──
  - id: ondansetron
    name: 昂丹司琼
    name_en: Ondansetron
    class: 5-HT3_receptor_antagonist
    generation: 1
    half_life_h: 3-6
    onset_min: 30
    duration_h: 8-12
    adult_prophylaxis_dose: "4mg IV"
    adult_rescue_dose: "1mg IV"
    pediatric_dose: "0.05-0.1mg/kg IV (最大4mg)"
    timing: "手术结束前 (短效)"
    route: [IV, PO, ODT]
    contraindications: [QTc>470ms(男)/480ms(女)谨慎重复给药]
    side_effects: [头痛(5-27%), 腹泻(<1-16%), 便秘(<1-9%), 发热(<1-8%), 肝酶升高(1-5%)]
    evidence_level: moderate
    guideline_refs: [R11.1, R11.2, R11.4]

  - id: granisetron
