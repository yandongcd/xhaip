    name_en: Granisetron
    class: 5-HT3_receptor_antagonist
    generation: 1
    half_life_h: 3.1-5.9
    adult_prophylaxis_dose: "1mg IV or 0.04mg/kg"
    adult_rescue_dose: "0.1mg IV"
    pediatric_dose: "0.04mg/kg IV (最大3mg)"
    timing: "手术结束前 (短效)"
    route: [IV, PO, Transdermal]
    contraindications: [QTc延长谨慎]
    side_effects: [头痛, 便秘, 肝酶升高]
