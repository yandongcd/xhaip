    side_effects: [镇静, 口干]
    evidence_level: moderate
    guideline_refs: [R16]
    note: "剖宫产患者推荐使用（中等证据）。作用于呕吐中枢和前庭通路阻断组胺受体"

  - id: cyclizine
    name: 赛克利嗪
    name_en: Cyclizine
    class: antihistamine
    half_life_h: 20
    adult_prophylaxis_dose: "50mg IV/PO"
    timing: "手术结束前"
    route: [IV, PO]
    contraindications: [闭角型青光眼, 癫痫病史, 重症肌无力]
    side_effects: [镇静, 口干, 注射部位疼痛]
    evidence_level: moderate
    guideline_refs: [R16]
    note: "剖宫产患者推荐使用。半衰期较长（约20h）"

  - id: promethazine
    name: 异丙嗪
    name_en: Promethazine
    class: antihistamine
    half_life_h: 9-16
    adult_prophylaxis_dose: "12.5-25mg IV/IM"
    adult_rescue_dose: "6.25-12.5mg IV"
    timing: "手术结束前"
    route: [IV, IM, PO]
    contraindications: [闭角型青光眼, 癫痫病史, 重症肌无力, 儿童<2岁]
    side_effects: [镇静(较显著), 口干, 注射部位损伤(IM)]
    evidence_level: moderate
    guideline_refs: [R16]
