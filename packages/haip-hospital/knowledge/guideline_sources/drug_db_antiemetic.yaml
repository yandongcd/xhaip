    guideline_refs: [R11.1, R11.2]

  - id: tropisetron
    name: 托烷司琼
    name_en: Tropisetron
    class: 5-HT3_receptor_antagonist
    generation: 1
    half_life_h: 8-12
    adult_prophylaxis_dose: "5mg IV"
    adult_rescue_dose: "0.5mg IV"
    timing: "手术结束前30min"
    route: [IV, PO]
    contraindications: [QTc延长谨慎]
    side_effects: [头痛, 便秘, 头晕]
