# 感染内科临床规则 — 抗生素管理 + 结核 IGRA/Xpert + 乙肝抗病毒 + HIV ART + FUO + COVID-19
rule_type: diagnosis
department: 感染内科
capability: cap-l3-infectious-disease-diagnosis
business_process: bp-infectious-disease-diagnosis
data_entities:
  consumes: [de-patient, de-lab-infection, de-lab-biochemistry, de-imaging]
  produces: [de-diagnosis-result]
guideline: 中华医学会感染病学分会 中国感染性疾病诊疗指南 (2022)
stakeholder: 感染内科医师需快速诊断结核 IGRA/Xpert、乙肝抗病毒指征、HIV ART 启动时机
version: "1.0.0"

rules:
  - id: id-tb-igra-positive
    description: IGRA 阳性 → 结核感染
    condition:
      field: lab_results.IGRA
      operator: "=="
      value: positive
    result:
      diagnosis: 结核分枝杆菌感染（潜伏性或活动性）
      severity: 中危
      recommendation: 胸片/CT 排查活动性结核 — 活动性：抗结核治疗；潜伏性：预防性 INH 9 月

  - id: id-tb-xpert-confirm
    description: Xpert MTB/RIF 阳性 → 确诊结核
    condition:
      field: lab_results.Xpert_MTB_RIF
      operator: "=="
      value: MTB_detected
    result:
      diagnosis: 活动性结核病
      severity: 中高危
      recommendation: HRZE 标准方案 — 强化期 2 月 + 巩固期 4 月

  - id: id-tb-rif-resistance
    description: Xpert 检出利福平耐药 → MDR-TB
    condition:
      field: lab_results.Xpert_RIF_resistance
      operator: "=="
      value: detected
    result:
      diagnosis: 利福平耐药结核病（MDR-TB 可能）
      severity: 高危
      recommendation: 二线抗结核方案 + 药敏试验（DST）+ 转诊耐药结核定点医院

  - id: id-hbv-antiviral
    description: HBV DNA > 2000 + ALT > 2×ULN → 抗病毒
    condition:
      and:
        - {field: lab_results.HBV_DNA, operator: ">", value: 2000}
        - {field: lab_results.ALT, operator: ">", value: 80}
      or:
        - {field: pathology.fibrosis_stage, operator: ">=", value: F2}
        - {field: diagnosis, operator: contains, value: 肝硬化}
    result:
      diagnosis: 慢性乙型肝炎（免疫清除期 / 显著纤维化）
      severity: 中高危
      recommendation: 启动一线核苷类似物 — 恩替卡韦 / 替诺福韦 / 丙酚替诺福韦

  - id: id-hbv-cirrhosis
    description: 乙肝肝硬化 → 立即抗病毒
    condition:
      and:
        - {field: lab_results.HBsAg, operator: "==", value: positive}
        - {field: diagnosis, operator: contains, value: 肝硬化}
    result:
      diagnosis: 乙肝后肝硬化
      severity: 高危
      recommendation: 无论 HBV DNA 水平、立即抗病毒 + 每 3-6 月超声/AFP 肝癌筛查

  - id: id-fuo-definition
    description: 发热 > 3 周 + 体温 > 38.3℃ → FUO
    condition:
      and:
        - {field: vitals.fever_duration_days, operator: ">=", value: 21}
        - {field: vitals.temp_max, operator: ">=", value: 38.3}
        - {field: diagnosis, operator: "==", value: undiagnosed}
    result:
      diagnosis: 发热待查（FUO）
      severity: 中危
      recommendation: 启动 FUO 标准化诊疗路径 — 一级检查（血培养/血常规/ESR/CRP/PPD/胸部 CT）

---
rule_type: risk_score
department: 感染内科
capability: cap-l3-infectious-disease-risk
business_process: bp-infectious-disease-assessment
data_entities:
  consumes: [de-patient, de-lab-infection, de-lab-biochemistry, de-treatment-plan]
  produces: [de-risk-assessment]
guideline: 中华医学会感染病学分会 中国感染性疾病诊疗指南 (2022)
stakeholder: 评估 HIV ART 启动时机（CD4 阈值）、机会性感染风险与 COVID-19 高危人群
version: "1.0.0"

rules:
  - id: id-hiv-art-indication
    description: HIV 确诊 → 立即启动 ART
    condition:
      field: lab_results.HIV_antibody
      operator: "=="
      value: positive
    result:
      risk: HIV 感染确证
      severity: 中高危
      recommendation: 无论 CD4 计数，确诊后立即启动 ART（发现即治疗）

  - id: id-hiv-oi-prophylaxis
    description: CD4 < 200 → 机会感染预防
    condition:
      field: lab_results.CD4
      operator: "<"
      value: 200
    result:
      risk: 机会性感染高风险（PCP/弓形虫/TB）
      severity: 高危
      recommendation: 磺胺甲噁唑/甲氧苄啶预防 PCP + 弓形虫、查眼底排除 CMV 视网膜炎

  - id: id-covid-antiviral-high-risk
    description: COVID-19 + 年龄 ≥ 65 / 高危基础病 → 抗病毒
    condition:
      and:
        - {field: lab_results.SARS_CoV_2, operator: "==", value: positive}
        - {field: assessment.symptom_onset_days, operator: "<=", value: 5}
        - {field: patient.high_risk_factor, operator: "==", value: true}
    result:
      risk: 重症 COVID-19 进展高危
      severity: 高危
      recommendation: 尼马瑞韦/利托那韦（Paxlovid）或瑞德西韦 5 日

  - id: id-fuo-red-flag
    description: FUO + 体重下降 > 10% → 肿瘤/感染排查
    condition:
      and:
        - {field: diagnosis, operator: contains, value: FUO}
        - {field: patient.weight_loss_percent, operator: ">", value: 10}
    result:
      risk: 恶性肿瘤 / 深部感染 / 结缔组织病筛查
      severity: 中高危
      recommendation: PET-CT + 骨髓穿刺 + 肿瘤标志物 + 自身抗体全套

  - id: id-hbv-hcc-risk
    description: HBV + 肝硬化 + AFP > 20 → 肝癌高危
    condition:
      and:
        - {field: lab_results.HBsAg, operator: "==", value: positive}
        - {field: diagnosis, operator: contains, value: 肝硬化}
        - {field: lab_results.AFP, operator: ">", value: 20}
    result:
      risk: 肝细胞癌高危
      severity: 高危
      recommendation: 增强 CT/MRI + 肝脏超声造影 + 肝占位活检

---
rule_type: treatment
department: 感染内科
capability: cap-l3-infectious-disease-treatment
business_process: bp-infectious-disease-treatment
data_entities:
  consumes: [de-diagnosis-result, de-risk-assessment, de-lab-infection, de-pathology]
  produces: [de-treatment-plan]
guideline: 中华医学会感染病学分会 中国感染性疾病诊疗指南 (2022)
stakeholder: 实施抗生素合理使用（窄谱优先）、精准抗病毒/抗结核/抗 COVID-19 治疗
version: "1.0.0"

rules:
  - id: id-abx-narrow-first
    description: 未确证感染 → 窄谱抗生素优先
    condition:
      field: diagnosis.infection_confirmed
      operator: "!="
      value: true
    result:
      treatment: 窄谱抗生素 / 观察等待
      antibiotic_stewardship: 避免经验性广谱抗生素
      recommendation: 待病原学结果后选择目标性窄谱方案
      monitoring: 降钙素原（PCT）动态监测 + 48-72h 再评估

  - id: id-abx-deescalation
    description: 培养 + 药敏明确 → 降阶梯
    condition:
      and:
        - {field: lab_results.culture_result, operator: "!=", value: pending}
        - {field: lab_results.susceptibility_available, operator: "==", value: true}
    result:
      treatment: 抗生素降阶梯治疗
      antibiotic_stewardship: 根据药敏结果换用最窄谱有效抗生素
      recommendation: 48-72h 内完成降阶梯，缩短疗程

  - id: id-tb-hrze-regimen
    description: 活动性结核 → HRZE 标准方案
    condition:
      field: diagnosis
      operator: contains
      value: 活动性结核
    result:
      treatment: 异烟肼 + 利福平 + 吡嗪酰胺 + 乙胺丁醇（HRZE）
      phase:
        - 强化期：HRZE 2 月（每日顿服）
        - 巩固期：HR 4 月（每日顿服）
      monitoring: 肝功能 q2w + 视力/色觉（乙胺丁醇）+ 痰涂片/培养 q1m

  - id: id-hbv-entecavir
    description: 乙肝抗病毒 → 恩替卡韦
    condition:
      and:
        - {field: diagnosis, operator: contains, value: 乙型肝炎}
        - {field: lab_results.HBV_DNA, operator: ">", value: 2000}
    result:
      treatment: 恩替卡韦（ETV）
      dosage: 恩替卡韦 0.5mg qd（空腹服用）
      alternatives:
        - 替诺福韦（TDF）300mg qd
        - 丙酚替诺福韦（TAF）25mg qd
      monitoring: HBV DNA q3-6m + ALT q3m + HBeAg/抗-HBe q6m

  - id: id-hiv-art-initiation
    description: HIV 确诊 → ART 立即启动
    condition:
      field: lab_results.HIV_antibody
      operator: "=="
      value: positive
    result:
      treatment: 三联 ART 方案
      first_line: TAF + FTC + DTG（必妥维）或 TDF + 3TC + DTG
      cd4_threshold: 无论 CD4 计数，确诊即治疗
      monitoring: CD4 q3m + HIV RNA q3-6m + VL < 50（治疗目标）

  - id: id-covid-paxlovid
    description: COVID-19 高危 → Paxlovid
    condition:
      and:
        - {field: lab_results.SARS_CoV_2, operator: "==", value: positive}
        - {field: assessment.symptom_onset_days, operator: "<=", value: 5}
        - {field: patient.high_risk_factor, operator: "==", value: true}
        - {field: lab_results.eGFR, operator: ">=", value: 30}
    result:
      treatment: 尼马瑞韦/利托那韦（Paxlovid）
      dosage: 尼马瑞韦 300mg + 利托那韦 100mg po bid × 5 日
      indication: 轻中度 COVID-19 伴高危因素、发病 ≤ 5 日
      precaution: eGFR < 30 禁用、核查药物相互作用（CYP3A4）

  - id: id-covid-remdesivir
    description: COVID-19 高危 → 瑞德西韦
    condition:
      and:
        - {field: lab_results.SARS_CoV_2, operator: "==", value: positive}
        - {field: assessment.symptom_onset_days, operator: "<=", value: 7}
        - {field: patient.high_risk_factor, operator: "==", value: true}
        - {field: lab_results.eGFR, operator: "<", value: 30}
    result:
      treatment: 瑞德西韦（Veklury）
      dosage: D1 200mg IV + D2-D5 100mg IV qd（5 日）
      indication: COVID-19 伴高危因素且不能用 Paxlovid（肾功不全）
      monitoring: 肝肾功能 + 凝血 q3d
