# 消化内科临床规则 — 慢性胃炎 + H.pylori + 溃疡
rule_type: diagnosis
department: 消化内科
capability: cap-l3-gastro-diagnosis
business_process: bp-gastroenterology-diagnosis
data_entities:
  consumes:
  - de-lab-hp
  - de-endoscopy
  - de-patient
  produces:
  - de-diagnosis-result
guideline: 中国慢性胃炎共识（2022）
stakeholder: 胃炎诊断与Hp检测
version: "1.0.0"

rules:
  - id: gastritis-hp-test
    description: H.pylori检测指征
    condition:
      or:
        - field: symptoms; operator: contains; value: 上腹痛
        - field: symptoms; operator: contains; value: 腹胀
        - field: symptoms; operator: contains; value: 消化不良
    result:
      test: H.pylori检测
      methods:
        - "C13/C14 呼气试验 (首选)"
        - 粪便Hp抗原
        - 胃镜快速尿素酶 (胃镜检查时)

  - id: gastritis-classify
    description: 慢性胃炎分类
    condition:
      field: endoscopy; operator: contains; value: 胃炎
    result:
      classification:
        - 慢性非萎缩性胃炎 (CNAG)
        - 慢性萎缩性胃炎 (CAG)
        - 自身免疫性胃炎 (AIG)
      pathology: "OLGA/OLGIM分期评估萎缩/肠化严重度"

  - id: gastritis-olga
    description: OLGA/OLGIM分期评估
    condition:
      field: endoscopy; operator: contains; value: 萎缩
    result:
      staging: "OLGA III-IV期或OLGIM III-IV期为胃癌高风险"
      followup: "OLGA II+ → 每1-3年胃镜监测"

---
rule_type: treatment
department: 消化内科
capability: cap-l3-gastro-treatment
business_process: bp-gastroenterology-treatment
data_entities:
  consumes:
  - de-diagnosis-result
  produces:
  - de-treatment-plan
guideline: 中国慢性胃炎共识（2022）
stakeholder: Hp根除与胃炎治疗
version: "1.0.0"

rules:
  - id: hp-eradication
    description: H.pylori根除治疗（铋剂四联）
    condition:
      field: lab_results.Hp; operator: equals; value: positive
    result:
      treatment: 铋剂四联疗法 14天
      regimen:
        - PPI (艾司奥美拉唑 20mg bid)
        - 铋剂 (枸橼酸铋钾 220mg bid)
        - 阿莫西林 1g bid
        - 克拉霉素 500mg bid
      alternative: "青霉素过敏: 甲硝唑 400mg tid 替代阿莫西林"
      post_treatment: 停药4周后复查C13/C14

  - id: gastritis-symptom
    description: 慢性胃炎对症治疗
    condition:
      field: diagnosis; operator: contains; value: 胃炎
    result:
      treatment: 对症治疗
      medications:
        - PPI/H2RA (抑酸)
        - 胃黏膜保护剂 (铝碳酸镁/瑞巴派特)
        - 促动力药 (莫沙必利) 腹胀时
        - 消化酶制剂 (复方消化酶) 消化不良时

  - id: peptic-ulcer
    description: 消化性溃疡治疗
    condition:
      field: diagnosis; operator: contains; value: 溃疡
    result:
      treatment: PPI + Hp根除
      medications:
        - PPI 标准剂量 4-8周 (十二指肠) / 6-8周 (胃)
        - Hp阳性: 铋剂四联
      warnings:
        - NSAIDs相关: 停用NSAIDs + PPI
        - 出血征象: 急诊胃镜

---
rule_type: followup
department: 消化内科
capability: cap-l3-gastro-followup
business_process: bp-gastroenterology-followup
data_entities:
  consumes:
  - de-treatment-plan
  produces:
  - de-followup-plan
guideline: 中国慢性胃炎共识（2022）
stakeholder: 萎缩性胃炎随访监测
version: "1.0.0"

rules:
  - id: cag-surveillance
    description: 萎缩性胃炎内镜监测
    condition:
      and:
        - field: diagnosis; operator: contains; value: 萎缩性胃炎
        - field: pathology.OLGA; operator: ">="; value: 2
    result:
      surveillance:
        - risk: OLGA I-II; interval: 每3年
        - risk: OLGA III-IV; interval: 每1-2年
        - risk: 低级别上皮内瘤变; interval: 每6-12月
        - risk: 高级别上皮内瘤变; action: 立即ESD
      red_flags:
        - 新发消瘦/贫血/黑便 → 紧急胃镜

  - id: hp-retest
    description: Hp根除后复查
    condition:
      field: treatment; operator: contains; value: 根除Hp
    result:
      retest: 停药≥4周后C13/C14呼气试验
      actions:
        - 阴性: 常规随访
        - 阳性: 二线方案 (含左氧氟沙星/四环素/呋喃唑酮)
