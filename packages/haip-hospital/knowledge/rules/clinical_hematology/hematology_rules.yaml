# 白血病 WBC 阈值规则
rule_type: leukemia_alert
department: 血液内科
capability: cap-l3-hematology-risk
business_process: bp-hematology-assessment
data_entities:
  consumes: [de-patient, de-lab-hematology, de-bone-marrow]
  produces: [de-risk-assessment]
guideline: 中华血液学杂志 中国急性白血病诊疗指南 (2022)
stakeholder: 白血病相关血常规危急值的早期识别与分诊
version: "1.0.0"

rules:
  - id: he-wbc-leukemia-alert
    description: WBC > 100 ×10⁹/L → 白细胞淤滞风险
    condition:
      field: lab_results.WBC
      operator: ">"
      value: 100
    result:
      diagnosis: 高白细胞性白血病（白细胞淤滞）
      severity: 危重
      recommendation: 水化、别嘌醇/拉布立酶预防 TLS、紧急白细胞分离术

  - id: he-wbc-leukopenia
    description: WBC < 0.5 → 极重度粒缺
    condition:
      field: lab_results.WBC
      operator: "<"
      value: 0.5
    result:
      diagnosis: 极重度粒细胞缺乏
      severity: 危重
      recommendation: 严格保护性隔离、G-CSF 5μg/kg qd、广谱抗生素

  - id: he-hyperleukocytosis-risk
    description: WBC > 50 + 幼稚细胞 > 10% → 白血病高白细胞
    condition:
      and:
        - {field: lab_results.WBC, operator: ">", value: 50}
        - {field: lab_results.blast_percent, operator: ">", value: 10}
    result:
      diagnosis: 高白细胞性白血病（高风险）
      severity: 高危
      recommendation: 紧急骨髓穿刺、白细胞分离术准备、TLS 预防

---
# DIC 评分规则
rule_type: dic_scoring
department: 血液内科
capability: cap-l3-hematology-coagulation
business_process: bp-hematology-diagnosis
data_entities:
  consumes: [de-patient, de-lab-coagulation, de-lab-hematology]
  produces: [de-dic-score]
guideline: 中华血液学杂志 弥漫性血管内凝血诊断与治疗中国专家共识 (2022)
stakeholder: ISTH DIC 评分系统用于 DIC 早期诊断与分级
version: "1.0.0"

rules:
  - id: he-dic-score-alert
    description: DIC 评分 ≥ 5 → 显性 DIC
    condition:
      and:
        - {field: lab_results.PLT_drop, operator: "==", value: true}
        - {field: lab_results.D_dimer, operator: ">", value: 5000}
        - {field: lab_results.PT_prolonged, operator: ">", value: 3}
        - {field: lab_results.FIB, operator: "<", value: 1.0}
    result:
      diagnosis: 显性 DIC（ISTH ≥ 5 分）
      severity: 危重
      recommendation: 积极治疗原发病、血小板输注（PLT < 50）、新鲜冰冻血浆
      scoring: PLT 减少 2 分 + D-二聚体升高 3 分 + PT 延长 1 分 + FIB 降低 1 分

  - id: he-dic-score-risk
    description: DIC 评分 3-4 → 非显性 DIC
    condition:
      and:
        - {field: lab_results.D_dimer, operator: ">", value: 2000}
        - {field: lab_results.PLT, operator: "<", value: 100}
    result:
      diagnosis: 非显性 DIC（ISTH 3-4 分）
      severity: 高危
      recommendation: 动态监测 PLT、PT、FIB、D-二聚体（每 6-12h）、纠正可逆病因

  - id: he-fib-critical
    description: FIB < 1.0 → 严重低纤维蛋白原血症
    condition:
      field: lab_results.FIB
      operator: "<"
      value: 1.0
    result:
      diagnosis: 严重低纤维蛋白原血症
      severity: 危重
      recommendation: 输注冷沉淀/纤维蛋白原浓缩剂、FIB 目标 > 1.5g/L

---
# 输血指征规则
rule_type: transfusion
department: 血液内科
capability: cap-l3-hematology-treatment
business_process: bp-hematology-treatment
data_entities:
  consumes: [de-patient, de-lab-hematology, de-lab-coagulation]
  produces: [de-transfusion-order]
guideline: 中华血液学杂志 血液成分输注临床指南 (2022)
stakeholder: 基于限制性输血策略的规范输血指征
version: "1.0.0"

rules:
  - id: he-rbc-transfusion-hb70
    description: Hb < 70 → 输注红细胞（非心血管病）
    condition:
      field: lab_results.Hb
      operator: "<"
      value: 70
    result:
      transfusion: 红细胞悬液 1-2U
      target: Hb 70-90 g/L
      exception: 急性出血、冠心病/脑缺血时 Hb < 80 触发

  - id: he-plt20-transfusion
    description: PLT < 20 → 预防性输注血小板
    condition:
      field: lab_results.PLT
      operator: "<"
      value: 20
    result:
      transfusion: 血小板 1 治疗量
      target: PLT > 20 ×10⁹/L
      exception: 手术/有创操作前 PLT > 50、神经外科 PLT > 100

  - id: he-ffp-inr
    description: INR > 1.8 → 输注新鲜冰冻血浆
    condition:
      field: lab_results.INR
      operator: ">"
      value: 1.8
    result:
      transfusion: 新鲜冰冻血浆（FFP）10-15mL/kg
      target: INR < 1.5
      exception: 活动性出血或术前紧急纠正
