# 化疗毒性管理规则
rule_type: chemo_toxicity
department: 肿瘤科
capability: cap-l3-oncology-toxicity
business_process: bp-oncology-treatment
data_entities:
  consumes: [de-patient, de-lab-hematology, de-vital-signs]
  produces: [de-toxicity-alert]
guideline: CSCO常见恶性肿瘤诊疗指南（2024）
stakeholder: 化疗骨髓抑制与发热性粒缺的早期预警与干预
version: "1.0.0"

rules:
  - id: on-neutropenia-gcsf
    description: ANC < 1.0 → G-CSF 预防性升白
    condition:
      field: lab_results.ANC
      operator: "<"
      value: 1.0
    result:
      toxicity: 化疗后中性粒细胞减少（Grade 3）
      severity: 高危
      recommendation: G-CSF 5μg/kg qd、监测体温、避免感染
      alert: 粒细胞减少需预防性抗生素

  - id: on-fn-risk
    description: ANC < 0.5 + T > 38.3°C → 发热性粒缺
    condition:
      and:
        - {field: lab_results.ANC, operator: "<", value: 0.5}
        - {field: vital_signs.temperature, operator: ">=", value: 38.3}
    result:
      toxicity: 发热性粒细胞缺乏症
      severity: 危重
      recommendation: 立即住院、广谱抗生素（哌拉西林/他唑巴坦）、血培养、G-CSF
      alert: 粒缺发热是肿瘤急症，需在 1 小时内启动抗生素

  - id: on-plt-chemo-delay
    description: PLT < 50 → 推迟化疗/减量
    condition:
      field: lab_results.PLT
      operator: "<"
      value: 50
    result:
      toxicity: 化疗后血小板减少（Grade 3）
      severity: 高危
      recommendation: 推迟化疗至 PLT > 75、rhTPO 或 IL-11 支持

