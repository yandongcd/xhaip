# 肿瘤筛查规则
rule_type: screening
department: 肿瘤科
capability: cap-l3-oncology-screening
business_process: bp-oncology-reception
data_entities:
  consumes: [de-patient, de-lab-tumor-marker, de-imaging]
  produces: [de-screening-result]
guideline: CSCO常见恶性肿瘤诊疗指南（2024）
stakeholder: 高危人群肿瘤早筛，降低晚期诊断率
version: "1.0.0"

rules:
  - id: on-screen-lung
    description: 肺癌高危人群年度 LDCT 筛查
    condition:
      and:
        - {field: patient.age, operator: ">=", value: 50}
        - {field: patient.smoking_history, operator: ">=", value: 30}
        - {field: patient.pack_years, operator: ">=", value: 20}
    result:
      screening: 低剂量螺旋 CT（LDCT）
      frequency: 每年 1 次
      high_risk_group: 50-74 岁、吸烟≥30 包年

  - id: on-screen-liver
    description: 肝癌高危人群超声 + AFP 筛查
    condition:
      and:
        - {field: lab_results.HBsAg, operator: "==", value: positive}
        - {field: patient.age, operator: ">=", value: 40}
    result:
      screening: 腹部超声 + AFP
      frequency: 每 6 个月 1 次
      high_risk_group: 乙肝/肝硬化患者、40 岁以上

  - id: on-screen-colorectal
    description: 结直肠癌高危人群肠镜筛查
    condition:
      and:
        - {field: patient.age, operator: ">=", value: 45}
        - {field: patient.family_history, operator: contains, value: 结直肠癌}
    result:
      screening: 肠镜
      frequency: 每 5-10 年 1 次
      high_risk_group: 45 岁以上或有家族史

