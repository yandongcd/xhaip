# 免疫治疗 irAE 管理规则
rule_type: immunotherapy
department: 肿瘤科
capability: cap-l3-oncology-immunotherapy
business_process: bp-oncology-treatment
data_entities:
  consumes: [de-patient, de-lab-biochemistry, de-imaging, de-vital-signs]
  produces: [de-irae-alert]
guideline: CSCO常见恶性肿瘤诊疗指南（2024）
stakeholder: 免疫检查点抑制剂相关不良反应（irAE）的早期识别与分级管理
version: "1.0.0"

rules:
  - id: on-irae-pneumonitis
    description: 干咳 + 呼吸困难 + ICIs 用药史 → 免疫性肺炎
    condition:
      and:
        - {field: symptoms, operator: contains, value: 干咳}
        - {field: symptoms, operator: contains, value: 呼吸困难}
        - {field: treatment_history, operator: contains, value: ICIs}
    result:
      irAE: 免疫相关性肺炎
      severity: 高危
      recommendation: 暂停 ICIs、甲泼尼龙 1-2mg/kg/d、胸部 HRCT
      grade: G2 及以上需永久停用 ICIs

  - id: on-irae-colitis
    description: 腹泻 > 4 次/天 + ICIs → 免疫性结肠炎
    condition:
      and:
        - {field: symptoms.diarrhea_freq, operator: ">=", value: 4}
        - {field: treatment_history, operator: contains, value: ICIs}
    result:
      irAE: 免疫相关性结肠炎
      severity: 中危
      recommendation: 口服泼尼松 1mg/kg/d、补液、粪便培养排除感染
      grade: G3 需静脉甲泼尼龙 + 英夫利西单抗

  - id: on-irae-hepatitis
    description: ALT > 5×ULN + ICIs → 免疫性肝炎
    condition:
      and:
        - {field: lab_results.ALT, operator: ">", value: 200}
        - {field: treatment_history, operator: contains, value: ICIs}
    result:
      irAE: 免疫相关性肝炎
      severity: 高危
      recommendation: 暂停 ICIs、甲泼尼龙 1-2mg/kg/d、排除病毒性肝炎

  - id: on-irae-skin
    description: 皮疹 + ICIs → 免疫性皮炎
    condition:
      and:
        - {field: physical_exam, operator: contains, value: 皮疹}
        - {field: treatment_history, operator: contains, value: ICIs}
    result:
      irAE: 免疫相关性皮炎
      severity: 低危
      recommendation: 外用糖皮质激素、口服抗组胺药、继续 ICIs 监测

---
# 癌痛三阶梯管理规则
rule_type: pain
department: 肿瘤科
capability: cap-l3-oncology-pain
business_process: bp-oncology-treatment
data_entities:
  consumes: [de-patient, de-pain-assessment]
  produces: [de-pain-plan]
guideline: CSCO常见恶性肿瘤诊疗指南（2024）
stakeholder: 癌痛规范化管理，遵循 WHO 三阶梯止痛原则
version: "1.0.0"

rules:
  - id: on-pain-step1
    description: NRS 1-3 → 第一阶梯（非阿片类）
    condition:
      field: pain_assessment.NRS
      operator: "<="
      value: 3
    result:
      step: 第一阶梯
      treatment: 非甾体抗炎药（NSAIDs）
      medications:
        - 布洛芬 400mg q6h
        - 对乙酰氨基酚 500mg q6h
      monitoring: 每 24h 评估疼痛

  - id: on-pain-step2
    description: NRS 4-6 → 第二阶梯（弱阿片类）
    condition:
      and:
        - {field: pain_assessment.NRS, operator: ">=", value: 4}
        - {field: pain_assessment.NRS, operator: "<=", value: 6}
    result:
      step: 第二阶梯
      treatment: 弱阿片类药物 ± NSAIDs
      medications:
        - 曲马多 50-100mg q6h
        - 可待因 30mg q6h
      monitoring: 每 12h 评估、记录不良反应

  - id: on-pain-step3
    description: NRS 7-10 → 第三阶梯（强阿片类）
    condition:
      field: pain_assessment.NRS
      operator: ">="
      value: 7
    result:
      step: 第三阶梯
      treatment: 强阿片类药物
      medications:
        - 吗啡即释片 10mg q4h（滴定）
        - 吗啡缓释片 30mg q12h（维持）
        - 芬太尼透皮贴剂 25μg/h q72h
      monitoring: 每 4h 评估、阿片耐受与便秘管理

  - id: on-breakthrough-pain
    description: 爆发痛 → 即释阿片解救
    condition:
      field: pain_assessment.breakthrough
      operator: "=="
      value: true
    result:
      step: 爆发痛处理
      treatment: 即释吗啡解救剂量
      dosage: 24h 总剂量 × 10-15% 即释吗啡
      frequency: 每 1-2h 可重复给药
      alert: 24h 解救 > 3 次需上调背景剂量
