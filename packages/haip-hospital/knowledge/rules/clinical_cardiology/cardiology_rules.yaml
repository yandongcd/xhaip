# 心血管内科临床规则 — 心衰诊断 + GDMT + 高血压分级
rule_type: diagnosis
department: 心血管内科
capability: cap-l3-cardio-hf-diagnosis
business_process: bp-cardiology-diagnosis
data_entities:
  consumes:
  - de-lab-cardiac
  - de-lab-biochemistry
  - de-patient
  produces:
  - de-diagnosis-result
guideline: 中国心力衰竭诊断和治疗指南 (2024)
stakeholder: 快速判断心衰严重度决定住院/门诊
version: "1.0.0"

rules:
  - id: hf-ntprobnp
    description: NT-proBNP > 300 → 心衰确诊
    condition:
      or:
        - field: lab_results.NT-proBNP; operator: ">="; value: 300
        - field: lab_results.BNP; operator: ">="; value: 100
    result:
      diagnosis: 心力衰竭
      severity: 确诊

  - id: hf-acute
    description: NT-proBNP > 5000 → 急性心衰
    condition:
      field: lab_results.NT-proBNP; operator: ">="; value: 5000
    result:
      diagnosis: 急性心力衰竭
      severity: 危重
      recommendation: 立即住院

  - id: htn-grade-3
    description: 高血压3级（高龄）
    condition:
      and:
        - field: diagnosis; operator: contains; value: 高血压
        - field: age; operator: ">="; value: 60
    result:
      diagnosis: 高血压病3级（高危）
      severity: 高危

  - id: htn-grade-2
    description: 高血压2级（中青年）
    condition:
      and:
        - field: diagnosis; operator: contains; value: 高血压
        - field: age; operator: "<"; value: 60
    result:
      diagnosis: 高血压病2级
      severity: 中危

  - id: acs-stemi
    description: 急性心梗
    condition:
      or:
        - field: diagnosis; operator: contains; value: ST段抬高
        - field: diagnosis; operator: contains; value: 急性心梗
        - field: lab_results.Troponin; operator: ">="; value: 0.5
    result:
      diagnosis: 急性ST段抬高心肌梗死
      severity: 危重
      recommendation: 急诊PCI

---
rule_type: treatment
department: 心血管内科
capability: cap-l3-cardio-treatment-plan
business_process: bp-cardiology-treatment
data_entities:
  consumes:
  - de-diagnosis-result
  produces:
  - de-treatment-plan
guideline: 中国心力衰竭诊断和治疗指南 (2024)
stakeholder: 根据诊断选择GDMT方案
version: "1.0.0"

rules:
  - id: hfref-gdmt
    description: GDMT四联疗法
    condition:
      field: diagnosis; operator: contains; value: 心衰
    result:
      treatment: GDMT四联疗法
      medications:
        - ARNI/ACEI
        - β阻滞剂
        - MRA
        - SGLT2i

  - id: htn-combination
    description: 高血压联合治疗
    condition:
      field: diagnosis; operator: contains; value: 高血压
    result:
      treatment: 个体化降压
      medications:
        - CCB首选
        - ACEI/ARB

---
rule_type: followup
department: 心血管内科
capability: cap-l3-cardio-followup
business_process: bp-cardiology-followup
data_entities:
  consumes:
  - de-treatment-plan
  - de-patient
  produces:
  - de-followup-plan
stakeholder: 制定出院随访计划
version: "1.0.0"

rules:
  - id: hf-followup
    description: 心衰出院随访
    condition:
      field: diagnosis; operator: contains; value: 心衰
    result:
      followup_schedule:
        - time: 出院1周; items: 体重/血压/症状
        - time: 出院1月; items: NT-proBNP/心超/肾功能
        - time: 出院3月; items: 全面评估/GDMT优化
      red_flags:
        - 体重3天增>2kg
        - 不能平卧
