# 皮肤科临床规则 — 皮疹严重度 + 皮肤肿瘤筛查 + 全身性疾病皮肤表现
rule_type: diagnosis
department: 皮肤科
capability: cap-l3-dermatology-diagnosis
business_process: bp-dermatology-diagnosis
data_entities:
  consumes: [de-patient, de-exam-skin, de-lab-biochemistry]
  produces: [de-diagnosis-result]
guideline: 中华皮肤科杂志 常见皮肤病诊疗指南 (2023)
stakeholder: 皮肤科医师需综合皮疹分布与全身表现诊断
version: "1.0.0"

rules:
  - id: derm-extensive-rash-systemic
    description: 皮疹 > 30% 体表面积 → 系统治疗
    condition:
      field: exam.BSA_involved
      operator: ">"
      value: 30
    result:
      diagnosis: 重度泛发性皮肤病
      severity: 需系统治疗
      recommendation: 系统用药 + 住院治疗

  - id: derm-abcde-melanoma
    description: ABCDE 阳性 → 皮肤活检
    condition:
      field: exam.ABCDE_criteria
      operator: "=="
      value: positive
    result:
      diagnosis: 疑似恶性黑色素瘤
      severity: 高危
      recommendation: 皮肤镜 + 病灶切除活检

  - id: derm-pruritus-jaundice
    description: 瘙痒伴黄疸 → 肝病排查
    condition:
      and:
        - field: symptom.pruritus
          operator: "=="
          value: true
        - field: exam.jaundice
          operator: "=="
          value: true
    result:
      diagnosis: 胆汁淤积性瘙痒
      severity: 系统性疾病皮肤表现
      recommendation: 肝功能 + 肝胆超声 + 病因排查

---
rule_type: risk_score
department: 皮肤科
capability: cap-l3-dermatology-risk
business_process: bp-dermatology-risk-assessment
data_entities:
  consumes: [de-patient, de-exam-skin, de-lab]
  produces: [de-risk-assessment]
guideline: 中华皮肤科杂志 重症皮肤病诊疗共识 (2022)
stakeholder: 识别大疱性疾病与重症药疹等高危情况
version: "1.0.0"

rules:
  - id: derm-bullous-critical
    description: 大疱性皮肤病 → 危重
    condition:
      field: exam.bullous_lesion
      operator: "=="
      value: true
    result:
      risk: 大疱性皮肤病
      severity: 危重
      recommendation: 皮肤科住院 + 糖皮质激素 + 创面护理

  - id: derm-drug-eruption-sjs
    description: 药物疹伴发热 → SJS / TEN 排查
    condition:
      and:
        - field: exam.drug_eruption
          operator: "=="
          value: true
        - field: vital.temperature
          operator: ">="
          value: 38
    result:
      risk: 疑似 Stevens-Johnson 综合征
      severity: 极高危
      recommendation: 立即停用可疑药物 + 烧伤中心救治

---
rule_type: treatment
department: 皮肤科
capability: cap-l3-dermatology-treatment
business_process: bp-dermatology-treatment
data_entities:
  consumes: [de-diagnosis-result, de-risk-assessment]
  produces: [de-treatment-plan]
guideline: 中华皮肤科杂志 银屑病与荨麻疹治疗指南 (2023)
stakeholder: 根据疾病类型与严重度选择外用或系统治疗
version: "1.0.0"

rules:
  - id: derm-steroid-severe
    description: 重症皮肤病 → 系统糖皮质激素
    condition:
      field: diagnosis.severity
      operator: "=="
      value: severe
    result:
      treatment: 系统糖皮质激素
      indication: 重症药疹 / 大疱性疾病
      monitoring: 血糖、血压、感染征象

  - id: derm-antihistamine-urticaria
    description: 荨麻疹 → 抗组胺药
    condition:
      field: diagnosis.urticaria
      operator: "=="
      value: true
    result:
      treatment: 第二代抗组胺药口服
      indication: 急慢性荨麻疹
      duration: 症状控制后逐渐减量

  - id: derm-phototherapy-psoriasis
    description: 中重度银屑病 → 光疗
    condition:
      field: diagnosis.psoriasis_moderate_severe
      operator: "=="
      value: true
    result:
      treatment: NB-UVB 光疗
      indication: 中重度斑块型银屑病
      schedule: 每周 2-3 次
