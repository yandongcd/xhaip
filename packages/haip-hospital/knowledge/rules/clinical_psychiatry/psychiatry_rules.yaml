# 精神心理科临床规则 — PHQ-9 + GAD-7 + 精神分裂症 + 自杀风险分层 + CBT-I
rule_type: diagnosis
department: 精神心理科
capability: cap-l3-psychiatry-diagnosis
business_process: bp-psychiatry-diagnosis
data_entities:
  consumes:
    - de-patient
    - de-assessment-psych
    - de-scale-score
    - de-suicide-assessment
  produces:
    - de-diagnosis-result
guideline: 中国精神障碍防治指南（2023）
stakeholder: 精神科医师通过量表筛查与临床访谈进行诊断与严重度分级
version: "1.0.0"

rules:
  - id: psych-phq9-mild
    description: PHQ-9 轻度抑郁 → 观察等待 + 心理教育
    condition:
      field: scale.PHQ9_score
      operator: "<="
      value: 9
      and:
        field: scale.PHQ9_score
        operator: ">="
        value: 5
    result:
      diagnosis: 轻度抑郁
      severity: 轻
      recommendation: 观察等待（2-4 周复查）+ 心理教育 + 运动指导 + 社会支持激活

  - id: psych-phq9-moderate
    description: PHQ-9 中度抑郁 → 心理治疗 ± 药物
    condition:
      field: scale.PHQ9_score
      operator: "<="
      value: 14
      and:
        field: scale.PHQ9_score
        operator: ">="
        value: 10
    result:
      diagnosis: 中度抑郁发作
      severity: 中
      recommendation: CBT 认知行为治疗 / IPT 人际关系治疗 ± SSRI
      treatment_tier: 2

  - id: psych-phq9-severe
    description: PHQ-9 重度抑郁 → 药物治疗 + 心理治疗
    condition:
      field: scale.PHQ9_score
      operator: ">="
      value: 15
    result:
      diagnosis: 中重度/重度抑郁发作
      severity: 重
      recommendation: SSRI/SNRI 一线 + CBT/IPT 联合 + 精神科专科评估
      treatment_tier: 3

  - id: psych-hamd-severity
    description: HAMD-17 汉密尔顿抑郁量表严重度
    condition:
      field: scale.HAMD17_score
      operator: ">="
      value: 0
    result:
      assessment: HAMD-17 抑郁严重度
      grading:
        - range: "0-7"
          label: 无抑郁/正常
        - range: "8-16"
          label: 轻度抑郁
        - range: "17-23"
          label: 中度抑郁
        - range: "≥ 24"
          label: 重度抑郁

  - id: psych-depression-treatment-tier
    description: 抑郁症分级治疗阶梯
    condition:
      field: diagnosis
      operator: contains
      value: 抑郁
    result:
      treatment: 抑郁症分级治疗方案
      tiers:
        - tier: 1（轻）
          phq9: "5-9"
          intervention: 观察等待 + 低强度心理干预（在线CBT/指导自助）
          duration: 2-4 周评估
        - tier: 2（中）
          phq9: "10-14"
          intervention: 高强度心理治疗（CBT/IPT）± SSRI
          followup: "2 周后评估 → 无效升级"
        - tier: 3（重）
          phq9: "15-19"
          intervention: SSRI 或 SNRI + 心理治疗 + 精神专科
          followup: "1-2 周评估 → 增效/换药"
        - tier: 4（极重/自杀）
          phq9: "≥ 20 或第 9 项 ≥ 1"
          intervention: 住院治疗 + ECT 评估 + 药物联合
          setting: 住院/日间

  - id: psych-gad7-mild
    description: GAD-7 轻度焦虑 → 心理教育
    condition:
      field: scale.GAD7_score
      operator: "<="
      value: 9
      and:
        field: scale.GAD7_score
        operator: ">="
        value: 5
    result:
      diagnosis: 轻度焦虑
      severity: 轻
      recommendation: 心理教育 + 放松训练 + 运动处方

  - id: psych-gad7-moderate
    description: GAD-7 中度焦虑 → 心理治疗
    condition:
      field: scale.GAD7_score
      operator: "<="
      value: 14
      and:
        field: scale.GAD7_score
        operator: ">="
        value: 10
    result:
      diagnosis: 中度焦虑障碍
      severity: 中
      recommendation: CBT 认知行为治疗（焦虑管理）+ 考虑 SSRI（艾司西酞普兰/舍曲林）

  - id: psych-gad7-severe
    description: GAD-7 重度焦虑 → 药物治疗
    condition:
      field: scale.GAD7_score
      operator: ">="
      value: 15
    result:
      diagnosis: 重度焦虑障碍
      severity: 重
      recommendation: SSRI/SNRI 一线 + CBT 联合 + 精神科专科管理
      caution: 避免长期苯二氮卓类（仅限急性期 ≤ 4 周）

  - id: psych-schizophrenia-first-episode
    description: 精神分裂症首发 → 抗精神病药选择
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 精神分裂症
        - field: episode
          operator: equals
          value: first
    result:
      diagnosis: 首发精神分裂症
      recommendation: 第二代抗精神病药（SGA）低剂量起始
      criteria:
        - 阳性症状为主 → 阿立哌唑/帕利哌酮/利培酮
        - 阴性/认知症状为主 → 氨磺必利/奥氮平
        - 首发年轻人 → 阿立哌唑（代谢副作用小）
        - 合并失眠/激越 → 奥氮平（镇静作用）

  - id: psych-schizophrenia-relapse
    description: 精神分裂症复发 → 调整方案
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 精神分裂症
        - field: episode
          operator: in
          value: [relapse, multiple]
    result:
      diagnosis: 复发精神分裂症
      recommendation: 剂量优化 → 换药 → 氯氮平（难治性）
      protocol:
        - step_1: 当前药物加量至最大耐受剂量（2-4 周）
        - step_2: 换用不同作用机制 SGA（4-6 周评估）
        - step_3: 氯氮平（需 ANC ≥ 1.5×10⁹/L 且绝对中性粒细胞 ≥ 1.0×10⁹/L）
        - step_4: ECT 联合（难治性阳性症状/紧张症）

  - id: psych-antipsychotic-selection
    description: 抗精神病药物比较选择
    condition:
      field: diagnosis
      operator: contains
      value: 精神分裂症
    result:
      treatment: 抗精神病药物选择矩阵
      options:
        - drug: 阿立哌唑
          class: SGA（部分激动）
          weight_gain: +
          prolactin: -(低)
          sedation: +
          indication: 首发/阴性症状/代谢顾虑
        - drug: 利培酮
          class: SGA
          weight_gain: ++
          prolactin: +++(高)
          sedation: ++
          indication: 阳性症状/青年
        - drug: 帕利哌酮
          class: SGA
          weight_gain: ++
          prolactin: ++
          sedation: +
          indication: 急性/维持/长效针剂
        - drug: 奥氮平
          class: SGA
          weight_gain: +++(高)
          prolactin: +
          sedation: +++(高)
          indication: 激越/失眠/急性期
        - drug: 喹硫平
          class: SGA
          weight_gain: ++
          prolactin: \"-\"
          sedation: +++
          indication: 失眠/焦虑共病/老年
        - drug: 氨磺必利
          class: SGA
          weight_gain: +
          prolactin: +++
          sedation: +
          indication: 阴性症状/低剂量情感稳定
        - drug: 氯氮平
          class: SGA
          weight_gain: +++(极高)
          prolactin: \"-\"
          sedation: +++
          indication: 难治性/自杀风险
        - drug: 氟哌啶醇
          class: FGA
          weight_gain: +
          prolactin: +++
          sedation: +
          indication: 急性激越（IM）/短期使用
      monitoring: 基线 + 3 月 + 年检 — 体重/BMI/腰围/FBG/Lipid/Prolactin/ECG(QTc)

  - id: psych-suicide-low
    description: 自杀风险 — 低风险
    condition:
      field: suicide_risk
      operator: equals
      value: low
    result:
      risk: 自杀低风险
      features:
        - 一过性自杀意念（无具体计划）
        - 无既往自杀未遂史
        - 家庭/社会支持系统良好
        - PHQ-9 第 9 项 0 分
      intervention:
        - 门诊随访 + 心理支持
        - 心理治疗（CBT/DBT）
        - 安全计划制定

  - id: psych-suicide-med
    description: 自杀风险 — 中风险
    condition:
      field: suicide_risk
      operator: equals
      value: medium
    result:
      risk: 自杀中风险
      features:
        - 反复自杀意念 + 有模糊计划
        - 既往自杀未遂史
        - 社会支持不足
        - PHQ-9 第 9 项 ≥ 1
      intervention:
        - 精神科专科门诊（1 周内）
        - 限制自杀工具接触
        - 抗抑郁药 + 心理治疗（DBT/CBT-SP）
        - 安全计划 + 紧急联系人
        - 氯氮平（精神分裂症伴自杀）

  - id: psych-suicide-high
    description: 自杀风险 — 高风险
    condition:
      field: suicide_risk
      operator: equals
      value: high
    result:
      risk: 自杀高风险
      features:
        - 具体自杀计划 + 准备手段
        - 近期自杀未遂（< 3 月）
        - 精神疾病急性发作（重度抑郁/双相/精神分裂症）
        - 物质滥用共病
        - 孤立/失业/近期丧失
      intervention:
        - 立即精神科急诊评估
        - 建议住院治疗（自愿或强制）
        - 24 小时看护
        - 环境安全检查（移除危险物品）
        - 药物 + 强化心理治疗

  - id: psych-suicide-imminent
    description: 自杀风险 — 极高/即刻风险
    condition:
      field: suicide_risk
      operator: equals
      value: imminent
    result:
      risk: 自杀即刻风险（急症）
      features:
        - 已采取自杀行动 / 正在执行中
        - 明确表示即将自杀
        - 暴力自杀方式已准备
      intervention:
        - 强制住院（精神卫生法）
        - 一对一 24h 持续监护
        - 约束保护（必要时）
        - 快速镇静 + 药物干预
        - ECT（快速起效指征）
        - 出院条件：风险降低 + 安全计划 + 随访安排

  - id: psych-insomnia-assessment
    description: 失眠障碍评估
    condition:
      field: sleep_complaint
      operator: not_null
      value: true
    result:
      assessment: 失眠障碍评估
      diagnostic_criteria:
        - 入睡困难（> 30min）
        - 睡眠维持困难（觉醒 ≥ 2 次/夜）
        - 早醒（比预期早 > 30min）
        - 日间功能损害（疲劳/注意/情绪/工作能力下降）
        - 每周 ≥ 3 次 + 持续 ≥ 3 月
      assessment_tools:
        - PSQI 匹茨堡睡眠质量指数
        - ISI 失眠严重程度指数
        - 睡眠日记（1-2 周）
        - 必要时多导睡眠图（PSG）

  - id: psych-insomnia-cbti
    description: CBT-I 失眠认知行为治疗（一线）
    condition:
      field: diagnosis
      operator: contains
      value: 失眠
    result:
      treatment: CBT-I（失眠认知行为治疗）
      components:
        - 睡眠限制：限制卧床时间 = 平均睡眠时间（≥ 5h）
        - 刺激控制：床 = 睡眠 + 性行为；不在床上清醒 > 20min → 离开
        - 认知重构：纠正"必须睡 8h"等灾难化认知
        - 放松训练：渐进性肌肉放松 / 腹式呼吸 / 正念
        - 睡眠卫生教育：固定作息 / 避免咖啡因/酒精/尼古丁 / 环境优化
      efficacy: 一线推荐（≥ BZDs + Z-drugs）；起效慢（2-4 周）但效果持久
      followup: 4 周评估 → 8 周巩固

  - id: psych-insomnia-pharmacotherapy
    description: 失眠药物治疗 — CBT-I 无效时
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 失眠
        - field: cbti_ineffective
          operator: equals
          value: true
    result:
      treatment: 失眠药物治疗
      medication_options:
        - class: Z-drugs
          examples: 唑吡坦 5-10mg / 右佐匹克隆 1-3mg
          use: 入睡困难（短期 ≤ 4 周）
          risk: 耐受/依赖/跌倒
        - class: 褪黑素受体激动剂
          examples: 雷美替胺 8mg
          use: 入睡困难（老年首选）
          risk: 低
        - class: Orexin 拮抗剂
          examples: 苏沃雷生 / 达利雷生
          use: 睡眠维持困难
          risk: 次日嗜睡
        - class: 镇静抗抑郁药
          examples: 曲唑酮 25-150mg / 多塞平 3-6mg / 米氮平 7.5-15mg
          use: 共病抑郁/焦虑
          risk: 口干/体重增加
      principles:
        - 最低有效剂量 + 间断给药（每周 2-4 次）
        - ≤ 4 周后停药评估
        - 老年：首选非药物 / 褪黑素 / 小剂量多塞平
        - 避免苯二氮卓类（BZDs）长期使用

  - id: psych-bipolar-manic
    description: 双相躁狂发作管理
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 双相
        - field: episode_type
          operator: equals
          value: manic
    result:
      treatment: 躁狂发作管理
      first_line:
        - 心境稳定剂：锂盐（血药浓度 0.6-1.2mmol/L）+ 丙戊酸钠
        - 非典型抗精神病药：奥氮平 / 利培酮 / 阿立哌唑 / 喹硫平
        - 联合治疗：心境稳定剂 + 抗精神病药（严重躁狂）
      monitoring:
        - 锂盐：Li+ 浓度 + TSH + Cr + Ca²⁺
        - 丙戊酸钠：VPA 浓度 + LFT + CBC + 氨
      precautions: 抗抑郁药避免单用（可诱发转躁）

  - id: psych-bipolar-depressed
    description: 双相抑郁发作管理
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 双相
        - field: episode_type
          operator: equals
          value: depressed
    result:
      treatment: 双相抑郁管理
      first_line:
        - 喹硫平（唯一 FDA 批准所有双相阶段）
        - 鲁拉西酮
        - 拉莫三嗪（预防抑郁复发）
        - 奥氮平-氟西汀合剂
      alternative: 锂盐 + 拉莫三嗪
      caution: 单用抗抑郁药可诱发转躁/快速循环 — 必须与心境稳定剂联用

  - id: psych-mood-stabilizer
    description: 心境稳定剂监测要求
    condition:
      field: medication_list
      operator: contains_any
      value: [锂盐, 丙戊酸钠, 卡马西平]
    result:
      monitoring: 心境稳定剂安全监测
      protocols:
        - drug: 锂盐
          baseline: "TSH/Cr/eGFR/Ca²⁺/ECG/β-HCG"
          during: "Li+浓度（稳定期 3-6 月/次）+ TSH/Cr q6mo"
          target_trough: "0.6-1.2mmol/L（维持）"
        - drug: 丙戊酸钠
          baseline: "LFT/CBC/凝血/β-HCG"
          during: "VPA 浓度（50-125μg/mL）+ LFT/CBC q3-6mo"
        - drug: 卡马西平
          baseline: "LFT/CBC/Na⁺/HLA-B*1502（亚裔必测）"
          during: "CBZ 浓度 + LFT/CBC/Na⁺ q3mo"

  - id: psych-ptsd-screening
    description: PTSD 创伤后应激障碍筛查
    condition:
      and:
        - field: trauma_history
          operator: equals
          value: true
        - field: symptoms
          operator: contains_any
          value: [闪回, 噩梦, 回避, 警觉增高]
    result:
      diagnosis: 疑似 PTSD
      assessment: PCL-5（DSM-5 创伤后应激障碍检查表）
      severity:
        - PCL-5 < 33: 亚临床
        - PCL-5 ≥ 33: 临床 PTSD
      recommendation: 精神科专科评估 + 创伤聚焦心理治疗（TF-CBT/EMDR）

  - id: psych-ptsd-psychotherapy
    description: PTSD 心理治疗
    condition:
      field: diagnosis
      operator: contains
      value: PTSD
    result:
      treatment: 创伤聚焦心理治疗（一线）
      modalities:
        - TF-CBT 创伤聚焦认知行为治疗：12-16 次 / 每周
        - EMDR 眼动脱敏与再加工治疗：8-12 次
        - PE 延长暴露治疗：8-15 次
      preferred_over: 药物单用（心理治疗效果更持久）

  - id: psych-ptsd-pharmacotherapy
    description: PTSD 药物治疗 — 心理治疗不可及或无效
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: PTSD
        - field: psychotherapy_ineffective
          operator: equals
          value: true
    result:
      treatment: PTSD 药物治疗
      first_line:
        - 舍曲林 50-200mg/d（FDA 批准）
        - 帕罗西汀 20-60mg/d（FDA 批准）
        - 氟西汀
        - 文拉法辛 ER 75-300mg/d
      adjunct:
        - 哌唑嗪 2-15mg qHS（噩梦）
        - 曲唑酮 qHS（失眠）
      duration: 至少 6-12 月

---
rule_type: followup
department: 精神心理科
capability: cap-l3-psychiatry-followup
business_process: bp-psychiatry-followup
data_entities:
  consumes:
    - de-treatment-plan
    - de-diagnosis-result
    - de-patient
  produces:
    - de-followup-plan
stakeholder: 制定精神病患者出院随访与社区康复计划
version: "1.0.0"

rules:
  - id: psych-depression-followup
    description: 抑郁症治疗期随访计划
    condition:
      field: diagnosis
      operator: contains
      value: 抑郁
    result:
      followup_schedule:
        - phase: 急性期（0-12 周）
          frequency: 每 1-2 周
          items: PHQ-9/副作用/自杀风险/依从性
        - phase: 巩固期（4-9 月）
          frequency: 每 4-8 周
          items: PHQ-9/功能恢复/副作用/剂量优化
        - phase: 维持期（≥ 1 年）
          frequency: 每 3 月
          items: 全面评估/预防复发/停药评估
      red_flags:
        - PHQ-9 不降反升 > 2 周
        - 新发自杀意念
        - 严重副作用（5-HT 综合征/出血/QTc 延长）
        - 自行停药 > 3 天

  - id: psych-schizophrenia-metabolic
    description: 抗精神病药代谢监测
    condition:
      field: medication_list
      operator: contains_any
      value: [奥氮平, 氯氮平, 喹硫平, 利培酮]
    result:
      monitoring: 代谢综合征监测
      schedule:
        - baseline: FBG + HbA1c + Lipid + 体重/BMI/腰围 + BP
        - week_4: 体重/BMI/腰围
        - week_8: 体重/BMI/腰围 + FBG + Lipid
        - month_3: 全面复查
        - annually: 全面复查（含 HbA1c）
      intervention_triggers:
        - 体重增加 ≥ 5% → 饮食运动干预 + 考虑换药
        - FBG ≥ 5.6 → OGTT + 生活方式
        - LDL 升高 → 他汀
