# 中医科临床规则 — 八纲辨证 + 脏腑辨证 + 针灸选穴 + 十八反十九畏 + 体质分类
rule_type: diagnosis
department: 中医科
capability: cap-l3-tcm-diagnosis
business_process: bp-tcm-diagnosis
data_entities:
  consumes:
    - de-patient
    - de-tcm-four-exam
    - de-tongue-pulse
    - de-tcm-constitution
  produces:
    - de-diagnosis-result
guideline: 国家中医药临床诊疗指南（2022）
stakeholder: 中医医师通过望闻问切四诊合参进行辨证分型与体质判定
version: "1.0.0"

rules:
  - id: tcm-bagang-yinyang
    description: 八纲辨证 — 阴阳总纲
    condition:
      field: tcm.bagang
      operator: equals
      value: general
    result:
      assessment: 阴证与阳证鉴别
      yang_syndrome:
        - 面色红赤、发热、烦躁、口渴喜冷饮
        - 舌红苔黄、脉数有力
        - 病性：热、实、表
      yin_syndrome:
        - 面色苍白或晦暗、畏寒、萎靡、口淡不渴
        - 舌淡苔白、脉沉迟无力
        - 病性：寒、虚、里
      yin_yang_transition_red_flags:
        - 阳证转阴：高热突降 + 四肢厥冷 + 脉微欲绝 → 亡阳危候
        - 阴证转阳：畏寒肢冷后发热汗出 + 脉浮 → 邪正交争

  - id: tcm-bagang-biaoli
    description: 八纲辨证 — 表里辨证
    condition:
      field: tcm.bagang
      operator: equals
      value: biaoli
    result:
      assessment: 表证与里证
      exterior:
        - 病位浅（皮毛/经络/上呼吸道）
        - 恶寒/发热并见、头身痛、鼻塞流涕
        - 脉浮、苔薄白或薄黄
        - 病程短（数小时至数天）
        - 治疗原则：解表 — 辛温（风寒）/ 辛凉（风热）
      interior:
        - 病位深（脏腑/气血/骨髓）
        - 但热不寒或但寒不热、脏腑功能失调表现
        - 脉沉、苔厚
        - 治疗原则：调和脏腑、攻补兼施
      half_exterior_half_interior:
        - 少阳证：寒热往来、胸胁苦满、口苦咽干、脉弦

  - id: tcm-bagang-hanre
    description: 八纲辨证 — 寒热辨证
    condition:
      field: tcm.bagang
      operator: equals
      value: hanre
    result:
      assessment: 寒证与热证
      cold:
        - 恶寒喜暖、肢冷蜷卧、口不渴、分泌物清稀
        - 舌淡苔白润、脉迟或紧
        - 属实：寒邪直中（脉紧、苔白）→ 温里散寒
        - 属虚：阳虚生寒（脉微、畏寒）→ 温补阳气
      heat:
        - 发热恶热、口渴喜冷、面红、分泌物黄稠
        - 舌红苔黄燥、脉数
        - 属实：火热炽盛（壮热、便秘）→ 清热泻火
        - 属虚：阴虚生热（潮热、盗汗）→ 滋阴降火
      mixed_cold_heat:
        - 上热下寒 / 寒热错杂 → 寒温并用

  - id: tcm-bagang-xushi
    description: 八纲辨证 — 虚实辨证
    condition:
      field: tcm.bagang
      operator: equals
      value: xushi
    result:
      assessment: 虚证与实证
      deficiency:
        - 病程长、起病缓、精神萎靡、声低息微
        - 舌淡胖嫩有齿痕、脉虚无力
        - 四类虚证：气虚（乏力+气短）、血虚（面白+心悸）、阴虚（潮热+盗汗+舌红少苔）、阳虚（畏寒+肢冷+脉微）
      excess:
        - 病程短、起病急、声高气粗、烦躁
        - 舌苔厚腻、脉实有力
        - 六淫外邪 / 痰饮 / 水湿 / 瘀血 / 食积 / 气滞
      deficiency_excess_complex:
        - 真实假虚（大实有羸状—承气汤证身寒肢冷）
        - 真虚假实（至虚有盛候—脾气虚腹胀）
        - 虚实夹杂（攻补兼施）

  - id: tcm-zangfu-heart
    description: 脏腑辨证 — 心系病证
    condition:
      field: tcm.zangfu
      operator: equals
      value: heart
    result:
      assessment: 心系病证
      syndromes:
        - pattern: 心气虚
          key: 心悸+气短+自汗+脉弱
          treatment: 养心汤 / 炙甘草汤
        - pattern: 心血虚
          key: 心悸+健忘+失眠+面白+脉细
          treatment: 归脾汤
        - pattern: 心阴虚
          key: 心悸+心烦+失眠+盗汗+舌红少苔
          treatment: 天王补心丹
        - pattern: 心阳虚
          key: 心悸+畏寒肢冷+面浮+脉沉迟
          treatment: 桂枝甘草龙骨牡蛎汤
        - pattern: 心火亢盛
          key: 心烦+口舌生疮+尿赤+舌尖红
          treatment: 导赤散 / 黄连解毒汤
        - pattern: 心脉痹阻
          key: 胸闷痛+痛引肩背+唇舌紫暗+脉涩
          treatment: 血府逐瘀汤

  - id: tcm-zangfu-liver
    description: 脏腑辨证 — 肝系病证
    condition:
      field: tcm.zangfu
      operator: equals
      value: liver
    result:
      assessment: 肝系病证
      syndromes:
        - pattern: 肝气郁结
          key: 胁肋胀痛+善太息+脉弦
          treatment: 柴胡疏肝散
        - pattern: 肝火上炎
          key: 头痛目赤+口苦+急躁易怒+舌红苔黄脉弦数
          treatment: 龙胆泻肝汤
        - pattern: 肝阳上亢
          key: 眩晕耳鸣+头胀痛+腰膝酸软+脉弦细数
          treatment: 天麻钩藤饮
        - pattern: 肝血虚
          key: 头晕眼花+视力减退+肢麻+爪甲不荣
          treatment: 四物汤 / 补肝汤
        - pattern: 肝阴虚
          key: 头晕+目涩+胁隐痛+舌红少津
          treatment: 一贯煎
        - pattern: 肝风内动
          key: 眩晕欲仆+肢麻震颤+舌强语謇
          treatment: 镇肝熄风汤

  - id: tcm-zangfu-spleen
    description: 脏腑辨证 — 脾系病证
    condition:
      field: tcm.zangfu
      operator: equals
      value: spleen
    result:
      assessment: 脾系病证
      syndromes:
        - pattern: 脾气虚
          key: 食少+腹胀+便溏+乏力+舌淡
          treatment: 四君子汤
        - pattern: 脾阳虚
          key: 腹胀+冷痛+下利清谷+形寒
          treatment: 理中丸
        - pattern: 脾气下陷
          key: 脘腹坠胀+久泻脱肛+内脏下垂
          treatment: 补中益气汤
        - pattern: 脾不统血
          key: 便血/崩漏+面色萎黄+舌淡
          treatment: 归脾汤
        - pattern: 寒湿困脾
          key: 脘痞+头身困重+苔白腻
          treatment: 藿香正气散 / 平胃散
        - pattern: 湿热蕴脾
          key: 脘痞+口苦+身黄+苔黄腻
          treatment: 茵陈蒿汤

  - id: tcm-zangfu-lung
    description: 脏腑辨证 — 肺系病证
    condition:
      field: tcm.zangfu
      operator: equals
      value: lung
    result:
      assessment: 肺系病证
      syndromes:
        - pattern: 肺气虚
          key: 咳喘无力+气短+自汗+易感冒
          treatment: 玉屏风散 / 补肺汤
        - pattern: 肺阴虚
          key: 干咳少痰+潮热盗汗+舌红少苔
          treatment: 百合固金汤
        - pattern: 风寒束肺
          key: 咳嗽+痰白稀+恶寒发热+脉浮紧
          treatment: 麻黄汤 / 三拗汤
        - pattern: 风热犯肺
          key: 咳嗽+痰黄稠+咽痛+脉浮数
          treatment: 银翘散 / 桑菊饮
        - pattern: 痰热壅肺
          key: 咳喘+痰黄黏+胸痛+舌红苔黄腻
          treatment: 清气化痰丸
        - pattern: 痰湿阻肺
          key: 咳喘+痰多白黏+胸闷+苔白腻
          treatment: 二陈汤 / 三子养亲汤

  - id: tcm-zangfu-kidney
    description: 脏腑辨证 — 肾系病证
    condition:
      field: tcm.zangfu
      operator: equals
      value: kidney
    result:
      assessment: 肾系病证
      syndromes:
        - pattern: 肾阳虚
          key: 腰膝冷痛+畏寒肢冷+阳痿/宫寒+夜尿多+脉沉弱
          treatment: 金匮肾气丸 / 右归丸
        - pattern: 肾阴虚
          key: 腰膝酸软+头晕耳鸣+五心烦热+舌红少苔
          treatment: 六味地黄丸 / 左归丸
        - pattern: 肾精不足
          key: 发育迟缓/早衰+齿摇发脱+健忘
          treatment: 河车大造丸
        - pattern: 肾气不固
          key: 滑精早泄+尿频遗尿+白带清稀
          treatment: 金锁固精丸 / 缩泉丸
        - pattern: 肾不纳气
          key: 咳喘+呼多吸少+动则喘甚+腰膝酸软
          treatment: 人参蛤蚧散 / 七味都气丸
        - pattern: 膀胱湿热
          key: 尿频急痛+尿黄赤+舌红苔黄腻
          treatment: 八正散

  - id: tcm-common-cold
    description: 常见病 — 感冒辨证论治
    condition:
      field: diagnosis
      operator: contains
      value: 感冒
    result:
      treatment: 感冒中医分型论治
      patterns:
        - pattern: 风寒感冒
          key: 恶寒重发热轻+无汗+鼻塞清涕+苔薄白脉浮紧
          formula: 荆防败毒散
          patent_medicine: 感冒清热颗粒
        - pattern: 风热感冒
          key: 发热重恶寒轻+咽痛+涕黄+苔薄黄脉浮数
          formula: 银翘散
          patent_medicine: 银翘解毒片 / 双黄连口服液
        - pattern: 暑湿感冒
          key: 发热+头身困重+胸闷脘痞+苔黄腻脉濡数
          formula: 新加香薷饮
          patent_medicine: 藿香正气水
        - pattern: 气虚感冒
          key: 反复感冒+气短乏力+恶风自汗
          formula: 参苏饮
          patent_medicine: 玉屏风颗粒（预防）

  - id: tcm-common-insomnia
    description: 常见病 — 不寐（失眠）辨证论治
    condition:
      field: diagnosis
      operator: contains
      value: 失眠
    result:
      treatment: 不寐中医分型论治
      patterns:
        - pattern: 肝火扰心
          key: 失眠多梦+急躁易怒+口苦+脉弦数
          formula: 龙胆泻肝汤
          patent_medicine: 龙胆泻肝丸
        - pattern: 痰热扰心
          key: 心烦不寐+胸闷脘痞+苔黄腻
          formula: 黄连温胆汤
          patent_medicine: 安神温胆丸
        - pattern: 心脾两虚
          key: 多梦易醒+心悸健忘+食少乏力+舌淡
          formula: 归脾汤
          patent_medicine: 归脾丸
        - pattern: 心肾不交
          key: 心烦不寐+腰膝酸软+盗汗+舌红少苔
          formula: 六味地黄丸合交泰丸
          patent_medicine: 天王补心丹
        - pattern: 心胆气虚
          key: 虚烦不寐+易惊+气短自汗
          formula: 安神定志丸
          patent_medicine: 安神补脑液

  - id: tcm-common-constipation
    description: 常见病 — 便秘辨证论治
    condition:
      field: diagnosis
      operator: contains
      value: 便秘
    result:
      treatment: 便秘中医分型论治
      patterns:
        - pattern: 热秘（肠胃积热）
          key: 大便干结+腹胀痛+口臭+苔黄燥
          formula: 麻子仁丸
        - pattern: 气秘（气机郁滞）
          key: 欲便不得+嗳气+胁痞+脉弦
          formula: 六磨汤
        - pattern: 冷秘（阴寒凝滞）
          key: 大便艰涩+腹冷痛+苔白脉沉迟
          formula: 大黄附子汤 / 温脾汤
        - pattern: 气虚秘
          key: 努挣乏力+气短+便后疲乏
          formula: 黄芪汤
        - pattern: 血虚秘
          key: 大便干结+面白心悸+舌淡脉细
          formula: 润肠丸
        - pattern: 阴虚秘
          key: 大便干如羊粪+口干+舌红少苔
          formula: 增液汤
        - pattern: 阳虚秘
          key: 大便艰涩+小便清长+畏寒+脉沉迟
          formula: 济川煎

  - id: tcm-common-headache
    description: 常见病 — 头痛辨证论治
    condition:
      field: diagnosis
      operator: contains
      value: 头痛
    result:
      treatment: 头痛中医分型论治
      patterns:
        - pattern: 风寒头痛
          key: 头痛连项+恶风畏寒+苔薄白
          formula: 川芎茶调散
        - pattern: 风热头痛
          key: 头胀痛+发热咽痛+苔薄黄
          formula: 芎芷石膏汤
        - pattern: 肝阳头痛
          key: 头胀痛/跳痛+眩晕+烦躁易怒+脉弦
          formula: 天麻钩藤饮
        - pattern: 痰浊头痛
          key: 头重痛+昏蒙+呕吐痰涎+苔白腻
          formula: 半夏白术天麻汤
        - pattern: 瘀血头痛
          key: 头痛如刺+固定不移+舌紫暗
          formula: 通窍活血汤
        - pattern: 血虚头痛
          key: 头痛隐隐+空痛+劳累加重+心悸
          formula: 加味四物汤

  - id: tcm-acu-point-selection
    description: 针灸选穴原则
    condition:
      field: treatment_modality
      operator: equals
      value: acupuncture
    result:
      treatment: 针灸选穴核心原则
      principles:
        - 近部选穴：病变局部或临近取穴（膝痛取犊鼻/阳陵泉）
        - 远部选穴：循经远端取穴（头项痛取列缺、面口痛取合谷）
        - 辨证选穴：据辨证分型选取相应穴位
        - 对症选穴：经验效穴（发热取大椎、昏厥取人中）
      common_empirical_points:
        - 四总穴：肚腹三里留（足三里）+ 腰背委中求（委中）+ 头项寻列缺 + 面口合谷收
        - 八脉交会穴：内关-公孙（心胸胃）+ 列缺-照海（肺喉胸膈）+ 后溪-申脉（颈肩腰）+ 外关-足临泣（耳目肩）
      needling_principles:
        - 虚则补之（弱刺激/温灸）、实则泻之（强刺激/刺络）
        - 热则疾之（浅刺速出）、寒则留之（深刺久留）
        - 陷下则灸之（气虚下陷）

  - id: tcm-acu-headache
    description: 针灸 — 头痛选穴方案
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 头痛
        - field: treatment_modality
          operator: equals
          value: acupuncture
    result:
      treatment: 头痛针灸配穴
      points:
        - 主穴：百会/太阳/风池/合谷
        - 阳明经（前额）：头维/印堂/内庭
        - 少阳经（侧头）：率谷/外关/足临泣
        - 太阳经（后枕）：天柱/后溪/申脉
        - 厥阴经（巅顶）：四神聪/太冲/涌泉
        - 加减：外感 + 风门/列缺；肝阳 + 太冲/行间；瘀血 + 血海/膈俞；痰浊 + 丰隆/中脘

  - id: tcm-acu-lumbago
    description: 针灸 — 腰痛选穴方案
    condition:
      and:
        - field: symptoms
          operator: contains
          value: 腰痛
        - field: treatment_modality
          operator: equals
          value: acupuncture
    result:
      treatment: 腰痛针灸配穴
      points:
        - 主穴：肾俞/大肠俞/委中/阿是穴
        - 辨证加减：
          - 寒湿腰痛：腰阳关（温灸）
          - 劳损腰痛：膈俞/三阴交（活血化瘀）
          - 肾虚腰痛：命门/志室（温补肾阳）
          - 腰椎间盘突出：环跳/阳陵泉/昆仑（沿坐骨神经放射）
      technique:
        - 寒湿/肾虚：温针灸/艾灸
        - 慢性劳损：电针（疏密波 30min）
        - 急性扭伤：刺络拔罐 + 委中放血

  - id: tcm-acu-insomnia
    description: 针灸 — 不寐（失眠）选穴方案
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 失眠
        - field: treatment_modality
          operator: equals
          value: acupuncture
    result:
      treatment: 不寐针灸配穴
      points:
        - 主穴：神门/内关/百会/安眠（经外奇穴）
        - 辨证加减：
          - 肝火扰心：太冲/行间/侠溪（泻法）
          - 痰热扰心：丰隆/内庭/曲池
          - 心脾两虚：心俞/脾俞/足三里（补法+灸）
          - 心肾不交：太溪/涌泉/心俞
          - 心胆气虚：心俞/胆俞/大陵
      auricular_plaster: 神门/心/皮质下/交感（耳穴压豆）

  - id: tcm-acu-stroke
    description: 针灸 — 中风后遗症选穴方案
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 中风
        - field: treatment_modality
          operator: equals
          value: acupuncture
    result:
      treatment: 中风后遗症针灸方案
      points:
        - 半身不遂：
          - 上肢：肩髃/曲池/手三里/外关/合谷
          - 下肢：环跳/阳陵泉/足三里/解溪/昆仑
        - 口角歪斜：地仓/颊车/下关/合谷（对侧）
        - 言语不利：廉泉/通里/哑门
        - 吞咽困难：廉泉/风池/翳风
      technique:
        - 软瘫期（Brunnstrom Ⅰ-Ⅱ）：电针（连续波 20Hz）
        - 痉挛期（Brunnstrom Ⅲ-Ⅳ）：手法轻柔 + 透刺（屈-伸拮抗）
      timing: 生命体征稳定后尽早介入（通常发病 48-72h 后）

  - id: tcm-herb-18incompatible
    description: 十八反 — 配伍禁忌
    condition:
      field: safety_check
      operator: equals
      value: herb_compatibility
    result:
      assessment: 十八反核查
      incompatible_pairs:
        - "甘草反：甘遂、京大戟、海藻、芫花"
        - "乌头（川乌/草乌/附子）反：贝母、瓜蒌、半夏、白蔹、白及"
        - "藜芦反：人参、沙参、丹参、玄参、细辛、芍药"
      alert_action: "处方含十八反药对 → 停止调配 + 通知医师确认"
      exceptions: 部分古今名方含反药配伍（如海藻玉壶汤甘草配海藻）需医师确认后特殊煎煮

  - id: tcm-herb-19fear
    description: 十九畏 — 相畏禁忌
    condition:
      field: safety_check
      operator: equals
      value: herb_compatibility
    result:
      assessment: 十九畏核查
      incompatible_pairs:
        - "硫黄畏朴硝"
        - "水银畏砒霜"
        - "狼毒畏密陀僧"
        - "巴豆畏牵牛"
        - "丁香畏郁金"
        - "牙硝畏三棱"
        - "川乌/草乌畏犀角"
        - "人参畏五灵脂"
        - "官桂畏赤石脂"
      alert_action: "处方含十九畏药对 → 停止调配 + 药师审核"
      clinical_significance: 互减药效或增毒副作用 — 调配中须严格规避

  - id: tcm-herb-pregnancy-contra
    description: 妊娠用药禁忌
    condition:
      field: pregnancy
      operator: equals
      value: true
    result:
      assessment: 妊娠用药禁忌
      absolute_contra（禁用药）:
        - 峻下逐水：巴豆/牵牛子/大戟/芫花/甘遂/商陆
        - 破血逐瘀：三棱/莪术/水蛭/虻虫/土鳖虫
        - 辛香走窜：麝香/蟾酥
        - 有毒矿物：砒石/轻粉/雄黄
      cautious_use（慎用药）:
        - 活血化瘀：桃仁/红花/牛膝/川芎/姜黄
        - 泻下攻积：大黄/芒硝/番泻叶
        - 辛温大热：附子/肉桂/干姜
        - 行气破滞：枳实/厚朴/槟榔
      principle: "『有故无殒，亦无殒也』— 病情需要时可在严密监测下谨慎使用，中病即止"

  - id: tcm-herb-ddi
    description: 中西药相互作用警示
    condition:
      field: medication_list
      operator: intersects
      value: tcm
    result:
      assessment: 中西药相互作用
      high_risk_interactions:
        - herbs: 丹参/当归/银杏叶 → 西药（华法林/阿司匹林/氯吡格雷）
          effect: 增加出血风险
          action: PT/INR 监测 + 避免联用
        - herbs: 甘草/甘遂 → 西药（利尿剂/糖皮质激素/地高辛）
          effect: 甘草致假性醛固酮增多症（低钾+高血压）
          action: 监测 K⁺ + BP
        - herbs: 麻黄/附子 → 西药（MAOIs/SSRIs/caffeine）
          effect: 5-HT 综合征/高血压危象
          action: 禁止联用
        - herbs: 五味子/水飞蓟 → 西药（经 CYP3A4 代谢药物）
          effect: 改变药物代谢
          action: 监测血药浓度 + 剂量调整
        - herbs: 大黄/番泻叶 → 西药（华法林/口服避孕药）
          effect: 肠道蠕动加速—降低吸收
      general_principle: 中西药间隔 ≥ 1-2h 服用作为最低安全措施

  - id: tcm-constitution-neutral
    description: 体质分类 — 平和质（健康型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 平和质
    result:
      constitution: 平和质
      features:
        - 体形匀称健壮、面色润泽
        - 精力充沛、睡眠良好
        - 二便正常、舌淡红苔薄白
        - 适应能力强、较少患病
      prevalence: ~32.75%（一般人群）
      health_guidance:
        - 饮食有节（均衡营养）
        - 规律运动（每周 ≥ 3 次）
        - 充足睡眠
        - 保持心态平和

  - id: tcm-constitution-qi-deficiency
    description: 体质分类 — 气虚质（气短型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 气虚质
    result:
      constitution: 气虚质
      features:
        - 肌肉松软、语音低弱、气短懒言
        - 易疲乏、自汗、活动后加重
        - 舌淡红有齿痕、脉弱
        - 不耐受风/寒/暑邪、易感冒
      dietary: 益气健脾 — 小米/山药/大枣/鸡肉/黄芪蒸鸡
      exercise: 柔和运动（太极拳/八段锦/散步）— 避免大运动量
      acupoints: 足三里/气海/关元（艾灸）

  - id: tcm-constitution-yang-deficiency
    description: 体质分类 — 阳虚质（怕冷型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 阳虚质
    result:
      constitution: 阳虚质
      features:
        - 形体白胖、肌肉松软
        - 畏寒肢冷、喜热饮食、精神不振
        - 舌淡胖嫩有齿痕、脉沉迟
        - 耐夏不耐冬、易感寒邪
      dietary: 温阳益气 — 羊肉/韭菜/核桃/生姜/当归生姜羊肉汤
      exercise: 舒缓运动 + 晨间阳光下锻炼
      acupoints: 命门/肾俞/关元（艾灸温补）
      avoid: 生冷/寒凉食物

  - id: tcm-constitution-yin-deficiency
    description: 体质分类 — 阴虚质（缺水型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 阴虚质
    result:
      constitution: 阴虚质
      features:
        - 体形偏瘦、手足心热、口干咽燥
        - 鼻微干、喜冷饮、大便干燥
        - 舌红少津少苔、脉细数
        - 耐冬不耐夏、不耐暑热燥邪
      dietary: 滋阴清热 — 百合/银耳/梨/鸭肉/沙参麦冬汤
      exercise: 中小强度（游泳/太极拳）— 避免大量出汗
      acupoints: 太溪/三阴交/涌泉
      avoid: 辛温燥烈（羊肉/韭菜/辣椒/葱姜蒜大量）

  - id: tcm-constitution-phlegm-dampness
    description: 体质分类 — 痰湿质（肥胖型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 痰湿质
    result:
      constitution: 痰湿质
      features:
        - 形体肥胖（中心性）、腹部肥满松软
        - 面部油光、汗黏、胸闷痰多、口黏腻
        - 舌苔白腻、脉滑
        - 不耐梅雨季/潮湿环境
      dietary: 健脾利湿 — 薏苡仁/冬瓜/赤小豆/白扁豆/陈皮薏仁粥
      exercise: 持续有氧（快走/慢跑/游泳 40-60min/次）
      acupoints: 丰隆/阴陵泉/足三里
      avoid: 肥甘厚腻/甜食

  - id: tcm-constitution-damp-heat
    description: 体质分类 — 湿热质（长痘型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 湿热质
    result:
      constitution: 湿热质
      features:
        - 面垢油光、易生痤疮粉刺、口苦口干
        - 身重困倦、大便黏滞/小便短黄
        - 男性阴囊潮湿、女性带下黄
        - 舌红苔黄腻、脉滑数
      dietary: 清热利湿 — 绿豆/苦瓜/黄瓜/薏苡仁/莲子心
      exercise: 大运动量（跑步/球类/游泳）
      acupoints: 曲池/合谷/阴陵泉
      avoid: 辛辣油腻/烧烤/酒类

  - id: tcm-constitution-blood-stasis
    description: 体质分类 — 血瘀质（长斑型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 血瘀质
    result:
      constitution: 血瘀质
      features:
        - 肤色晦暗、皮肤瘀斑、色素沉着（黄褐斑）
        - 唇色紫暗、舌下络脉紫暗增粗、脉涩
        - 健忘、不耐风邪寒邪
      dietary: 活血化瘀 — 山楂/黑豆/醋/黄酒（少量）/玫瑰花茶
      exercise: 促进气血运行（各类运动均可）
      acupoints: 血海/膈俞/三阴交
      avoid: 肥甘厚腻/寒凉收涩

  - id: tcm-constitution-qi-stagnation
    description: 体质分类 — 气郁质（郁闷型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 气郁质
    result:
      constitution: 气郁质
      features:
        - 神情抑郁、情感脆弱、烦闷不乐
        - 胸胁胀满、善太息、嗳气
        - 舌淡红苔薄白、脉弦
        - 不耐阴雨天
      dietary: 理气解郁 — 佛手/陈皮/玫瑰花/小麦/茉莉花茶
      exercise: 群体运动（球类/舞蹈）+ 户外活动
      acupoints: 太冲/合谷/期门/肝俞
      psychological: 正念/冥想 + 社交参与

  - id: tcm-constitution-intrinsic
    description: 体质分类 — 特禀质（过敏型）
    condition:
      field: tcm.constitution_type
      operator: equals
      value: 特禀质
    result:
      constitution: 特禀质（过敏/先天/遗传体质）
      features:
        - 过敏体质（哮喘/荨麻疹/过敏性鼻炎/药物过敏）
        - 先天遗传病倾向
        - 对外界适应力差、季节交替易发作
      dietary: 益气固表 — 黄芪/山药/白芷/糯米
      exercise: 增强体质（太极拳/慢跑）
      acupoints: 足三里/肺俞/大椎
      avoid: 已知过敏原/异体蛋白/发物
      treatment: 玉屏风散加减（预防复发作）

---
rule_type: treatment
department: 中医科
capability: cap-l3-tcm-treatment
business_process: bp-tcm-treatment
data_entities:
  consumes:
    - de-diagnosis-result
    - de-tcm-constitution
  produces:
    - de-treatment-plan
guideline: 国家中医药临床诊疗指南（2022）
stakeholder: 根据辨证结果选用经典方剂、中成药或针灸推拿
version: "1.0.0"

rules:
  - id: tcm-liuwei-kidney-yin
    description: 六味地黄丸 — 肾阴虚经典方
    condition:
      field: tcm.syndrome
      operator: contains
      value: 肾阴虚
    result:
      treatment: 六味地黄丸
      composition:
        - 熟地黄 24g（君）
        - 山茱萸 12g（臣）、山药 12g（臣）
        - 泽泻 9g（佐）、牡丹皮 9g（佐）、茯苓 9g（佐）
      usage: 滋阴补肾 — 三补三泻、补而不滞
      contraindications: 脾虚便溏者慎用

  - id: tcm-buzhong-qi
    description: 补中益气汤 — 气虚下陷
    condition:
      field: tcm.syndrome
      operator: contains
      value: 气虚
    result:
      treatment: 补中益气汤
      composition:
        - 黄芪 18g（君）、党参 9g（臣）、白术 9g（臣）
        - 炙甘草 9g（佐）、当归 3g（佐）、陈皮 6g（佐）
        - 升麻 6g（使）、柴胡 6g（使）
      usage: 补中益气、升阳举陷 — 主治脾胃气虚、中气下陷

  - id: tcm-xuefu-blood-stasis
    description: 血府逐瘀汤 — 瘀血内阻
    condition:
      field: tcm.syndrome
      operator: contains
      value: 血瘀
    result:
      treatment: 血府逐瘀汤
      composition:
        - 桃仁 12g（君）、红花 9g（臣）
        - 当归 9g、生地黄 9g、牛膝 9g、川芎 5g
        - 桔梗 5g、赤芍 6g、枳壳 6g、柴胡 3g、甘草 6g
      usage: 活血化瘀、行气止痛 — 胸中血瘀证
      modern_use: 冠心病、心绞痛、脑外伤后遗症

  - id: tcm-shuyu-wind-damp
    description: 独活寄生汤 — 风寒湿痹
    condition:
      field: tcm.syndrome
      operator: contains
      value: 痹证
    result:
      treatment: 独活寄生汤
      composition:
        - 独活（君）、桑寄生、杜仲、牛膝
        - 细辛、秦艽、防风、肉桂
        - 人参、茯苓、甘草、当归、川芎、芍药、干地黄
      usage: 祛风湿、止痹痛、益肝肾、补气血
      indication: 久痹肝肾两虚、气血不足（腰膝冷痛、屈伸不利）
