# 肾内科临床规则 — CKD诊断 + 延缓进展 + 并发症管理
rule_type: diagnosis
department: 肾内科
capability: cap-l3-nephro-ckd-diagnosis
business_process: bp-nephrology-diagnosis
data_entities:
  consumes:
  - de-lab-renal
  - de-lab-urine
  - de-patient
  produces:
  - de-diagnosis-result
guideline: KDIGO CKD 2024
stakeholder: CKD诊断与CGA分期
version: "1.0.0"

rules:
  - id: ckd-diagnose
    description: eGFR < 60 或 肾损伤标志 ≥3月 → CKD
    condition:
      or:
        - field: lab_results.eGFR; operator: "<"; value: 60
        - and:
          - field: lab_results.UACR; operator: ">="; value: 30
          - field: lab_results.duration; operator: ">="; value: 3
    result:
      diagnosis: 慢性肾脏病
      staging: CGA分期（病因-GFR-白蛋白尿）

  - id: ckd-gfr-stage
    description: CKD GFR分期
    condition:
      field: diagnosis; operator: contains; value: CKD
    result:
      staging:
        - stage: G1; criteria: "eGFR ≥90 + 肾损伤证据"
        - stage: G2; criteria: "eGFR 60-89 + 肾损伤证据"
        - stage: G3a; criteria: "eGFR 45-59"
        - stage: G3b; criteria: "eGFR 30-44"
        - stage: G4; criteria: "eGFR 15-29"
        - stage: G5; criteria: "eGFR <15 或 透析"

  - id: ckd-albuminuria
    description: CKD白蛋白尿分期
    condition:
      field: diagnosis; operator: contains; value: CKD
    result:
      staging:
        - stage: A1; criteria: "UACR <30 mg/g"
        - stage: A2; criteria: "UACR 30-300 mg/g"
        - stage: A3; criteria: "UACR >300 mg/g"

---
rule_type: treatment
department: 肾内科
capability: cap-l3-nephro-treatment
business_process: bp-nephrology-treatment
data_entities:
  consumes:
  - de-diagnosis-result
  produces:
  - de-treatment-plan
guideline: KDIGO CKD 2024
stakeholder: 延缓肾功能进展
version: "1.0.0"

rules:
  - id: ckd-raasi
    description: RAAS抑制剂用于蛋白尿性CKD
    condition:
      and:
        - field: diagnosis; operator: contains; value: CKD
        - field: lab_results.UACR; operator: ">="; value: 30
    result:
      treatment: ACEI/ARB
      medications:
        - ACEI (培哚普利/贝那普利)
        - ARB (缬沙坦/厄贝沙坦)
      target: "UACR降低 ≥30%"

  - id: ckd-sglt2i
    description: SGLT2i用于CKD
    condition:
      and:
        - field: diagnosis; operator: contains; value: CKD
        - field: lab_results.eGFR; operator: ">="; value: 20
    result:
      treatment: SGLT2i
      medications:
        - 达格列净 10mg qd
        - 恩格列净 10mg qd
      benefit: 延缓eGFR下降 + 降低心血管事件

  - id: ckd-bp-target
    description: CKD降压目标
    condition:
      field: diagnosis; operator: contains; value: CKD
    result:
      target_bp: "<120 mmHg (SBP, 标准化测量)"
      medications_first_line:
        - ACEI/ARB 首选（蛋白尿者）
        - CCB
        - 利尿剂（容量负荷者）

  - id: ckd-anemia
    description: 肾性贫血管理
    condition:
      and:
        - field: diagnosis; operator: contains; value: CKD
        - field: lab_results.Hb; operator: "<"; value: 110
    result:
      target_hb: "100-115 g/L (ESA治疗); 110-120 g/L (HIF-PHI)"
      treatment:
        - 铁剂 (转铁蛋白饱和度<30% 或 铁蛋白<500)
        - ESA (促红细胞生成素)
        - HIF-PHI (罗沙司他)

  - id: ckd-mbd
    description: CKD矿物质骨异常
    condition:
      and:
        - field: diagnosis; operator: contains; value: CKD
        - field: lab_results.eGFR; operator: "<"; value: 45
    result:
      monitoring:
        - "血钙/磷/PTH: G3a起每6-12月; G4起每3-6月; G5每1-3月"
      treatment:
        - 限制磷摄入 (<800-1000mg/天)
        - 磷结合剂 (血磷升高时)
        - 活性维生素D (PTH升高时)

---
rule_type: followup
department: 肾内科
capability: cap-l3-nephro-followup
business_process: bp-nephrology-followup
data_entities:
  consumes:
  - de-treatment-plan
  produces:
  - de-followup-plan
guideline: KDIGO CKD 2024
stakeholder: CKD长期随访与RRT准备
version: "1.0.0"

rules:
  - id: ckd-followup
    description: CKD分层随访
    condition:
      field: diagnosis; operator: contains; value: CKD
    result:
      followup_schedule:
        - stage: G1-G2; frequency: 每年; items: "eGFR/UACR/BP"
        - stage: G3a-G3b; frequency: 每6月; items: "eGFR/UACR/BP/Ca/P/K"
        - stage: G4; frequency: 每3月; items: "eGFR/UACR/BP/Ca/P/K/Hb/HCO3"
        - stage: G5; frequency: 每1-2月; items: "全面评估 + RRT教育"
      red_flags:
        - eGFR下降>5 mL/min/年
        - 血钾>5.5 mmol/L
        - HCO3<18 mmol/L

  - id: ckd-rrt-referral
    description: 肾脏替代治疗转诊指征
    condition:
      and:
        - field: diagnosis; operator: contains; value: CKD
        - field: lab_results.eGFR; operator: "<"; value: 20
    result:
      recommendation: "转诊肾科评估RRT方案"
      timing: "eGFR 15-20 开始准备（造瘘/PD导管）；eGFR<10 启动透析"
      options:
        - 血液透析 (AVF优先)
        - 腹膜透析
        - 肾移植 (抢先移植优先)
