# 内分泌科临床规则 — 糖尿病诊断 + 治疗 + 并发症管理
rule_type: diagnosis
department: 内分泌科
capability: cap-l3-endo-dm-diagnosis
business_process: bp-endocrinology-diagnosis
data_entities:
  consumes:
  - de-lab-blood-glucose
  - de-lab-hba1c
  - de-patient
  produces:
  - de-diagnosis-result
guideline: 中国糖尿病防治指南（2024版）
stakeholder: 糖尿病筛查、诊断与分型
version: "1.0.0"

rules:
  - id: dm-diagnose-fpg
    description: 空腹血糖 ≥7.0 mmol/L → 糖尿病
    condition:
      field: lab_results.FPG
      operator: ">="
      value: 7.0
    result:
      diagnosis: 糖尿病
      criteria: 空腹血糖

  - id: dm-diagnose-ogtt
    description: OGTT 2h ≥11.1 mmol/L → 糖尿病
    condition:
      field: lab_results.OGTT_2h
      operator: ">="
      value: 11.1
    result:
      diagnosis: 糖尿病
      criteria: OGTT 2h 血糖

  - id: dm-diagnose-hba1c
    description: HbA1c ≥6.5% → 糖尿病
    condition:
      field: lab_results.HbA1c
      operator: ">="
      value: 6.5
    result:
      diagnosis: 糖尿病
      criteria: HbA1c

  - id: dm-prediabetes
    description: 糖尿病前期 (IFG/IGT)
    condition:
      or:
        - and:
          - field: lab_results.FPG
            operator: ">="
            value: 6.1
          - field: lab_results.FPG
            operator: "<"
            value: 7.0
        - and:
          - field: lab_results.OGTT_2h
            operator: ">="
            value: 7.8
          - field: lab_results.OGTT_2h
            operator: "<"
            value: 11.1
    result:
      diagnosis: 糖尿病前期
      recommendation: 生活方式干预/年度筛查

  - id: dm-type-classify
    description: 糖尿病分型判断
    condition:
      or:
        - field: diagnosis
          operator: contains
          value: 1型糖尿病
        - field: diagnosis
          operator: contains
          value: 2型糖尿病
        - field: diagnosis
          operator: contains
          value: 妊娠期糖尿病
    result:
      actions:
        - GAD抗体检测 (疑1型)
        - C肽检测 (疑1型)
        - 酮体检测

---
rule_type: treatment
department: 内分泌科
capability: cap-l3-endo-dm-treatment
business_process: bp-endocrinology-treatment
data_entities:
  consumes:
  - de-diagnosis-result
  - de-lab-results
  produces:
  - de-treatment-plan
guideline: 中国糖尿病防治指南（2024版）
stakeholder: 降糖药物选择与综合治疗
version: "1.0.0"

rules:
  - id: dm-lifestyle
    description: 糖尿病生活方式干预
    condition:
      field: diagnosis
      operator: contains
      value: 糖尿病
    result:
      treatment: 生活方式干预
      interventions:
        - 医学营养治疗 (MNT)
        - 运动 ≥150min/周
        - 减重 5-10%
        - 戒烟

  - id: dm-target-hba1c
    description: 血糖控制目标
    condition:
      field: diagnosis
      operator: contains
      value: 糖尿病
    result:
      target_hba1c: "<7.0% (一般); <6.5% (年轻/病程短); <8.0% (老年/合并症多)"
      target_fpg: "4.4-7.0 mmol/L"
      target_2hpg: "<10.0 mmol/L"

  - id: dm-metformin
    description: 二甲双胍一线治疗
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 2型糖尿病
        - field: eGFR
          operator: ">="
          value: 30
    result:
      treatment: 二甲双胍
      dose: "起始500mg bid，逐渐增至2000mg/天"
      warnings:
        - eGFR<30 禁用
        - 造影检查暂停

  - id: dm-cvd-ckd-priority
    description: ASCVD/CKD患者优选SGLT2i/GLP-1RA
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 2型糖尿病
        - or:
          - field: diagnosis
            operator: contains
            value: 心血管疾病
          - field: diagnosis
            operator: contains
            value: 心力衰竭
          - field: diagnosis
            operator: contains
            value: 慢性肾脏病
    result:
      treatment: SGLT2i / GLP-1RA 优先
      medications:
        - SGLT2i (达格列净/恩格列净)
        - GLP-1RA (司美格鲁肽/利拉鲁肽)
      benefit: 心肾保护独立于降糖

  - id: dm-insulin-initiation
    description: 胰岛素起始治疗指征
    condition:
      or:
        - and:
          - field: lab_results.HbA1c
            operator: ">="
            value: 9.0
          - field: diagnosis
            operator: contains
            value: 新诊断
        - and:
          - field: lab_results.HbA1c
            operator: ">="
            value: 8.5
          - field: treatment_history.oral_drugs_failed
            operator: equals
            value: true
    result:
      treatment: 胰岛素起始治疗
      regimen: 基础胰岛素 (甘精/德谷) + 二甲双胍
      titration: 空腹血糖目标 4.4-7.0

  - id: dm-complication-screen
    description: 糖尿病并发症筛查
    condition:
      field: diagnosis
      operator: contains
      value: 糖尿病
    result:
      screenings:
        - item: 眼底检查
          frequency: 每年1次
        - item: 尿微量白蛋白/肌酐比值
          frequency: 每年1次
        - item: 血肌酐/eGFR
          frequency: 每年1-2次
        - item: 足部检查
          frequency: 每次随访
        - item: 心电图
          frequency: 每年1次

---
rule_type: acute_care
department: 内分泌科
capability: cap-l3-endo-dm-acute
business_process: bp-endocrinology-treatment
data_entities:
  consumes:
  - de-lab-results
  - de-vital-signs
  produces:
  - de-emergency-plan
guideline: 中国糖尿病防治指南（2024版）
stakeholder: DKA/HHS急症识别与处理
version: "1.0.0"

rules:
  - id: dm-dka
    description: 糖尿病酮症酸中毒识别
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 糖尿病
        - field: lab_results.ketone
          operator: ">="
          value: 3.0
        - field: lab_results.pH
          operator: "<"
          value: 7.3
    result:
      diagnosis: 糖尿病酮症酸中毒
      severity: 危重
      recommendation: 立即住院 ICU
      emergency_treatment:
        - 补液 (0.9% NaCl 1000mL/h 起始)
        - 胰岛素持续静脉输注 (0.1 U/kg/h)
        - 补钾 (K+<5.2时)
        - 监测血糖/酮体/电解质 q1h

  - id: dm-hhs
    description: 高血糖高渗状态识别
    condition:
      and:
        - field: diagnosis
          operator: contains
          value: 糖尿病
        - field: lab_results.glucose
          operator: ">="
          value: 33.3
        - field: lab_results.osmolarity
          operator: ">="
          value: 320
    result:
      diagnosis: 高血糖高渗状态
      severity: 危重
      recommendation: 立即住院 ICU

---
rule_type: followup
department: 内分泌科
capability: cap-l3-endo-dm-followup
business_process: bp-endocrinology-followup
data_entities:
  consumes:
  - de-treatment-plan
  - de-patient
  produces:
  - de-followup-plan
guideline: 中国糖尿病防治指南（2024版）
stakeholder: 糖尿病长期随访管理
version: "1.0.0"

rules:
  - id: dm-followup-3m
    description: 糖尿病3个月随访
    condition:
      field: diagnosis
      operator: contains
      value: 糖尿病
    result:
      followup_schedule:
        - time: 每3个月
          items:
          - HbA1c
          - 空腹/餐后血糖
          - 体重/BMI
          - 血压
          - 用药依从性
          - 低血糖事件

  - id: dm-followup-annual
    description: 糖尿病年度全面评估
    condition:
      field: diagnosis
      operator: contains
      value: 糖尿病
    result:
      annual_review:
        - 血脂全套
        - 肝肾功能
        - 尿微量白蛋白
        - 眼底检查
        - 足部检查 (神经病变筛查)
        - 心电图
        - 颈动脉超声 (高危)
      red_flags:
        - HbA1c持续>9%
        - eGFR下降>5 mL/min/年
        - 新发蛋白尿
        - 足部溃疡/感染
