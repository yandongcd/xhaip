view_name: 创伤骨科 TOGAF BA 实例
description: 创伤骨科 Agent 业务架构 — 8 个 BusinessProcess + 5 个 Role + 6 个 DataEntity + A2A 协作
vw: 1000
vh: 640
nodes:

# ── Business Processes ──
- id: bp-ortho-registration
  label: 患者注册与数据采集
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 60
  detail:
    title: 🔄 患者注册与数据采集 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 分诊护士 + 住院总值班医生
    - - 步骤数
      - '5'
    - - 步骤
      - ①急诊接诊→②住院总评定→③HIS建档→④五史录入→⑤数据预加载
    - - 关键决策
      - 启动绿色通道？→ 是(≥75岁) | 否(常规)
    - - 指南
      - nhc-2022, nanfang-hip-fracture-triage
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-ortho-classification
  label: 骨折分型
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 130
  detail:
    title: 🔄 骨折分型 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生
    - - 步骤数
      - '4'
    - - 步骤
      - ①影像获取→②骨折类型判定→③Garden分型→④Evans/AO分型
    - - 关键决策
      - 骨折部位？→ 股骨颈 | 转子间；稳定性？→ 稳定 | 不稳定
    - - 指南
      - csco-femoral-neck-2018, csco-intertroch-2020, aaos-2022
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-ortho-assessment
  label: 术前评估与风险分层
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 200
  detail:
    title: 🔄 术前评估与风险分层 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生
    - - 步骤数
      - '5'
    - - 步骤
      - ①14项检查完整性→②6因子评估→③心脏会诊(A2A)→④麻醉评估(A2A)→⑤风险分层
    - - 关键决策
      - 每因子 → 正常 | 可控 | 延迟因素
    - - 指南
      - nhc-2022, efort-2021, nanfang-hip-fracture-triage
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-timing-decision
  label: 手术时机决策（父流程）
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 270
  detail:
    title: 🔄 手术时机决策·跨Agent编排 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生 + 麻醉科医生
    - - 步骤数
      - '7'
    - - 步骤
      - ①手术必要性→②心内科A2A→③麻醉科A2A→④延迟汇总→⑤MDT裁定→⑥护理→⑦随访
    - - 子流程
      - bp-ortho-surgical-timing（timing_engine 4步内核）
    - - 指南
      - nhc-2022, nice-ng37, aaos-2022
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-ortho-timing
  label: 手术时机引擎（子流程）
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 340
  detail:
    title: 🔄 手术时机引擎·timing_engine内核 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生 + 麻醉科医生
    - - 步骤数
      - '4'
    - - 步骤
      - ①延迟因素汇总→②时机裁定→③MDT决策→④术前优化
    - - 父流程
      - bp-timing-decision
    - - 指南
      - nhc-2022, nice-ng37, aaos-2022, nanfang-hip-fracture-triage
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-ortho-complication
  label: 并发症风险预测
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 410
  detail:
    title: 🔄 并发症风险预测 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生 + 护士长
    - - 步骤数
      - '5'
    - - 步骤
      - ①DVT风险→②感染风险→③心脏并发症→④跌倒谵妄→⑤综合矩阵
    - - 关键决策
      - 综合风险 → 低危 | 中危 | 高危(MDT) | 极高危(延迟手术)
    - - 指南
      - nhc-2022, dvt-consensus-2024, universal-mi-4th
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-ortho-surgery-planning
  label: 手术方案推荐
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 480
  detail:
    title: 🔄 手术方案推荐 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生 + 主刀医生
    - - 步骤数
      - '5'
    - - 步骤
      - ①分型确认→②手术方式→③入路选择→④规格选择→⑤方案确认
    - - 关键决策
      - 手术方式 → CCS | HA | THA | PFNA | InterTAN | 保守
    - - 指南
      - aaos-2022, csco-femoral-neck-2018, csco-intertroch-2020
  subtype: Process
  subtype_cn: 业务流程
  big: false

- id: bp-ortho-followup
  label: 出院随访与二次骨折预防
  type: BusinessProcess
  domain: ba
  color: '#5e5ce6'
  icon: 🔄
  x: 400
  y: 550
  detail:
    title: 🔄 出院随访与二次骨折预防 (BusinessProcess)
    fields:
    - - TOGAF 实体
      - BusinessProcess (Core ABB)
    - - Owner
      - 主治医生
    - - 步骤数
      - '5'
    - - 步骤
      - ①出院计划→②1月复诊→③3月复诊→④6月复诊→⑤12月年度随访
    - - 关键决策
      - 愈合进展 → 正常 | 延迟愈合 | 不良(排查并发症)
    - - 指南
      - nhc-2022, nice-ng37, dvt-consensus-2024
  subtype: Process
  subtype_cn: 业务流程
  big: false

