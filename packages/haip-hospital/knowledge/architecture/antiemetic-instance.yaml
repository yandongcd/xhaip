        - ["指南溯源", "35条推荐意见全部GRADE标注"]
        - ["架构域", "数据架构 (知识层)"]

  - id: platform
    label: Nexent智能体平台
    type: TechnologyService
    color: "#ff453a"
    icon: "☁️"
