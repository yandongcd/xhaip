description: >
  GOLD 2024 慢性阻塞性肺疾病全球策略。涵盖COPD诊断（FEV1/FVC<0.7）、
  综合评估（ABCD分组）、稳定期药物治疗（LAMA/LABA/ICS）、急性加重管理、
  非药物治疗（氧疗/肺康复）。

