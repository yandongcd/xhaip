description: >
  EULAR 2023 recommendations for the management of rheumatic and musculoskeletal
  diseases. Covers RA classification (2010 ACR/EULAR criteria), SLE diagnosis
  (2019 EULAR/ACR criteria), DMARDs treatment strategy (treat-to-target),
  gout management (acute flare vs urate-lowering therapy), and management of
  psoriatic arthritis and axial spondyloarthritis.

