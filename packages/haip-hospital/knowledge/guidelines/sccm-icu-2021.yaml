description: >
  Surviving Sepsis Campaign: International Guidelines for Management
  of Sepsis and Septic Shock 2021. Covers screening (qSOFA/SOFA),
  1-hour bundle (lactate, blood culture, antibiotics, fluids, vasopressors),
  hemodynamic monitoring, ARDS mechanical ventilation, sedation/analgesia,
  nutrition support, and AKI/CRRT management.

