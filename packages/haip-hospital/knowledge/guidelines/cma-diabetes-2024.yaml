description: >
  2024版糖尿病防治指南，共20章，涵盖中国糖尿病流行病学、诊断与分型、
  综合控制目标、生活方式干预、药物治疗（口服药/胰岛素/GLP-1RA/SGLT2i）、
  急慢性并发症管理、特殊人群管理等。突破以往仅关注2型糖尿病的局限，
  新增儿童青少年糖尿病和1型糖尿病专门章节。

