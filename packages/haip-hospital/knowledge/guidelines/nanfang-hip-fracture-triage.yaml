id: "guideline-nanfang-hip-fracture"
name: "南方医院创伤骨科髋部骨折围术期风险评估规范"
abbr: "南方医院 2026"
version: "1.0"
publisher: "南方医科大学南方医院创伤骨科"
language: zh-CN
trust_level: T2
admin_priority: 5

description: >
  南方医院创伤骨科基于创伤骨科临床经验临床经验制定的髋部骨折围术期风险评估规范。
  与NICE NG37 / AAOS 2022 / 卫健委2022版等国家级/国际指南（T1）并行使用，
  部分维度的权重分配和评估粒度存在差异。

differences_from_T1:
  - factor: "肺部评估"
    T1: "肺部仅作为感染因素（中权重）间接覆盖，慢性肺病不触发延迟"
    T2: "独立为高权重维度。急性感染性肺炎（1周内/至少3天）或哮喘或肺梗塞直接触发高延迟风险"
    rationale: "创伤骨科临床经验：肺部并发症是老年髋部骨折围术期死亡率第二大预测因素"

  - factor: "脑血管疾病"
    T1: "无独立评估维度"
    T2: "一月内新发脑梗/脑梗死为高权重独立维度，影响抗凝决策和手术时机"
    rationale: "创伤骨科临床经验：一月内脑梗患者再发风险高，需脑血管评估后决定手术窗口"

  - factor: "抗凝权重"
    T1: "高权重"
    T2: "中权重（创伤骨科临床经验：可控可管理，通过停药桥接方案可限期手术）"

  - factor: "肾功能权重"
    T1: "高权重"
    T2: "中权重（创伤骨科临床经验：在老年患者较常见，优化后可限期手术）"

  - factor: "心脏评估"
    T1: "高权重"
    T2: "高权重（与T1一致）"

  - factor: "决策逻辑"
    T1: "6因素等权计数 → 0/1-2/3+裁定"
    T2: "3高权重因素 + 4中权重因素分层裁定：高≥1 → 直接MDT通道；高=0 且 中≤2 → 限期手术"
