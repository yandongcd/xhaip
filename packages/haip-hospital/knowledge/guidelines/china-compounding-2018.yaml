description: >
  中国首部肠外营养液配制规范。规定了TPN配制的全流程标准操作，
  包括: 成品输液袋产品选择、处方设计(葡萄糖≤23%/氨基酸≥2.5%/
  渗透压/阳离子限量)、配制环境、配制顺序(8步)、质量控制、储存与运输。

