[project]
name = "haip-core"
version = "1.2.0"
description = "HAIP 核心引擎 — LLM Provider / A2A / Orchestrator / Guard / 知识库"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
    "bcrypt>=4.0,<5.0",
    "PyJWT>=2.0,<3.0",
    "prometheus-client>=0.19,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "structlog>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.20",
]
rag = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "numpy>=1.24",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["PLR1704"]
ignore = ["E402", "BLE001", "RUF013", "DTZ005", "DTZ007", "SIM102", "SIM117", "SIM103", "SIM210", "PERF102", "PERF402", "C401", "B008", "RUF012", "PLC0206", "S112", "S110", "RUF059", "F401", "F841", "RUF100", "PLW1510", "RUF034", "LOG015", "RUF022", "B033", "B017", "UP036"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haip*"]

[tool.setuptools.package-data]
haip = ["templates/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "-v"]
