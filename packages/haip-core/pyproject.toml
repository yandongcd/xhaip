[project]
name = "haip-core"
version = "1.2.0"
description = "HAIP 核心引擎 — LLM Provider / A2A / Orchestrator / Guard / 知识库"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "bcrypt>=4.0",
    "PyJWT>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.20",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["PLR1704"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haip*"]

[tool.setuptools.package-data]
haip = ["templates/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "-v"]
