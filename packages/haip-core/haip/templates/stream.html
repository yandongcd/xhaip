<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xHAIP v1.2 — Live Agent Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='dashboard/style.css') }}">
<style>
/* Stream-specific layout — colors from tokens.css */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;background:var(--color-bg-elevated);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar h2{padding:var(--space-5) var(--space-4) var(--space-3);font-size:var(--text-md);color:var(--color-brand);font-weight:var(--fw-semibold);border-bottom:1px solid var(--color-border)}
.agent-item{padding:var(--space-3) var(--space-4);cursor:pointer;border-bottom:1px solid var(--color-border);transition:background var(--transition-fast)}
.agent-item:hover{background:var(--color-surface-hover)}
.agent-item.active{background:var(--color-surface-selected);border-left:3px solid var(--color-brand)}
.agent-item .name{font-size:var(--text-base);font-weight:var(--fw-medium)}
.agent-item .meta{font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0;flex-wrap:wrap}
.toolbar select{padding:var(--space-2) var(--space-3);background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);font-family:inherit}
.toolbar input{flex:1;padding:var(--space-2) var(--space-3);background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);font-family:inherit;min-width:120px}
.toolbar input:focus{border-color:var(--color-brand);box-shadow:var(--shadow-glow-brand);outline:none}
.toolbar button{padding:var(--space-2) var(--space-5);background:var(--color-brand);color:var(--color-text-inverse);border:none;border-radius:var(--radius-md);font-size:var(--text-sm);cursor:pointer;font-weight:var(--fw-medium);font-family:inherit;transition:all var(--transition-fast)}
.toolbar button:hover{background:var(--color-brand-hover)}
.toolbar button:disabled{opacity:.5;cursor:not-allowed}
.stream{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.event-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);animation:slideIn var(--transition-base) ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.event-card .header{display:flex;align-items:center;gap:var(--space-2);margin-bottom:6px}
.event-card .badge{padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-2xs);font-weight:var(--fw-semibold)}
.badge-user{background:var(--color-brand-subtle);color:var(--color-brand)}
.badge-assistant{background:var(--color-success-subtle);color:var(--color-success)}
.badge-tool{background:var(--color-warning-subtle);color:var(--color-warning)}
.badge-error{background:var(--color-danger-subtle);color:var(--color-danger)}
.badge-complete{background:var(--color-bg-overlay);color:var(--color-text-secondary)}
.event-card .ts{font-size:var(--text-2xs);color:var(--color-text-tertiary);margin-left:auto}
.event-card .content{color:var(--color-text);line-height:var(--lh-normal);white-space:pre-wrap}
.event-card .state{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-border)}
.state-chip{padding:1px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-2xs);background:var(--color-info);color:var(--color-text-inverse)}
.session-info{font-size:var(--text-2xs);color:var(--color-text-secondary);padding:var(--space-1) var(--space-5) var(--space-3);border-bottom:1px solid var(--color-border)}
.controls{display:flex;gap:var(--space-2)}
.controls label{font-size:var(--text-xs);color:var(--color-text-secondary);display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.status-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-idle{background:var(--color-text-tertiary)}.status-streaming{background:var(--color-brand);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <h2>xhaip v1.2 — Live Stream</h2>
  <div class="session-info">
    Session: <code id="sessionId">default</code> |
    Status: <span class="status-indicator status-idle" id="statusDot"></span><span id="statusText">Idle</span>
  </div>
  <div id="agentList">Loading agents...</div>
</div>
<div class="main">
  <div class="toolbar">
    <span id="activeAgent" style="font-size:14px;font-weight:500;min-width:120px">Select agent</span>
    <input id="queryInput" placeholder="输入临床问题..." onkeypress="if(event.key==='Enter')startStream()">
    <input id="stepsInput" type="number" value="5" min="1" max="10" title="Max steps" style="width:60px">
    <button id="sendBtn" onclick="startStream()">Send</button>
    <button onclick="clearStream()" style="background:var(--border);color:var(--text)">Clear</button>
    <div class="controls">
      <label><input type="checkbox" id="showState" checked onchange="toggleState()">State</label>
      <label><input type="checkbox" id="autoScroll" checked>Auto-scroll</label>
    </div>
  </div>
  <div class="stream" id="streamContainer">
    <div style="color:var(--text2);text-align:center;padding:60px 0;font-size:14px">
      Select an agent and enter a query to start streaming &#x2191;
    </div>
  </div>
</div>

<script>
let activeAgent = '';
let eventSource = null;
let eventCount = 0;

async function loadAgents() {
  try {
    const r = await fetch('/api/agents');
    const agents = await r.json();
    const list = document.getElementById('agentList');
    list.innerHTML = agents.map(a =>
      `<div class="agent-item" onclick="selectAgent('${a.name}','${a.cn_name||a.name}')">
        <div class="name">${a.name}</div>
        <div class="meta">${a.cn_name||''} &middot; ${a.department||''} &middot; ${a.tools?.length||0} tools</div>
      </div>`
    ).join('');
  } catch(e) {
    document.getElementById('agentList').innerHTML = '<div class="agent-item"><span style="color:var(--danger)">Failed to load agents</span></div>';
  }
}

function selectAgent(name, cnName) {
  activeAgent = name;
  document.getElementById('activeAgent').textContent = `${cnName} (${name})`;
  document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
  event.target?.closest('.agent-item')?.classList.add('active');
  document.getElementById('queryInput').focus();
}

function startStream() {
  const query = document.getElementById('queryInput').value.trim();
  if (!query || !activeAgent) return;
  if (eventSource) eventSource.close();

  const maxSteps = parseInt(document.getElementById('stepsInput').value) || 5;
  const sessionId = document.getElementById('sessionId').textContent;

  setStatus('streaming', 'Streaming...');
  document.getElementById('sendBtn').disabled = true;

  // Use POST to /api/stream with SSE response
  eventSource = new EventSource(
    `/api/sse?agent=${encodeURIComponent(activeAgent)}&query=${encodeURIComponent(query)}&max_steps=${maxSteps}&session_id=${sessionId}`
  );

  eventSource.onmessage = function(e) {
    try {
      const evt = JSON.parse(e.data);
      addEventCard(evt);
      if (evt.turn_complete) {
        eventSource.close();
        setStatus('idle', 'Complete');
        document.getElementById('sendBtn').disabled = false;
      }
      if (evt.error) {
        setStatus('idle', `Error: ${evt.error}`);
        document.getElementById('sendBtn').disabled = false;
      }
    } catch(err) {
      console.error('Parse error:', err);
    }
  };

  eventSource.onerror = function(e) {
    console.error('SSE error:', e);
    eventSource.close();
    setStatus('idle', 'Connection closed');
    document.getElementById('sendBtn').disabled = false;
  };
}

function addEventCard(evt) {
  eventCount++;
  const container = document.getElementById('streamContainer');
  if (eventCount === 1) container.innerHTML = '';

  const badge = evt.role === 'user' ? 'badge-user' :
                evt.role === 'tool' ? 'badge-tool' :
                evt.error ? 'badge-error' :
                evt.turn_complete ? 'badge-complete' : 'badge-assistant';
  const badgeText = evt.role === 'user' ? 'USER' :
                     evt.role === 'tool' ? `TOOL:${evt.tool_name}` :
                     evt.turn_complete ? 'DONE' : 'AI';
  const headerExtra = evt.author ? ` @${evt.author}` : '';
  const time = new Date(evt.timestamp * 1000).toLocaleTimeString();

  let stateHtml = '';
  if (evt.state_delta && Object.keys(evt.state_delta).length > 0) {
    stateHtml = '<div class="state" data-state>' +
      Object.entries(evt.state_delta).map(([k,v]) =>
        `<span class="state-chip">${k}: ${JSON.stringify(v).substring(0,60)}</span>`
      ).join('') + '</div>';
  }

  const errHtml = evt.error ? `<div style="color:var(--danger);margin-top:4px">Error: ${evt.error}</div>` : '';

  const card = document.createElement('div');
  card.className = 'event-card';
  card.innerHTML = `
    <div class="header">
      <span class="badge ${badge}">${badgeText}${headerExtra}</span>
      <span class="ts">#${eventCount} ${time}</span>
    </div>
    <div class="content">${escapeHtml(evt.content || '')}</div>
    ${errHtml}
    ${stateHtml}
  `;
  container.appendChild(card);
  toggleState();

  if (document.getElementById('autoScroll').checked) {
    container.scrollTop = container.scrollHeight;
  }
}

function clearStream() {
  document.getElementById('streamContainer').innerHTML = '';
  eventCount = 0;
  if (eventSource) eventSource.close();
  setStatus('idle', 'Idle');
  document.getElementById('sendBtn').disabled = false;
}

function toggleState() {
  const show = document.getElementById('showState').checked;
  document.querySelectorAll('[data-state]').forEach(el => el.style.display = show ? 'flex' : 'none');
}

function setStatus(status, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-indicator status-' + status;
  txt.textContent = text;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Init
loadAgents();
// Click first agent by default
setTimeout(() => {
  const first = document.querySelector('.agent-item');
  if (first) first.click();
}, 300);
</script>
</body>
</html>
