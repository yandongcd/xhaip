<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xhaip v1.2 — Hospital AI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='dashboard/style.css') }}">
<style>
/* Portal-specific layout — colors from tokens.css */
:root{--bg-gradient:linear-gradient(135deg,var(--color-bg-elevated) 0%,var(--color-bg) 60%)}
[data-theme="dark"]{--bg-gradient:linear-gradient(135deg,var(--color-bg-elevated) 0%,var(--color-bg) 60%)}

*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--color-brand);color:#fff}

body{font-family:var(--font-sans);-webkit-font-smoothing:antialiased;background:var(--color-bg);color:var(--color-text);display:flex;height:100vh;overflow:hidden;font-size:var(--text-base);line-height:var(--lh-normal);transition:background var(--transition-slow),color var(--transition-slow)}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--color-scrollbar-thumb);border-radius:3px}

/* Sidebar */
.sidebar{width:260px;background:var(--color-header-bg);color:var(--color-header-text);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar h2{padding:var(--space-4);font-size:var(--text-md);font-weight:var(--fw-semibold);letter-spacing:-.01em;border-bottom:1px solid rgba(255,255,255,.1)}
.agent-list{flex:1;overflow-y:auto}
.agent-item{padding:var(--space-3) var(--space-4);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);transition:background var(--transition-fast);color:var(--color-header-text)}
.agent-item:hover{background:rgba(255,255,255,.08)}
.agent-item.active{background:var(--color-brand-subtle);border-left:3px solid var(--color-brand);color:var(--color-text)}
.agent-item .name{font-size:var(--text-sm);font-weight:var(--fw-semibold)}
.agent-item .meta{font-size:var(--text-2xs);color:rgba(255,255,255,.5);margin-top:2px}
.agent-item.active .meta{color:var(--color-text-secondary)}
.tag{display:inline-block;padding:1px 6px;border-radius:var(--radius-full);font-size:var(--text-2xs);margin-right:4px;font-weight:var(--fw-semibold)}
.tag-biz{background:var(--color-brand-subtle);color:var(--color-brand)}
.tag-spec{background:var(--color-success-subtle);color:var(--color-success)}
.tag-master{background:var(--color-info-subtle);color:var(--color-info)}
.section-label{padding:var(--space-2) var(--space-4);font-size:var(--text-2xs);color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.04em;font-weight:var(--fw-medium)}

/* Main layout */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;display:flex;overflow:hidden;min-height:0;width:100%}
.main-header{height:52px;padding:0 var(--space-5);background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;font-size:var(--text-md);font-weight:var(--fw-semibold);flex-shrink:0;backdrop-filter:blur(12px)}
.header-btn{padding:5px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text);cursor:pointer;font-size:var(--text-xs);font-weight:var(--fw-medium);font-family:inherit;transition:all var(--transition-fast)}
.header-btn:hover{background:var(--color-brand);color:var(--color-text-inverse);border-color:var(--color-brand)}
.header-btn.active{background:var(--color-brand);color:var(--color-text-inverse);border-color:var(--color-brand)}

/* Tool panel */
.tool-panel{flex:1;padding:var(--space-4) var(--space-5);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-3);min-height:0;min-width:0;scrollbar-gutter:stable}
.tool-panel h3{font-size:var(--text-sm);color:var(--color-brand);font-weight:var(--fw-semibold)}
.tool-panel select,.tool-panel textarea,.tool-panel input{padding:var(--space-2) var(--space-3);background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);width:100%;font-family:inherit;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.tool-panel select:focus,.tool-panel textarea:focus,.tool-panel input:focus{border-color:var(--color-brand);box-shadow:var(--shadow-glow-brand)}
.tool-panel textarea{height:100px;font-family:var(--font-mono);resize:vertical;line-height:var(--lh-normal)}
.btn{padding:var(--space-2) var(--space-4);border:none;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:var(--fw-semibold);cursor:pointer;font-family:inherit;transition:all var(--transition-fast)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--color-brand);color:var(--color-text-inverse)}.btn-primary:hover{background:var(--color-brand-hover);box-shadow:0 4px 12px rgba(13,115,119,.3)}
.btn-secondary{background:var(--color-info);color:var(--color-text-inverse)}.btn-secondary:hover{filter:brightness(1.1)}
.row{display:flex;gap:var(--space-2);align-items:center}

/* Result panel */
.result-panel{width:410px;background:var(--color-bg-inset);color:var(--color-text);padding:var(--space-4) var(--space-5);overflow-y:auto;font-family:var(--font-mono);font-size:var(--text-xs);line-height:var(--lh-relaxed);white-space:pre-wrap;border-left:1px solid var(--color-border);flex-shrink:0}
.result-panel .ok{color:var(--color-success)}.result-panel .err{color:var(--color-danger)}.result-panel .key{color:var(--color-brand)}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--color-bg);border-radius:var(--radius-lg);padding:3px;margin-bottom:var(--space-3);flex-shrink:0;position:sticky;top:0;z-index:1}
.tab{padding:7px 16px;border:none;background:transparent;font-size:var(--text-xs);color:var(--color-text-secondary);cursor:pointer;border-radius:var(--radius-md);font-weight:var(--fw-medium);font-family:inherit;transition:all var(--transition-base)}
.tab:hover{color:var(--color-text)}
.tab.active{background:var(--color-brand);color:var(--color-text-inverse);box-shadow:0 2px 8px rgba(13,115,119,.3)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn var(--transition-fast) ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Chat */
.chat{flex:1;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:var(--space-3) 0;display:flex;flex-direction:column;gap:var(--space-2)}
.chat-msg{padding:var(--space-2) var(--space-3);border-radius:var(--radius-lg);font-size:var(--text-sm);max-width:85%;line-height:var(--lh-normal)}
.chat-user{align-self:flex-end;background:var(--color-brand);color:var(--color-text-inverse);border-bottom-right-radius:var(--radius-sm)}
.chat-agent{align-self:flex-start;background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);border-bottom-left-radius:var(--radius-sm)}
.chat-input{padding:var(--space-2) 0 0;border-top:1px solid var(--color-border);display:flex;gap:var(--space-2)}
.chat-input input{flex:1;padding:var(--space-2) var(--space-3);background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);font-family:inherit;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.chat-input input:focus{border-color:var(--color-brand);box-shadow:var(--shadow-glow-brand)}
.chat-input input::placeholder{color:var(--color-text-placeholder)}
.status-bar{padding:6px var(--space-5);font-size:var(--text-2xs);color:var(--color-text-secondary);border-top:1px solid var(--color-border);background:var(--color-surface);display:flex;justify-content:space-between;flex-shrink:0}
</style>
</head>
<body>
<div class="sidebar">
  <h2>xHAIP</h2>
  <div class="agent-list" id="agent-list"></div>
  <div id="sidebar-stats" style="padding:var(--space-3) var(--space-4);font-size:var(--text-2xs);color:rgba(255,255,255,.35);border-top:1px solid rgba(255,255,255,.1)"></div>
</div>
<div class="main">
  <div class="main-header">
    <span id="main-header">选择 Agent 开始</span>
    <button class="header-btn" id="btn-theme" onclick="toggleTheme()">深色</button>
  </div>
  <div class="content">
    <div class="tool-panel" id="tool-panel" style="display:none">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('tools')">工具调用</button>
        <button class="tab" onclick="switchTab('chat')">聊天</button>
        <button class="tab" onclick="switchTab('guard')">Guard</button>
        <button class="tab" onclick="switchTab('knowledge')">知识库</button>
        <button class="tab" onclick="switchTab('meta')">元信息</button>
        <button class="tab" onclick="switchTab('config')">配置</button>
      </div>
      <div class="tab-content active" id="tab-tools">
        <h3>工具调用</h3>
        <select id="agent-select-patient" style="margin-bottom:10px" onchange="onPatientSelect()"><option value="">-- 先选择患者 --</option></select>
        <select id="tool-select" onchange="onToolChange()"><option>-- 选择工具 --</option></select>
        <textarea id="params-input">{"patient_id":"P001"}</textarea>
        <div class="row">
          <button class="btn btn-primary" onclick="callTool()">执行</button>
          <button class="btn btn-secondary" onclick="guardVerify()">Guard 验证</button>
        </div>
      </div>
      <div class="tab-content" id="tab-chat">
        <div class="chat" style="flex:1;min-height:200px">
          <div class="chat-messages" id="chat-messages">
            <div class="chat-msg chat-agent">你好! 我是 AI 助手, 请描述你的问题。</div>
          </div>
          <div class="chat-input">
            <input id="chat-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendChat()">
            <button class="btn btn-primary" onclick="sendChat()">发送</button>
          </div>
        </div>
      </div>
      <div class="tab-content" id="tab-guard">
        <h3>Guard 安全验证</h3>
        <textarea id="guard-input" style="height:120px" placeholder="粘贴 Agent 输出进行安全验证 (执行工具调用后自动带入最近一次结果)..."></textarea>
        <select id="guard-scenario" style="margin-top:8px">
          <option value="手术方案">手术方案</option><option value="抗凝管理">抗凝管理</option>
          <option value="麻醉评估">麻醉评估</option><option value="MDT分歧">MDT分歧</option>
        </select>
        <button class="btn btn-primary" style="margin-top:8px" onclick="runGuard()">运行 Guard</button>
      </div>
      <div class="tab-content" id="tab-knowledge">
        <h3>知识库</h3>
        <div id="knowledge-content" style="font-size:12px;color:var(--text-secondary);line-height:1.8">选择 Agent 后显示其参考的知识库清单。</div>
      </div>
      <div class="tab-content" id="tab-meta">
        <h3>Agent 元信息</h3>
        <div id="meta-content" style="font-size:12px;color:var(--text-secondary);line-height:1.8"></div>
      </div>
      <div class="tab-content" id="tab-config">
        <h3>LLM API Key 配置</h3>
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">配置 DeepSeek API Key 后聊天功能使用真实 LLM。Key 保存至 <code>data/llm_key.json</code>, 重启后无需重新输入。</p>
        <form onsubmit="return false;" style="margin:0">
        <input type="password" id="llm-key-input" placeholder="sk-..." style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-family:monospace;font-size:13px" autocomplete="off">
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-primary" style="margin-top:0" onclick="saveApiKey()">保存 API Key</button>
          <button class="btn" style="margin-top:0;border:1px solid var(--border);border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer;background:var(--card-bg);color:var(--text)" onclick="clearApiKey()">清除</button>
        </div>
        </form>
        <div id="llm-config-status" style="margin-top:12px;font-size:12px;color:var(--text-secondary)"></div>
        <div id="agent-nav-link" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
          <a id="agent-page-link" href="#" target="_blank" rel="noopener noreferrer"
             style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;color:var(--accent);background:rgba(10,132,255,.1);transition:background .15s"
             onmouseover="this.style.background='rgba(10,132,255,.18)'"
             onmouseout="this.style.background='rgba(10,132,255,.1)'">
            🔗 请先在左侧选择一个 Agent
          </a>
        </div>
      </div>
    </div>
    <div class="result-panel" id="result-panel">选择 Agent 和工具后执行调用, 结果将在此显示。</div>
  </div>
  <div class="status-bar">
    <span id="status-left">就绪</span>
    <span id="status-right"></span>
  </div>
</div>

<script>
let currentAgent = null;
let agents = [];

(function(){var t=localStorage.getItem('xhaip_theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.getElementById('btn-theme').textContent=t==='dark'?'深色':'浅色'})();
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',cur);localStorage.setItem('xhaip_theme',cur);document.getElementById('btn-theme').textContent=cur==='dark'?'深色':'浅色'}

async function init() {
  try {
    const r = await fetch('/api/agents');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    agents = await r.json();
    if (!Array.isArray(agents)) throw new Error('agents not an array');
  } catch(e) {
    document.getElementById('agent-list').innerHTML = '<div style="padding:16px;color:var(--danger);font-size:13px">加载 Agent 失败: ' + e.message + '</div>';
    return;
  }
  renderSidebar();
  document.getElementById('sidebar-stats').textContent = agents.length + ' agents loaded';
  document.getElementById('status-right').textContent = 'API v1.0 | ' + agents.length + ' agents';
}

function renderSidebar() {
  if (!Array.isArray(agents)) return;
  const groups = {business:[], specialist:[], master_data:[]};
  agents.forEach(a => groups[a.type]?.push(a));
  let html = '';
  for (const [type, label, tag] of [['business','Business','tag-biz'],['specialist','Specialist','tag-spec'],['master_data','Master Data','tag-master']]) {
    html += '<div class="section-label">'+label+'</div>';
    groups[type].forEach(a => {
      const displayName = (a.cn_name||'').replace(/\s+v\d+\.\d+(\.\d+)?$/,'');
      html += '<div class="agent-item" onclick="selectAgent(\''+a.name+'\')" id="item-'+a.name+'">';
      html += '<div class="name"><span class="tag '+tag+'">'+a.type.substring(0,4)+'</span> '+displayName+'</div>';
      html += '<div class="meta">'+a.name+' | '+a.tools.length+' tools</div></div>';
    });
  }
  document.getElementById('agent-list').innerHTML = html;
}

function selectAgent(name) {
  document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
  document.getElementById('item-'+name)?.classList.add('active');
  currentAgent = agents.find(a => a.name === name);
  document.getElementById('main-header').textContent = (currentAgent.cn_name||'').replace(/\s+v\d+\.\d+(\.\d+)?$/,'') + ' (' + currentAgent.name + ')';
  document.getElementById('tool-panel').style.display = 'flex';
  document.getElementById('result-panel').textContent = '';
  // 切换 Agent 时清空聊天记录和参数
  document.getElementById('chat-messages').innerHTML = '<div class="chat-msg chat-agent">你好! 我是 AI 助手, 请描述你的问题。</div>';
  document.getElementById('params-input').value = '{"patient_id":"P001"}';
  document.getElementById('guard-input').value = '';
  const dispName = (currentAgent.cn_name||'').replace(/\s+v\d+\.\d+(\.\d+)?$/,'');
  document.getElementById('result-panel').textContent = 'Agent 已加载: ' + dispName + '. 选择患者和工具开始。';
  // 配置页跳转链接
  var lnk = document.getElementById('agent-page-link');
  lnk.href = '/agent/' + currentAgent.name;
  lnk.textContent = '🚀 进入 ' + dispName + ' 工作台';

  const sel = document.getElementById('tool-select');
  sel.innerHTML = '<option value="">-- 选择工具 --</option>';
  currentAgent.tools.forEach(t => {
    sel.innerHTML += '<option value="'+t.name+'">'+t.name+': '+t.description+'</option>';
  });

  // Meta
  fetch('/api/agents/'+name).then(r=>r.json()).then(data => {
    document.getElementById('meta-content').innerHTML = '<pre style="font-size:11px">'+JSON.stringify(data,null,2)+'</pre>';
  });

  // Knowledge Base
  loadKnowledge(name);

  document.getElementById('status-left').textContent = '已选择: ' + dispName;

  // Load patients for this agent
  loadPortalPatients(currentAgent.name);
}

async function loadPortalPatients(agentName) {
  var sel = document.getElementById('agent-select-patient');
  sel.innerHTML = '<option value="">-- 加载患者中...</option>';
  try {
    var r = await fetch('/api/patients/' + agentName + '?limit=100');
    var data = await r.json();
    var pts = data.patients || [];
    sel.innerHTML = '<option value="">-- 选择患者 (' + pts.length + '人) --</option>';
    pts.forEach(function(p) {
      var label = p.patient_id + ' — ' + (p.name||'?') + ' (' + (p.age||'?') + '岁) ' + (p.diagnosis||'');
      sel.innerHTML += '<option value="' + p.patient_id + '">' + label + '</option>';
    });
  } catch(e) {
    sel.innerHTML = '<option value="">-- 患者加载失败 --</option>';
  }
}

async function loadKnowledge(name) {
  var el = document.getElementById('knowledge-content');
  el.innerHTML = '加载知识库中...';
  try {
    var r = await fetch('/api/agents/'+name+'/knowledge');
    var data = await r.json();
    if (data.error) { el.innerHTML = '<p>'+data.error+'</p>'; return; }
    var html = '';
    html += '<div style="margin-bottom:16px">';
    html += '<div style="font-weight:500;margin-bottom:4px">指南引用 ('+(data.guidelines_count||0)+' 条)</div>';
    if (data.guidelines && data.guidelines.length > 0) {
      html += '<ul style="margin:0;padding-left:16px">';
      data.guidelines.forEach(function(g) { html += '<li style="margin-bottom:4px">'+g+'</li>'; });
      html += '</ul>';
    } else {
      html += '<div style="color:var(--text-tertiary)">无指南引用</div>';
    }
    html += '</div>';
    html += '<div style="margin-bottom:16px">';
    html += '<div style="font-weight:500;margin-bottom:4px">规则库 ('+(data.rules_count||0)+' 条)</div>';
    if (data.rules && data.rules.length > 0) {
      html += '<ul style="margin:0;padding-left:16px">';
      data.rules.forEach(function(rule) { html += '<li style="margin-bottom:4px">'+rule+'</li>'; });
      html += '</ul>';
    } else {
      html += '<div style="color:var(--text-tertiary)">无规则</div>';
    }
    html += '</div>';
    if (data.knowledge_stats) {
      html += '<div style="border-top:1px solid var(--border);padding-top:8px;font-size:11px;color:var(--text-tertiary)">';
      html += '系统知识库: '+JSON.stringify(data.knowledge_stats);
      html += '</div>';
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<p style="color:var(--danger)">加载失败: '+e.message+'</p>';
  }
}

function onPatientSelect() {
  var pid = document.getElementById('agent-select-patient').value;
  if (!pid) return;
  var ta = document.getElementById('params-input');
  try {
    var params = JSON.parse(ta.value);
    params.patient_id = pid;
    ta.value = JSON.stringify(params, null, 2);
  } catch(e) {
    ta.value = JSON.stringify({patient_id: pid}, null, 2);
  }
}

function onToolChange() {
  const tool = document.getElementById('tool-select').value;
  if (!tool) return;
  const t = currentAgent.tools.find(x=>x.name===tool);
  if (t && t.input) {
    document.getElementById('params-input').value = JSON.stringify(t.input,null,2);
  }
}

async function callTool() {
  const tool = document.getElementById('tool-select').value;
  if (!tool || !currentAgent) return;
  document.getElementById('result-panel').textContent = '调用中...';
  let params = {};
  try { params = JSON.parse(document.getElementById('params-input').value); } catch(e) {
    document.getElementById('result-panel').textContent = 'JSON 格式错误: '+e.message; return;
  }
  const r = await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent:currentAgent.name,tool:tool,params:params})});
  const data = await r.json();
  document.getElementById('result-panel').textContent = JSON.stringify(data,null,2);
  document.getElementById('guard-input').value = JSON.stringify(data,null,2);
  document.getElementById('status-left').textContent = data.status==='ok'?'调用成功':'调用失败';
}

async function guardVerify() {
  const guardText = document.getElementById('guard-input').value.trim();
  if (!guardText) {
    document.getElementById('result-panel').textContent = '请先执行一次工具调用, 或在 Guard 输入框粘贴待验证的 Agent 输出。';
    return;
  }
  const r = await fetch('/api/guard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    output: guardText,
    scenario: document.getElementById('guard-scenario').value,
    agent: currentAgent?.name||''
  })});
  const data = await r.json();
  document.getElementById('result-panel').textContent = JSON.stringify(data,null,2);
}

async function runGuard() { await guardVerify(); }

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab[onclick*="'+tab+'"]').classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('tool-panel').scrollTop = 0;
}

async function sendChat() {
  const msg = document.getElementById('chat-input').value.trim();
  if (!msg) return;
  addChatMsg('user', msg);
  document.getElementById('chat-input').value = '';
  if (!currentAgent) { addChatMsg('agent','请先选择一个 Agent'); return; }
  addChatMsg('agent', '思考中...');
  const thinking = document.querySelector('#chat-messages .chat-msg:last-child');
  const r = await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    agent: currentAgent.name,
    tool: 'reason',
    params: {query: msg}
  })});
  const data = await r.json();
  let reply;
  if (data.status === 'blocked') {
    reply = '⚠ 输出未通过安全校验: ' + (data.error || '') + (data.reply ? '\n---\n' + data.reply : '');
  } else if (data.status === 'ok') {
    reply = data.reply || JSON.stringify(data, null, 2).slice(0, 500);
  } else {
    reply = 'Error: ' + (data.error || '未知错误');
  }
  if (thinking) thinking.textContent = reply; else addChatMsg('agent', reply);
}

function addChatMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'chat-msg chat-'+role;
  div.textContent = text;
  document.getElementById('chat-messages').appendChild(div);
  div.scrollIntoView();
}

async function loadLlmConfig() {
  try {
    const r = await fetch('/api/config/llm');
    const d = await r.json();
    const st = document.getElementById('llm-config-status');
    st.textContent = d.configured ? `已配置 (key: ${d.masked_key}, 模型: ${d.model})` : '未配置 API Key (聊天使用离线 Mock 模式)';
    st.style.color = d.configured ? 'var(--success)' : 'var(--warning)';
  } catch(e) {}
}
async function saveApiKey() {
  const key = document.getElementById('llm-key-input').value.trim();
  if(!key){ return; }
  await fetch('/api/config/llm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key})});
  document.getElementById('llm-key-input').value = '';
  loadLlmConfig();
}
async function clearApiKey() {
  await fetch('/api/config/llm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:'',clear:true})});
  loadLlmConfig();
}
loadLlmConfig();

init();
</script>
