<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAIP-0710 vs xhaip 深度架构比对 — 全维度 Audit</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#21262d; --text:#c9d1d9; --dim:#8b949e; --bright:#f0f6fc; --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#a371f7; --orange:#d2773f; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); line-height:1.65; font-size:14px; }
.container { max-width:1500px; margin:0 auto; padding:0 20px 40px; }

/* Tabs */
.tab-nav { display:flex; gap:2px; background:var(--bg); padding:16px 20px 0; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--border); overflow-x:auto; }
.tab-btn { padding:10px 16px; border:none; background:transparent; color:var(--dim); cursor:pointer; font-size:0.82em; white-space:nowrap; border-bottom:2px solid transparent; transition:all 0.2s; font-family:inherit; }
.tab-btn:hover { color:var(--bright); }
.tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
.tab-content { display:none; padding:24px 0; }
.tab-content.active { display:block; }

/* Dashboard KPI */
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:30px; }
.kpi-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:22px; text-align:center; }
.kpi-card.p1 { border-top:3px solid var(--blue); }
.kpi-card.p2 { border-top:3px solid var(--green); }
.kpi-card.p3 { border-top:3px solid var(--purple); }
.kpi-card.p4 { border-top:3px solid var(--red); }
.kpi-card .num { font-size:2.4em; font-weight:700; color:var(--bright); }
.kpi-card.p1 .num { color:var(--blue); }
.kpi-card.p2 .num { color:var(--green); }
.kpi-card.p3 .num { color:var(--purple); }
.kpi-card.p4 .num { color:var(--red); }
.kpi-card .label { font-size:0.78em; color:var(--dim); margin-top:6px; text-transform:uppercase; letter-spacing:1px; }
.kpi-card .sub { font-size:0.72em; color:var(--dim); margin-top:4px; }

/* Section */
.section { margin-bottom:36px; }
.section h2 { font-size:1.3em; color:var(--bright); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.section .desc { color:var(--dim); font-size:0.85em; margin-bottom:16px; }

/* Tables */
.cmp-table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
.cmp-table th { background:#1c2128; padding:11px 14px; text-align:left; font-weight:600; font-size:0.78em; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
.cmp-table td { padding:10px 14px; border-top:1px solid var(--border); font-size:0.85em; vertical-align:top; }
.cmp-table .dim-col { color:var(--bright); font-weight:600; width:16%; }
.cmp-table .haip-col { width:37%; color:var(--blue); }
.cmp-table .xhaip-col { width:37%; color:var(--green); }
.cmp-table .arrow-col { text-align:center; width:10%; color:var(--dim); font-size:1.1em; }
.cmp-table tr:hover td { background:#1c2128; }
.cmp-table .lead { font-weight:600; }
.cmp-table .lead.haip-lead { color:var(--blue); }
.cmp-table .lead.xhaip-lead { color:var(--green); }
.cmp-table .draw { color:var(--yellow); }

/* Code blocks */
.code-box { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:14px 18px; margin-bottom:14px; overflow-x:auto; }
.code-box pre { color:var(--text); font-family:"SF Mono","Cascadia Code","Consolas",monospace; font-size:0.78em; line-height:1.5; white-space:pre; }
.code-box .kw { color:#ff7b72; }
.code-box .str { color:#a5d6ff; }
.code-box .fn { color:#d2a8ff; }
.code-box .cm { color:#6e7681; }

/* Two column */
.col2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
.col2 .col { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; }
.col2 .col h4 { color:var(--bright); font-size:0.92em; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.col2 .col.haip-col { border-left:3px solid var(--blue); }
.col2 .col.xhaip-col { border-left:3px solid var(--green); }

/* Flow */
.flow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:10px 0; }
.flow .node { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-size:0.78em; color:var(--dim); }
.flow .node.active { border-color:var(--green); color:var(--green); }
.flow .arrow { color:var(--dim); }

/* Bars */
.bars { display:flex; flex-direction:column; gap:8px; }
.bar-row { display:flex; align-items:center; gap:10px; }
.bar-label { width:80px; font-size:0.75em; color:var(--dim); text-align:right; flex-shrink:0; }
.bar-track { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; transition:width 0.6s; }
.bar-fill.blue { background:linear-gradient(90deg,#1f6feb,var(--blue)); }
.bar-fill.green { background:linear-gradient(90deg,#238636,var(--green)); }
.bar-val { width:40px; font-size:0.7em; color:var(--dim); text-align:left; }

/* Gauge */
.gauge-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:20px; }
.gauge-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
.gauge-card h4 { color:var(--bright); font-size:0.88em; margin-bottom:10px; }
.gauge-val { font-size:2em; font-weight:700; }
.gauge-val.green { color:var(--green); }
.gauge-val.blue { color:var(--blue); }
.gauge-val.yellow { color:var(--yellow); }
.gauge-val.red { color:var(--red); }
.gauge-desc { font-size:0.72em; color:var(--dim); margin-top:4px; }

/* Tags */
.tag { display:inline-block; padding:2px 8px; border-radius:12px; font-size:0.7em; font-weight:600; margin:0 2px; }
.tag.g { background:#1a3726; color:var(--green); }
.tag.b { background:#1a2e44; color:var(--blue); }
.tag.r { background:#3b1b1b; color:var(--red); }
.tag.y { background:#3b341b; color:var(--yellow); }
.tag.p { background:#2a1b3b; color:var(--purple); }
.tag.o { background:#3b2a1a; color:var(--orange); }

/* Gap list */
.gap-list { list-style:none; }
.gap-list li { padding:12px 16px; margin-bottom:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; font-size:0.85em; }
.gap-list li .gtitle { color:var(--bright); font-weight:600; }
.gap-list li .gbody { color:var(--dim); margin-top:4px; }
.gap-list li.solved { border-left:3px solid var(--green); }
.gap-list li.open { border-left:3px solid var(--red); }
.gap-list li.partial { border-left:3px solid var(--yellow); }

/* Directory tree */
.tree { font-family:"SF Mono","Consolas",monospace; font-size:0.78em; line-height:1.8; color:var(--dim); }
.tree .d { color:var(--blue); }
.tree .f { color:var(--green); }
.tree .c { color:#6e7681; }

/* Highlight box */
.hl-box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px 20px; margin-bottom:16px; font-size:0.85em; }
.hl-box.insight { border-left:3px solid var(--purple); }
.hl-box.warn { border-left:3px solid var(--yellow); }
.hl-box .hl-title { color:var(--bright); font-weight:600; margin-bottom:6px; }

/* Grid */
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
.grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }

@media (max-width:900px) { .col2,.grid3,.grid4,.kpi-grid { grid-template-columns:1fr; } }
</style>
</head>

<div class="tab-nav" id="tabNav"></div>
<div class="container" id="tabContainer"></div>

<script>
const tabs = [
  {id:'dashboard',label:'仪表盘'},
  {id:'arch',label:'架构模型'},
  {id:'agent',label:'Agent 生命周期'},
  {id:'engine',label:'引擎核心'},
  {id:'knowledge',label:'知识资产'},
  {id:'togaf',label:'TOGAF 治理'},
  {id:'data',label:'数据 & 患者'},
  {id:'security',label:'安全 & 权限'},
  {id:'devops',label:'部署 & CI/CD'},
  {id:'audit',label:'迁移审计'},
];

let nav='',cont='';
tabs.forEach((t,i)=>{
  nav+=`<button class="tab-btn${i===0?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`;
  cont+=`<div class="tab-content${i===0?' active':''}" id="tab-${t.id}"></div>`;
});
document.getElementById('tabNav').innerHTML=nav;
document.getElementById('tabContainer').innerHTML=cont;

function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.textContent===tabs.find(t=>t.id===id).label));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+id));
}
</script>
