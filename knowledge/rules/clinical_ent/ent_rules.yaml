# 耳鼻喉科临床规则 — 听力分级 + 鼻窦炎CRS标准 + 扁桃体Paradise + 鼻出血管理
rule_type: diagnosis
department: 耳鼻喉科
capability: cap-l3-ent-diagnosis
business_process: bp-ent-diagnosis
data_entities:
  consumes: [de-patient, de-exam-ent, de-audiometry, de-imaging-ct-sinus]
  produces: [de-diagnosis-result]
guideline: 中国耳鼻喉科临床诊疗指南（2022）
stakeholder: 耳鼻喉科医师需评估听力损失程度、鼻窦炎与头颈肿瘤
version: "1.0.0"

rules:
  - id: ent-hearing-loss-moderate
    description: 纯音听阈 41-55 dB → 中度听力损失
    condition:
      and:
        - {field: audiometry.pta_dB, operator: ">=", value: 41}
        - {field: audiometry.pta_dB, operator: "<=", value: 55}
    result:
      diagnosis: 中度听力损失
      severity: 影响日常交流
      recommendation: 助听器验配 + 听力康复

  - id: ent-hearing-loss-severe
    description: 纯音听阈 71-90 dB → 重度听力损失
    condition:
      and:
        - {field: audiometry.pta_dB, operator: ">=", value: 71}
        - {field: audiometry.pta_dB, operator: "<=", value: 90}
    result:
      diagnosis: 重度听力损失
      severity: 严重影响沟通
      recommendation: 大功率助听器或人工耳蜗评估

  - id: ent-crs-diagnosis
    description: 鼻塞+脓涕+面部胀痛 ≥ 12周 → 慢性鼻窦炎
    condition:
      and:
        - {field: exam.nasal_obstruction, operator: "==", value: true}
        - {field: exam.purulent_discharge, operator: "==", value: true}
        - {field: exam.symptom_duration_weeks, operator: ">=", value: 12}
    result:
      diagnosis: 慢性鼻窦炎（CRS）
      severity: 需内镜+CT评估
      recommendation: 鼻内镜检查 + 鼻窦CT + 鼻腔盐水冲洗+鼻用激素

  - id: ent-laryngeal-ca-early
    description: 持续声嘶 > 3周 + 吸烟史 → 喉镜排除喉癌
    condition:
      and:
        - {field: exam.hoarseness_duration_weeks, operator: ">", value: 3}
        - {field: patient.smoking_pack_years, operator: ">", value: 20}
    result:
      diagnosis: 疑似喉癌
      severity: 需排除恶性
      recommendation: 电子喉镜 + 窄带成像（NBI）+ 可疑病变活检

---
rule_type: risk_score
department: 耳鼻喉科
capability: cap-l3-ent-risk
business_process: bp-ent-risk
data_entities:
  consumes: [de-patient, de-exam-ent, de-audiometry, de-imaging-ct-sinus]
  produces: [de-risk-assessment]
guideline: 中国耳鼻喉科临床诊疗指南（2022）
stakeholder: 评估扁桃体切除指征、鼻出血风险与CRS手术必要性
version: "1.0.0"

rules:
  - id: ent-tonsillectomy-paradise
    description: Paradise标准：1年≥7次 或 2年每年≥5次 或 3年每年≥3次 → 扁桃体切除
    condition:
      or:
        - {field: exam.tonsillitis_episodes_1yr, operator: ">=", value: 7}
        - {field: exam.tonsillitis_episodes_2yr_per_year, operator: ">=", value: 5}
        - {field: exam.tonsillitis_episodes_3yr_per_year, operator: ">=", value: 3}
    result:
      risk: 符合Paradise扁桃体切除标准
      severity: 反复发作影响生活质量
      recommendation: 扁桃体切除术 ± 腺样体切除术

  - id: ent-osahs-moderate
    description: AHI 15-30 → 中重度OSAHS
    condition:
      and:
        - {field: exam.ahi, operator: ">=", value: 15}
        - {field: exam.ahi, operator: "<=", value: 30}
    result:
      risk: 中重度阻塞性睡眠呼吸暂停
      severity: 心血管并发症风险
      recommendation: CPAP或UPPP手术评估

  - id: ent-epistaxis-posterior
    description: 后鼻孔出血+血流不止 → 后鼻道填塞
    condition:
      and:
        - {field: exam.epistaxis_site, operator: "==", value: posterior}
        - {field: exam.bleeding_ongoing, operator: "==", value: true}
    result:
      risk: 后鼻孔出血
      severity: 高危（大量失血+误吸）
      recommendation: 后鼻道气囊填塞 + 补液 + 耳鼻喉科急诊

  - id: ent-crs-surgery
    description: CRS药物治疗失败（>3月规范治疗）→ FESS
    condition:
      and:
        - {field: diagnosis.crs_confirmed, operator: "==", value: true}
        - {field: treatment.medical_failure_3mo, operator: "==", value: true}
    result:
      risk: 难治性慢性鼻窦炎
      severity: 药物难治
      recommendation: 功能性内镜鼻窦手术（FESS）

---
rule_type: treatment
department: 耳鼻喉科
capability: cap-l3-ent-treatment
business_process: bp-ent-treatment
data_entities:
  consumes: [de-diagnosis-result, de-risk-assessment]
  produces: [de-treatment-plan]
guideline: 中国耳鼻喉科临床诊疗指南（2022）
stakeholder: 根据听力分级、鼻窦炎与扁桃体评估制定手术或药物治疗方案
version: "1.0.0"

rules:
  - id: ent-chronic-otitis-media
    description: 慢性化脓性中耳炎 + 鼓膜穿孔 → 鼓室成形术
    condition:
      and:
        - {field: diagnosis.chronic_otitis_media, operator: "==", value: true}
        - {field: exam.tympanic_perforation, operator: "==", value: true}
    result:
      treatment: 鼓室成形术（I型）
      indication: 慢性化脓性中耳炎静止期
      requirement: 干耳 ≥ 4周

  - id: ent-nasopharyngeal-ca-screening
    description: EBV-VCA IgA ≥ 1:80 + 颈部淋巴结 → 鼻咽镜
    condition:
      and:
        - {field: lab.ebv_vca_iga, operator: ">=", value: 80}
        - {field: exam.cervical_lymph_node, operator: "==", value: enlarged}
    result:
      treatment: 鼻咽镜 + 活检
      indication: 鼻咽癌高风险
      followup: 鼻咽部MRI + 病理确诊后放疗

  - id: ent-allergic-rhinitis
    description: 中重度过敏性鼻炎 → 鼻用激素 + 抗组胺
    condition:
      and:
        - {field: exam.allergic_rhinitis_moderate_severe, operator: "==", value: true}
        - {field: lab.specific_ige_positive, operator: "==", value: true}
    result:
      treatment: 鼻用糖皮质激素 + 口服/鼻用抗组胺药
      indication: 中重度持续性过敏性鼻炎
      escalation: 若药物治疗失败 → 免疫治疗评估
