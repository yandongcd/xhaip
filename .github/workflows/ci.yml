name: xhaip CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Validate agents list
        run: python -m haip list
      - name: Validate agent YAML schema
        run: |
          pip install jsonschema
          python scripts/validate_agents.py

  lint:
    name: "Ruff + MyPy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Ruff check
        run: python -m ruff check .
      - name: MyPy check
        run: python -m mypy packages/haip-core/haip/ --show-error-codes --no-error-summary
      - name: CSS syntax check
        run: python -c "
import re, sys
css_files = ['packages/haip-core/haip/static/process.css']
errors = 0
for f in css_files:
    try:
        with open(f) as fh:
            c = fh.read()
        depth = 0
        for i, ch in enumerate(c):
            if ch == '{': depth += 1
            elif ch == '}': depth -= 1
            if depth < 0:
                print(f'ERROR {f}: unbalanced }} at pos {i}')
                errors += 1
                break
        if '{{' in c or '}}' in c:
            print(f'ERROR {f}: double braces found')
            errors += 1
    except FileNotFoundError:
        print(f'WARN {f}: not found')
sys.exit(errors)
"

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Contract + unit tests
        run: python -m pytest packages/haip-core/tests/ tests/test_self_contained.py --tb=short

  integration:
    name: "Integration tests"
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

  coverage:
    name: "Coverage (>=70%)"
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run tests with coverage
        run: python -m pytest packages/haip-core/tests/ tests/integration/ --cov=packages/haip-core/haip --cov-report=term --cov-report=html --cov-fail-under=75 --tb=short
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  docker-test:
    name: "Docker build smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose build check
        run: docker compose -f docker-compose.yml build --no-cache