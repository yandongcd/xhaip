name: xhaip CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: "Linter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run xhaip validate
        run: python -m haip list

  lint:
    name: "Ruff + MyPy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Ruff check
        run: python -m ruff check packages/haip-core/haip/ tests/
      - name: MyPy check
        run: python -m mypy packages/haip-core/haip/ --show-error-codes --no-error-summary

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Contract + unit tests
        run: python -m pytest packages/haip-core/tests/ -m "contract or unit" --tb=short

  integration:
    name: "Integration tests"
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

  coverage:
    name: "Coverage (>=70%)"
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run tests with coverage
        run: python -m pytest packages/haip-core/tests/ tests/integration/ --cov=packages/haip-core/haip --cov-report=term --cov-report=html --cov-fail-under=70 --tb=short
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  docker-test:
    name: "Docker build smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose build check
        run: docker compose -f docker-compose.yml build --no-cache 2>&1 || true