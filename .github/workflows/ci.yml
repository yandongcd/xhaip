name: xhaip CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Validate agents list
        run: python -m haip list
      - name: Validate agent YAML schema
        run: |
          pip install jsonschema
          python scripts/validate_agents.py
      - name: Validate agent config consistency
        run: python scripts/validate_config.py
      - name: Validate patient data quality
        run: python scripts/validate_patients.py

  security:
    name: "Secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Run secret scan (baseline)
        run: |
          detect-secrets scan --all-files --disable-plugin KeywordDetector \
            --exclude-files '.*\.db$' --exclude-files '.*\.json$' \
            --exclude-files 'node_modules/.*' --exclude-secrets \
            'mock|test|example|placeholder|dev-secret|change-me' \
            > /tmp/secrets.json 2>&1 || true
          python -c "
          import json, sys
          with open('/tmp/secrets.json') as f:
              data = json.load(f)
          results = data.get('results', {})
          if results:
              print(f'SECRET SCAN FAILED: {len(results)} potential secrets found')
              for path, findings in results.items():
                  for finding in findings:
                      print(f'  {path}:{finding.get(\"line_number\",\"?\")} — {finding.get(\"type\",\"?\")}')
              sys.exit(1)
          print('Secret scan: clean')
          "
      - name: Hardcoded credential check (deploy chain)
        run: |
          patterns=('Admin@123456' 'Doctor@123' 'change-this-to-a-random-string' 'replace-with-random' 'xhaip-pass')
          found=0
          for p in "${patterns[@]}"; do
              matches=$(git grep -nF "$p" -- 'deploy/' 'docker-compose.yml' 'docker/' '.env.example' 'config/' 'Dockerfile' 'scripts/' || true)
              if [ -n "$matches" ]; then
                  echo "HARDCODED CREDENTIAL: $p"
                  echo "$matches"
                  found=1
              fi
          done
          exit $found

  lint:
    name: "Ruff + MyPy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Ruff check
        run: python -m ruff check .
      - name: MyPy check
        run: python -m mypy packages/haip-core/haip/ --show-error-codes --no-error-summary
      - name: CSS syntax check
        run: python -c "
import re, sys
css_files = ['packages/haip-core/haip/static/process.css']
errors = 0
for f in css_files:
    try:
        with open(f) as fh:
            c = fh.read()
        depth = 0
        for i, ch in enumerate(c):
            if ch == '{': depth += 1
            elif ch == '}': depth -= 1
            if depth < 0:
                print(f'ERROR {f}: unbalanced }} at pos {i}')
                errors += 1
                break
        if '{{' in c or '}}' in c:
            print(f'ERROR {f}: double braces found')
            errors += 1
    except FileNotFoundError:
        print(f'WARN {f}: not found')
sys.exit(errors)
"

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Contract + unit tests
        run: python -m pytest packages/haip-core/tests/ tests/integration/ --tb=short -n auto

  integration:
    name: "Root tests (contracts/exceptions/e2e)"
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run root test suite
        run: python -m pytest tests/ --ignore=tests/integration -v --tb=short -n auto

  coverage:
    name: "Coverage (>=70%)"
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "packages/haip-core[dev]"
      - name: Run tests with coverage
        run: python -m pytest packages/haip-core/tests/ tests/ --cov=packages/haip-core/haip --cov-report=term --cov-report=html --cov-fail-under=70 --tb=short
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  docker-test:
    name: "Docker build smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker compose build check
        run: docker compose -f docker-compose.yml build --no-cache