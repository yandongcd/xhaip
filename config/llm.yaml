# xhaip v1.0 — LLM Configuration
# Provider: DeepSeek (default), with temperature and token limits

llm:
  provider: deepseek
  model: deepseek-v4-flash
  api_key: "${DEEPSEEK_API_KEY}"
  api_base: "https://api.deepseek.com/v1"
  temperature: 0.3
  max_tokens: 4096
  timeout: 30
  retry: 2

fallback:
  provider: mock
  mock_responses: true
