# xhaip v1.2 — LLM Configuration
# Provider: DeepSeek (default). Fail-closed on outage (no fabricated content).

llm:
  provider: deepseek
  model: deepseek-v4-flash
  api_key: "${DEEPSEEK_API_KEY}"
  api_base: "https://api.deepseek.com/v1"
  temperature: 0.3
  max_tokens: 4096
  timeout: 30
  retry: 2

fallback:
  provider: fail-closed
  mode: "${HAIP_ENV:test}"  # production=hard fail, test/dev=placeholder message
