    profiles: [surgical, full]
    container_name: xhaip-orthopedic
    ports: ["8765:8765"]
    environment:
      AGENT_NAME: orthopedic-surgery
      AGENT_PORT: "8765"
    depends_on:
      medical-record: {condition: service_healthy}
      metrics: {condition: service_healthy}

  cardio-risk:
