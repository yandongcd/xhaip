# xhaip v1.0 — Multi-Agent Docker Compose
# 按科室分组部署，depend 关系自动处理启动顺序
# 启动子集: docker compose --profile core up
# 启动全部: docker compose --profile full up

x-agent: &agent-base
  build:
    context: .
    dockerfile: docker/Dockerfile.agent
  volumes:
    - ./packages/haip-hospital/agents/definitions:/app/packages/haip-hospital/agents/definitions:ro
    - ./packages/haip-hospital/data:/app/packages/haip-hospital/data:ro
    - ./packages/haip-hospital/knowledge:/app/packages/haip-hospital/knowledge:ro
    - ./packages/haip-hospital/modules:/app/packages/haip-hospital/modules:ro
    - ./config:/app/config:ro
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        cpus: "0.25"
        memory: 128M
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${AGENT_PORT}/api/health')"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  # ============================================================
  # Profile: core — 基础设施 (必须先启动)
  # ============================================================
  medical-record:
    <<: *agent-base
    profiles: [core, full]
    container_name: xhaip-medical-record
    ports: ["8766:8766"]
    environment:
      AGENT_NAME: medical-record
      AGENT_PORT: "8766"

  metrics:
    <<: *agent-base
    profiles: [core, full]
    container_name: xhaip-metrics
    ports: ["8767:8767"]
    environment:
      AGENT_NAME: metrics
      AGENT_PORT: "8767"

  pharmacy:
    <<: *agent-base
    profiles: [core, full]
    container_name: xhaip-pharmacy
    ports: ["8770:8770"]
    environment:
      AGENT_NAME: pharmacy
      AGENT_PORT: "8770"

  # ============================================================
  # Profile: surgical — 外科线
  # ============================================================
  orthopedic-surgery:
